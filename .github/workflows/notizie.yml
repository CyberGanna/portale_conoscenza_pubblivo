name: Notizie dashboard

# Ogni ora raccoglie le notizie dai feed RSS e le salva nel ramo "notizie"
# (memoria di 3 giorni, un solo commit sovrascritto ogni volta, così la cronologia del sito resta pulita).
# La dashboard lo legge da raw.githubusercontent.com.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notizie
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recupera le notizie precedenti
        run: git fetch -q --depth=1 origin notizie && git show FETCH_HEAD:raw.json > dashboard/news/raw.json || true
      - name: Scarica e raggruppa le notizie
        run: node dashboard/news/aggiorna.mjs
      - name: Pubblica nel ramo notizie
        run: |
          mkdir -p /tmp/out && cp dashboard/news/news.json dashboard/news/raw.json /tmp/out/
          cd /tmp/out
          git init -q -b notizie
          git config user.name "notizie-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json raw.json && git commit -q -m "Notizie $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" notizie
