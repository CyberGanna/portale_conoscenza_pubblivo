<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Conoscenza">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Ale Conoscenza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Sora:wght@200..700&display=swap">
</head>
<body>
<style>
/* Layout: a living constellation fills the screen; glass panels float over it (archive left, note right, sheets on phone). Single dark look by choice. */
:root{
  color-scheme:dark;
  --void:#000;
  --ink:#ece8f7;
  --muted:#9890b3;
  --faint:#5d5677;
  --line:rgba(255,255,255,.08);
  --glass:rgba(4,3,8,.66);
  --glass-hi:rgba(10,8,18,.92);
  --core:#b99bff;
  --accent:#a78bfa;
  --accent-ink:#120c24;
  --danger:#fb7185;
  --ok:#5eead4;
  --f-display:"Sora",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-ui:"Sora",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Sora",ui-sans-serif,system-ui,sans-serif;
  --side-w:360px;
  --detail-w:460px;
  --r:14px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
#mtitle{display:none}
body{background:var(--void);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:rgba(167,139,250,.35)}

#stage{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#stage.dragging{cursor:grabbing}
#stage.pointing{cursor:pointer}

/* ---------- glass panels ---------- */
.glass{background:linear-gradient(180deg,rgba(167,139,250,.06),rgba(0,0,0,0) 140px),var(--glass);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);border:1px solid var(--line);border-radius:var(--r);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 30px 80px -20px rgba(0,0,0,.9)}

#side{transition:transform .5s cubic-bezier(.2,.8,.2,1),opacity .4s;position:fixed;z-index:5;top:calc(16px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:var(--side-w);display:flex;flex-direction:column;overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;padding:14px 16px 0}
.brand h1{margin:0;font-family:var(--f-display);font-weight:300;font-size:24px;letter-spacing:-.02em;line-height:1}
.brand h1 em{color:var(--core);font-style:normal;font-weight:600;text-shadow:0 0 24px rgba(185,155,255,.55)}
.brand .count{margin-left:0;margin-right:4px;font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em;font-variant-numeric:tabular-nums}

#compose{padding:10px 16px 14px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
#compose label{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.inputwrap{position:relative;border-radius:12px;background:rgba(0,0,0,.65);border:1px solid var(--line);transition:border-color .2s, box-shadow .2s}
.inputwrap:focus-within{border-color:rgba(185,155,255,.6);box-shadow:0 0 0 4px rgba(167,139,250,.12),0 0 30px -6px rgba(167,139,250,.5)}
#q{display:block;width:100%;min-height:74px;max-height:180px;resize:none;border:0;background:transparent;padding:12px 14px 40px;outline:none;font-size:15px;line-height:1.45}
#q::placeholder{color:var(--faint)}
#go{position:absolute;right:8px;bottom:8px;border:0;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:13px;padding:7px 12px;display:flex;align-items:center;gap:6px;box-shadow:0 0 22px -4px rgba(167,139,250,.8)}
#go:disabled{opacity:.45;box-shadow:none;cursor:default}
#photo{position:absolute;left:8px;bottom:8px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.04);color:var(--ink);font-size:13px;font-weight:500;padding:6px 10px;display:flex;align-items:center;gap:6px;cursor:pointer}
#photo:hover{border-color:rgba(185,155,255,.6);color:#fff}
#photo:disabled{opacity:.45;cursor:default}
.d-photo{margin:14px 0 4px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#07060b;min-height:120px;display:flex;align-items:center;justify-content:center}
.d-photo img{display:block;width:100%;max-height:420px;object-fit:contain}
.d-photo .ph-wait{font-size:12px;color:var(--faint)}
.scheda{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0;font-size:14px;line-height:1.45}
.scheda dt{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.scheda dd{margin:0;color:var(--ink)}
.conf{display:inline-block;margin-left:8px;font-size:10px;letter-spacing:.08em;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);vertical-align:middle}
.th-photo{width:140px;height:140px;object-fit:cover;border-radius:14px;border:1px solid var(--line);margin-bottom:6px}
.hint{font-size:12px;color:var(--faint)}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.02);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted);transition:color .15s,border-color .15s,background .15s}
.chip:hover{color:var(--ink);border-color:rgba(185,155,255,.5);background:rgba(167,139,250,.08)}

.tabs{display:flex;gap:2px;padding:10px 10px 0}
.tab{flex:1;border:0;background:transparent;padding:8px 2px;border-radius:9px;font-size:12.5px;white-space:nowrap;color:var(--muted);font-weight:500}
.tab[aria-selected="true"]{background:rgba(167,139,250,.14);color:var(--ink)}
.view{flex:1;overflow:auto;padding:12px 12px 16px;min-height:0;overscroll-behavior:contain}
.view::-webkit-scrollbar{width:8px}.view::-webkit-scrollbar-thumb{background:rgba(167,139,250,.18);border-radius:8px}

#search{width:100%;border:1px solid var(--line);background:rgba(0,0,0,.55);border-radius:10px;padding:8px 12px;outline:none;font-size:13px;margin-bottom:10px}
#search:focus{border-color:rgba(185,155,255,.5)}
.cat{border-radius:10px;margin-bottom:2px}
.cat>button{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:8px 8px;border-radius:10px;text-align:left}
.cat>button:hover{background:rgba(255,255,255,.03)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 10px 1px currentColor;background:currentColor}
.cat .name{font-weight:500;text-transform:capitalize}
.cat .n{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.cat .chev{color:var(--faint);transition:transform .2s;font-size:11px}
.cat.open .chev{transform:rotate(90deg)}
.notes{display:none;padding:0 0 6px 27px}
.cat.open .notes,.searching .notes{display:block}
.note-item{display:block;width:100%;border:0;background:transparent;text-align:left;padding:6px 8px;border-radius:8px;color:var(--ink)}
.note-item:hover,.note-item.active{background:rgba(167,139,250,.1)}
.note-item .t{font-size:13.5px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-item .s{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.badge{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:1px}
.empty{color:var(--muted);font-size:13px;padding:14px 8px;line-height:1.6}
.section-label{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:14px 8px 6px}
.linkbtn{border:0;background:transparent;color:var(--muted);font-size:12px;text-decoration:underline;text-underline-offset:3px;padding:4px 8px}
.linkbtn:hover{color:var(--ink)}

/* translate */
.tr-dir{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.seg{display:flex;background:rgba(0,0,0,.55);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:7px;padding:5px 10px;font-size:12.5px;color:var(--muted);font-family:var(--f-mono)}
.seg button[aria-pressed="true"]{background:rgba(167,139,250,.18);color:var(--ink)}
#tr-in{display:block;width:100%;min-height:64px;resize:vertical;border:1px solid var(--line);background:rgba(0,0,0,.55);border-radius:12px;padding:10px 12px;outline:none;font-size:15px}
.tr-src{font-size:13px;color:#cfc6ec;margin-bottom:6px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.tr-fix{font-size:11.5px;color:#86efac;font-style:italic}
#tr-in:focus{border-color:rgba(185,155,255,.5)}
.btn{border:1px solid var(--line);background:rgba(167,139,250,.1);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:rgba(167,139,250,.18)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600;box-shadow:0 0 22px -6px rgba(167,139,250,.8)}
.btn:disabled{opacity:.45;cursor:default}
.btn.danger{color:var(--danger);background:transparent;border-color:rgba(251,113,133,.3)}
.btn.danger.armed{background:var(--danger);color:#1a0610}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tr-out{margin-top:14px;padding:14px;border-radius:12px;background:rgba(0,0,0,.6);border:1px solid var(--line)}
.tr-main{font-family:var(--f-display);font-weight:300;font-size:26px;letter-spacing:-.02em;line-height:1.2}
.tr-meta{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:4px}
.tr-out p{margin:10px 0 0;color:#cfc8e6}
.tr-ex{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.tr-ex li{font-size:13px;border-left:2px solid rgba(167,139,250,.4);padding-left:10px}
.tr-ex li span{display:block;color:var(--muted)}
.say{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;flex:none;border-radius:50%;border:1px solid rgba(167,139,250,.35);background:rgba(167,139,250,.1);color:#d9ccff;padding:0;cursor:pointer;vertical-align:middle;transition:background .15s}
.say:hover{background:rgba(167,139,250,.22)}.say svg{width:15px;height:15px}
.say.on{background:rgba(167,139,250,.35);color:#fff}
.say.sm{width:26px;height:26px}.say.sm svg{width:13px;height:13px}
.trh-row{display:flex;align-items:center;gap:4px}
.q-say{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 2px}
.q-say .w{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:#d9ccff;border:1px solid rgba(167,139,250,.25);border-radius:999px;padding:3px 10px 3px 3px}
.tr-hist .trh-row>button[data-i]{display:flex;flex:1;min-width:0;gap:8px;border:0;background:transparent;padding:6px 8px;border-radius:8px;text-align:left;font-size:13px}
.tr-hist .trh-row>button[data-i]:hover{background:rgba(167,139,250,.08)}
.tr-hist .a{color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr-hist .b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- detail ---------- */
#detail{position:fixed;z-index:6;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:var(--detail-w);display:flex;flex-direction:column;overflow:hidden;transform:translateX(calc(100% + 40px));transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#detail.open{transform:none}
.d-head{display:flex;align-items:center;gap:8px;padding:12px 12px 0 18px}
.d-cat{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.iconbtn{margin-left:auto;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:transparent;display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{color:var(--ink);background:rgba(255,255,255,.04)}
.d-body{flex:1;overflow:auto;padding:6px 22px 28px;min-height:0;overscroll-behavior:contain}
.d-body::-webkit-scrollbar{width:8px}.d-body::-webkit-scrollbar-thumb{background:rgba(167,139,250,.18);border-radius:8px}
.d-title{font-family:var(--f-display);font-weight:300;font-size:34px;letter-spacing:-.03em;line-height:1.08;margin:10px 0 6px;text-wrap:balance}
.d-kind{font-family:var(--f-mono);font-size:11px;color:var(--faint);letter-spacing:.06em}
.d-input{margin:14px 0 0;padding:12px 14px;border-left:2px solid var(--core);background:rgba(167,139,250,.06);border-radius:0 10px 10px 0;font-family:var(--f-display);font-weight:300;font-size:16.5px;line-height:1.5;color:#ddd3fb}
.d-input small{display:block;font-family:var(--f-ui);font-style:normal;font-size:12px;color:var(--muted);margin-top:6px}
.d-sum{font-size:15.5px;line-height:1.55;font-weight:400;color:#ddd7ef;margin:16px 0 4px;max-width:62ch}
.md{font-size:14px;line-height:1.75;font-weight:300;color:#cfc8e4;max-width:65ch}
.md p{margin:.7em 0}.md strong{color:var(--ink)}.md h1,.md h2,.md h3{font-family:var(--f-display);font-weight:500;color:var(--ink);font-size:17px;margin:1.1em 0 .3em}
.md ul,.md ol{padding-left:1.2em}.md li{margin:.25em 0}
.md code{font-family:var(--f-mono);font-size:.9em;background:rgba(167,139,250,.12);padding:1px 5px;border-radius:5px}
.md-tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:.9em 0;border:1px solid rgba(185,155,255,.28);border-radius:10px}
.md table{border-collapse:collapse;width:100%;font-size:13px;line-height:1.45}
.md th,.md td{border:1px solid rgba(185,155,255,.2);padding:7px 9px;text-align:left;vertical-align:top;min-width:84px;overflow-wrap:break-word;hyphens:auto}
.md tr>:first-child{border-left:0}.md tr>:last-child{border-right:0}.md thead tr:first-child>*{border-top:0}.md tbody tr:last-child>*{border-bottom:0}
.md th{background:rgba(185,155,255,.12);color:var(--ink);font-weight:600}
.md tbody tr:nth-child(even){background:rgba(255,255,255,.025)}
.md blockquote{margin:.8em 0;padding-left:12px;border-left:2px solid var(--line);color:var(--muted)}
.d-sec{margin-top:24px}
.d-sec h3{font-family:var(--f-mono);font-weight:500;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;display:flex;align-items:center;gap:10px}
.d-sec h3::after{content:"";flex:1;height:1px;background:var(--line)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.list li{position:relative;padding-left:18px;font-size:13.5px;font-weight:300;line-height:1.6;color:#cfc8e4}
.list li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--c,var(--accent));box-shadow:0 0 8px var(--c,var(--accent))}
.links{display:flex;flex-wrap:wrap;gap:6px}
.links .chip.known{color:var(--ink);border-color:color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tags span{font-family:var(--f-mono);font-size:11px;color:var(--faint)}
.d-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}

.qa{display:flex;flex-direction:column;gap:12px}
.qa-item .qq{font-weight:600;font-size:14px;padding-right:30px}
.qa-item{position:relative}
.qa-del{position:absolute;top:-2px;right:-4px;width:28px;height:28px;border-radius:8px;border:1px solid transparent;background:none;color:var(--mute,#9890b3);font-size:13px;cursor:pointer;opacity:.65}
.qa-del:hover,.qa-del:focus-visible{opacity:1;border-color:var(--line);color:#fb7185}
.ig-fig{min-height:120px;border-radius:12px;overflow:hidden;background:#0b0912;margin:4px 0 10px}
.ig-fig svg{display:block;width:100%;height:auto;max-height:640px}
.ig-fig .inline-think{padding:18px}
.qa-form{display:flex;gap:8px;margin-top:4px}
.qa-form input{flex:1;min-width:0;border:1px solid var(--line);background:rgba(0,0,0,.55);border-radius:10px;padding:8px 12px;outline:none;font-size:13.5px}
.qa-form input:focus{border-color:rgba(185,155,255,.5)}

/* schema */
.wl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.wl,.wn-i{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03);text-decoration:none;color:var(--ink)}
.wl:hover,.wn-i:hover{border-color:color-mix(in srgb,var(--c) 60%,transparent);background:color-mix(in srgb,var(--c) 8%,transparent)}
.wl b,.wn-i b{font-size:13.5px;font-weight:600;color:#fff}.wl b::after,.wn-i b::after{content:" ↗";color:var(--muted);font-weight:400}
.wl small,.wn-i small{font-size:11.5px;color:var(--muted)}
.wn{display:flex;flex-direction:column;gap:8px}.wn-i span{font-size:13px;color:#cfc8e6;margin-top:2px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:10px}.gal:empty{display:none}
.gal figure{position:relative;margin:0;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#07060b}
.gal img{display:block;width:100%;height:120px;object-fit:cover}
.gal button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;cursor:pointer;font-size:12px}

.mit{gap:14px;padding:18px 12px 14px;background:#08070c}
.mit-title{font-size:17px;font-weight:600;color:#fff;text-align:center;line-height:1.3;padding:0 6px}
.mit .xg-sec svg{max-width:440px;margin:0 auto}
.mit-exp{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line)}
.mit-exp p{margin:0;font-size:14.5px;line-height:1.55;color:var(--ink)}
.mit-inf{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5}
.mit-inf b{color:#fca5a5;font-weight:600}
.mit-tw{overflow-x:auto}
.mit-t{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px;line-height:1.4}
.mit-t th{text-align:left;padding:8px 10px;color:var(--c);font-weight:600;border-bottom:1px solid color-mix(in srgb,var(--c) 50%,transparent)}
.mit-t td{padding:8px 10px;border-bottom:1px solid var(--line);color:var(--ink);vertical-align:top}
.mit-t td:first-child{font-weight:600;color:#fff}

.el{cursor:default;gap:18px;padding:18px 12px 16px}
.el p{margin:0}
.el-head{display:flex;flex-direction:column;gap:8px;text-align:center}
.el-one{font-size:16px;line-height:1.5;color:#fff;font-weight:500}
.el-k{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.el-ana{display:flex;gap:14px;align-items:flex-start;padding:14px;border-radius:14px;background:rgba(252,211,77,.07);border:1px dashed rgba(252,211,77,.45)}
.el-ana-e{font-size:38px;line-height:1}
.el-ana b{display:block;font-family:"Kalam",var(--f-ui);font-size:18px;color:#fcd34d;margin-bottom:2px}
.el-ana p{font-size:15px;line-height:1.55;color:var(--ink)}
.el-chips{display:flex;flex-wrap:wrap;gap:8px}
.el-chip{display:inline-flex;flex-direction:column;padding:8px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03);font-size:14px;font-weight:600;color:var(--ink)}
.el-chip small{font-weight:400;font-size:11.5px;color:var(--muted)}
.el-chip.hero{border-color:color-mix(in srgb,var(--c) 60%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent)}
.el-scene{border-top:1px dashed rgba(255,255,255,.1);padding-top:16px}
.el-step{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.08em}
.el-step span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#0b0816;font-weight:700;font-size:13px;font-family:var(--f-ui)}
.el-scene h4{font-family:"Kalam",var(--f-ui);font-size:21px;font-weight:700;margin:8px 0 6px;color:#fff;line-height:1.2}
.el-scene .xg-sec{cursor:zoom-in}
.el-cap{font-size:15.5px;line-height:1.6;color:var(--ink);margin-top:8px!important}
.el-more{margin-top:10px;font-size:13.5px;color:var(--muted)}
.el-more summary{cursor:pointer;color:#c4b5fd;font-weight:500}
.el-more p{margin-top:6px!important;line-height:1.55;color:#cfc8e6}
.el-lim{padding:12px 14px;border-radius:12px;background:rgba(248,113,113,.07);border:1px solid rgba(248,113,113,.3)}
.el-lim b{font-size:13.5px;color:#fca5a5}.el-lim p{font-size:14px;line-height:1.5;margin-top:4px!important}
.el-real{padding:14px;border-radius:12px;background:#07140d;border:1px solid #2c4a37}
.el-real h4{margin:0 0 8px;font-family:"Kalam",var(--f-ui);font-size:19px;color:#bbf7d0}
.el-real ol,.el-recap ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14.5px;line-height:1.5}
.el-real li{color:#d1fae5}
.el-gl dl{margin:0;font-size:14px;line-height:1.45}
.el-gl dt{margin-top:8px}
.el-gl dt{font-weight:700;color:var(--c)}.el-gl dd{margin:0;color:var(--ink)}
.el-recap{padding:14px;border-radius:12px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.35)}
.el-recap li{color:#fff;font-weight:500}
.el-quiz{padding:14px;border-radius:12px;border:1px solid color-mix(in srgb,var(--c) 50%,transparent);background:color-mix(in srgb,var(--c) 8%,transparent)}
.el-quiz summary{cursor:pointer;font-size:15px;font-weight:600;color:#fff;list-style:none}
.el-quiz summary .el-k{display:block}
.el-quiz summary::after{content:" Tocca per la risposta";display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:4px}
.el-quiz[open] summary::after{content:""}
.el-quiz p{margin-top:8px!important;font-size:14.5px;line-height:1.55;color:var(--ink)}

.xg{padding:16px 6px 10px;display:flex;flex-direction:column;gap:26px;cursor:zoom-in;background:#050407}
.xg-title{font-family:"Kalam",var(--f-ui);font-weight:700;font-size:24px;color:#fff;text-align:center;line-height:1.15;padding:0 8px}
.xg-sec svg{display:block;width:100%;height:auto}
.xg-sec+.xg-sec{border-top:1px dashed rgba(255,255,255,.1);padding-top:22px}
#xzoom{position:fixed;inset:0;z-index:9999;background:#000;overflow:auto;-webkit-overflow-scrolling:touch;padding:56px 16px 40px}
#xzoom .xz-in{max-width:760px;margin:0 auto}
#xzoom .xg{cursor:default;border:0;background:none}
@media (max-width:860px){#xzoom{padding:56px 8px 40px}#xzoom .xz-in{width:150%;max-width:none}}
.xz-close{position:fixed;top:12px;right:14px;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:#111;color:#fff;font-size:18px;cursor:pointer;z-index:10000}

.schema{margin-top:8px;padding:18px 14px 16px;border-radius:14px;background:radial-gradient(120% 80% at 50% 0%,rgba(167,139,250,.14),rgba(7,6,12,.4) 60%);border:1px solid var(--line);overflow:hidden}
.sc-root{display:flex;justify-content:center}
.sc-root span{display:inline-block;max-width:90%;text-align:center;padding:10px 18px;border-radius:999px;border:1px solid color-mix(in srgb,var(--c) 70%,transparent);background:color-mix(in srgb,var(--c) 18%,#0b0915);font-family:var(--f-display);font-weight:400;font-size:18px;letter-spacing:-.01em;line-height:1.2;box-shadow:0 0 30px -4px color-mix(in srgb,var(--c) 60%,transparent)}
.sc-trunk{width:1px;height:18px;margin:0 auto;background:linear-gradient(var(--c),transparent)}
.sc-branches{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;position:relative}
.sc-b{position:relative;padding:12px 12px 10px;border-radius:12px;background:rgba(11,9,21,.75);border:1px solid var(--line);border-top:2px solid var(--bc)}
.sc-b h4{margin:0 0 8px;font-size:13.5px;font-weight:600;color:var(--ink);display:flex;gap:8px;align-items:baseline}
.sc-b h4 i{font-style:normal;font-family:var(--f-mono);font-size:10px;color:var(--bc)}
.sc-b ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.sc-b li{font-size:12.5px;line-height:1.45;color:#c8c1de;padding-left:12px;position:relative}
.sc-b li::before{content:"";position:absolute;left:0;top:.6em;width:5px;height:1px;background:var(--bc)}
.sc-key{margin-top:14px;padding:10px 12px;border-radius:10px;font-size:13.5px;color:#ddd5f7;background:rgba(167,139,250,.08);border:1px dashed rgba(167,139,250,.35)}
.sc-key b{font-family:var(--f-mono);font-weight:500;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px}

.dg{padding:14px 10px 14px;display:flex;flex-direction:column;gap:18px}
.dg-fig{margin:0}
.dg-fig figcaption{font-size:13px;font-weight:600;color:var(--ink);margin:0 4px 10px;display:flex;flex-direction:column;gap:2px}
.dg-fig figcaption span{font-size:9.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--c)}
.dg-fig svg{display:block;width:100%;height:auto;max-width:100%;font-family:var(--f-ui);overflow:visible}
.dg-vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch}
.dg-side{border-radius:12px;border:1px solid color-mix(in srgb,var(--bc) 55%,transparent);background:color-mix(in srgb,var(--bc) 9%,transparent);padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.dg-h{font-weight:700;font-size:13px;color:var(--bc);margin-bottom:2px}
.dg-i{font-size:12.5px;color:#e6defa;padding:5px 8px;border-radius:8px;background:rgba(0,0,0,.35)}
.dg-vs-mid{align-self:center;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.1em}
.dg-causa{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.dg-lab{font-size:9.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.dg-chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.dg-chips span{font-size:12.5px;padding:6px 10px;border-radius:999px;border:1px solid color-mix(in srgb,var(--bc) 60%,transparent);background:color-mix(in srgb,var(--bc) 12%,transparent);color:#f1ecff}
.dg-arrow{color:var(--muted);font-size:16px;line-height:1}
.dg-center{font-weight:700;font-size:15px;padding:10px 18px;border-radius:14px;border:1px solid var(--bc);background:color-mix(in srgb,var(--bc) 16%,#07050e);box-shadow:0 0 26px -6px var(--bc)}

.tr-sub{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:8px 8px 2px}
/* glossary */
#g-search{width:100%;border:1px solid var(--line);background:rgba(0,0,0,.55);border-radius:10px;padding:8px 12px;outline:none;font-size:13px;margin-bottom:8px}
#g-search:focus{border-color:rgba(185,155,255,.5)}
.g-letters{display:flex;flex-wrap:wrap;gap:2px;margin:0 2px 8px}
.g-letters button{border:0;background:transparent;color:var(--muted);font-size:11.5px;font-weight:600;width:22px;height:22px;border-radius:6px}
.g-letters button:hover{background:rgba(167,139,250,.14);color:var(--ink)}
.g-L{font-size:22px;font-weight:300;color:var(--core);margin:14px 8px 4px;letter-spacing:-.02em;scroll-margin-top:8px}
.g-item{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 8px 9px;border-radius:10px;border-bottom:1px solid rgba(255,255,255,.04)}
.g-item:hover{background:rgba(167,139,250,.08)}
.g-item .gt{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink)}
.g-item .gt .dot{width:7px;height:7px}
.g-item .gk{font-size:10.5px;font-weight:500;color:var(--faint);text-transform:lowercase;margin-left:auto}
.g-item .gd{display:block;font-size:12.5px;line-height:1.5;color:#c8c1de;margin-top:3px;font-weight:300}
/* full / short */
.d-mode{display:inline-flex;margin-top:14px}
.d-mode button{font-family:var(--f-ui);font-size:12.5px;padding:5px 14px}
#d-body .short-only{display:none}
#d-body.is-short .short-only{display:block}
#d-body.is-short .full-only{display:none}
.brief{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.brief li{position:relative;padding:10px 12px 10px 34px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--line);font-size:14.5px;line-height:1.45;color:#ece6ff}
.brief li::before{content:"";position:absolute;left:14px;top:1.05em;width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}

/* test */
.t-intro{margin:2px 8px 4px;font-size:13px;color:var(--muted);line-height:1.55}
.t-scope{display:flex;flex-wrap:wrap;gap:6px;padding:0 4px}
.t-scope .chip[aria-pressed="true"]{color:var(--ink);border-color:color-mix(in srgb,var(--c,var(--accent)) 70%,transparent);background:color-mix(in srgb,var(--c,var(--accent)) 16%,transparent)}
#t-num{display:inline-flex;margin-left:4px}
#v-test .row{padding:0 4px}
.t-h{display:flex;align-items:center;gap:10px;padding:7px 8px;font-size:13px}
.t-h .sc{font-weight:700;font-variant-numeric:tabular-nums;min-width:52px}
.t-h .w{color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t-h .d{color:var(--faint);font-size:11.5px}
.quiz{display:flex;flex-direction:column;gap:16px;padding-top:6px}
.q-top{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.q-bar{height:3px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden}
.q-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#f0abfc);box-shadow:0 0 12px var(--accent);transition:width .4s}
.q-text{font-size:20px;font-weight:400;line-height:1.4;letter-spacing:-.01em;margin:6px 0 4px;text-wrap:balance}
.q-opts{display:flex;flex-direction:column;gap:8px}
.q-opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.02);font-size:14px;line-height:1.45;transition:background .15s,border-color .15s}
.q-opt:hover:not(:disabled){border-color:rgba(185,155,255,.5);background:rgba(167,139,250,.08)}
.q-opt b{flex:none;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:11px;background:rgba(255,255,255,.06);color:var(--muted)}
.q-opt:disabled{cursor:default}
.q-opt.ok{border-color:rgba(94,234,212,.7);background:rgba(94,234,212,.1)}
.q-opt.ok b{background:var(--ok);color:#03130f}
.q-opt.ko{border-color:rgba(251,113,133,.7);background:rgba(251,113,133,.1)}
.q-opt.ko b{background:var(--danger);color:#1a0610}
.q-exp{padding:12px 14px;border-radius:12px;background:rgba(167,139,250,.07);border:1px dashed rgba(167,139,250,.3);font-size:13.5px;line-height:1.55;color:#ddd5f7}
.q-exp strong{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
.q-exp .linkbtn{padding:4px 0 0}
.q-why{margin:6px 0 0;font-size:14px;line-height:1.55;color:#e9e3fb}
.q-why b{color:#fff;font-weight:600}
.t-h{flex-wrap:wrap}
.t-rt{margin-left:auto;border:1px solid rgba(251,113,133,.45);background:rgba(251,113,133,.08);color:#fecdd3;border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer}
.q-ask{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.q-ask h4{margin:0 0 8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#9890b3;font-weight:500}
.q-ask form{display:flex;gap:8px}
.q-ask input{flex:1;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:#fff;font:inherit;font-size:14px}
.q-ask input:focus{outline:none;border-color:rgba(167,139,250,.6)}
.q-chat{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.q-chat .me{align-self:flex-end;max-width:85%;padding:8px 12px;border-radius:12px 12px 4px 12px;background:rgba(167,139,250,.18);font-size:14px}
.q-chat .ai{max-width:95%;padding:8px 12px;border-radius:12px 12px 12px 4px;background:rgba(255,255,255,.04);border:1px solid var(--line);font-size:14px;line-height:1.55;color:#e9e3fb}
.q-chat .ai p{margin:0 0 6px}.q-chat .ai p:last-child{margin:0}
.q-chat .ai.wait{color:#9890b3;font-style:italic}
.q-sugg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.q-sugg button{padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:none;color:#cfc6ec;font-size:12.5px}
.q-end{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 0 6px}
.q-ring{width:150px;height:150px}
.q-score{font-size:15px;color:var(--muted)}
.q-verdict{font-size:22px;font-weight:300;letter-spacing:-.02em}
.q-review{text-align:left;width:100%;margin-top:10px}

/* thinking */
.thinking{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding:60px 10px}
.orb{width:84px;height:84px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#fff 0,#d8c8ff 12%,rgba(167,139,250,.6) 35%,rgba(167,139,250,0) 70%);animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.85);opacity:.75}50%{transform:scale(1.08);opacity:1}}
.thinking .msg{font-family:var(--f-display);font-weight:300;font-size:19px;letter-spacing:-.01em}
.thinking .sub{font-size:12.5px;color:var(--muted);max-width:30ch}
.inline-think{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;padding:12px 4px}
.inline-think .mini{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle,#fff 0,var(--accent) 40%,transparent 70%);animation:pulse 1.4s ease-in-out infinite}
.err{color:var(--danger);font-size:13px;margin-top:8px}

/* graph chrome */
#hud{position:fixed;z-index:4;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;transition:right .45s cubic-bezier(.2,.8,.2,1)}
body.detail-open #hud{right:calc(var(--detail-w) + 32px)}
#hud button{height:36px;min-width:36px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--muted);font-size:12px;font-family:var(--f-mono);display:flex;align-items:center;gap:6px}
#hud button:hover{color:var(--ink)}
#hud button[aria-pressed="true"]{color:var(--ink);border-color:rgba(185,155,255,.5)}
#tip{position:fixed;z-index:7;pointer-events:none;padding:6px 10px;border-radius:8px;background:var(--glass-hi);border:1px solid var(--line);font-size:12.5px;max-width:240px;opacity:0;transition:opacity .12s;transform:translate(12px,12px)}
#tip.on{opacity:1}
#tip small{display:block;color:var(--muted);font-size:11px}
#banner{position:fixed;z-index:8;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);padding:8px 14px;border-radius:10px;background:var(--glass-hi);border:1px solid rgba(251,113,133,.35);font-size:12.5px;color:#f7c6d0;max-width:min(560px,calc(100% - 32px));text-align:center}
#toast{position:fixed;z-index:9;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;transition:all .3s;padding:9px 16px;border-radius:999px;background:var(--glass-hi);border:1px solid var(--line);font-size:13px;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}

#nav{display:none}
body.side-hidden #side{transform:translateX(calc(-100% - 40px));opacity:0;pointer-events:none}
#hide-side{margin-left:auto;width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);display:grid;place-items:center;font-size:12px;align-self:center}
#hide-side:hover{color:var(--ink)}
#show-side{position:fixed;z-index:4;top:calc(16px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px;width:40px;height:40px;justify-content:center;padding:0;border-radius:12px;color:var(--muted);border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);font-family:var(--f-display);font-weight:300;font-size:17px;letter-spacing:-.01em;opacity:0;pointer-events:none;transform:translateX(-12px);transition:all .4s}
#show-side em{color:var(--core);font-style:normal;font-weight:600}
body.side-hidden #show-side{opacity:1;pointer-events:auto;transform:none}

/* ---------- phone ---------- */
@media (max-width:860px){
  :root{--nav-h:62px}
  #side{left:0;right:0;width:auto;top:auto;bottom:0;height:min(82%,680px);border-radius:20px 20px 0 0;border-bottom:0;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
  #side .brand,#side #compose,#side .tabs,#side .view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  body.sheet #side{transform:none}
  #side .brand{display:none}
  #compose{padding-top:16px}
  body[data-tab="traduci"] #compose,body[data-tab="test"] #compose,body[data-tab="glossario"] #compose{display:none}
  body[data-tab="nuovo"] #side .tabs{display:none}
  body[data-tab="nuovo"] #side .view{display:none}
  body[data-tab="nuovo"] #side{height:auto}
  #detail{left:0;right:0;width:auto;top:calc(10px + env(safe-area-inset-top,0px));bottom:0;border-radius:20px 20px 0 0;border-bottom:0;transform:translateY(105%);z-index:12;background:rgba(3,2,7,.96)}
  #side{background:rgba(3,2,7,.94)}
  #detail .d-body{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
  #detail.open{transform:none}
  .d-title{font-size:29px}
  #hud{bottom:calc(var(--nav-h) + 12px + env(safe-area-inset-bottom,0px))}
  body.detail-open #hud{right:max(16px,env(safe-area-inset-right,0px))}
  #hide-side,#show-side{display:none!important}
  #nav{display:flex;position:fixed;z-index:10;left:0;right:0;bottom:0;height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));padding:6px max(10px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(10px,env(safe-area-inset-left,0px));background:rgba(0,0,0,.88);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);gap:4px}
  #nav button{flex:1;border:0;background:transparent;color:var(--faint);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;letter-spacing:.04em;border-radius:12px}
  #nav button svg{width:22px;height:22px}
  #nav button[aria-current="true"]{color:var(--ink)}
  #nav button.plus span.p{width:44px;height:30px;border-radius:12px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);box-shadow:0 0 22px -4px rgba(167,139,250,.9)}

/* Portale della conoscenza, versione indipendente da Claude.

function providers(){

const LIVE = new Map();
const PREF = {
  text: [/gpt-oss-120b/, /llama-4-maverick/, /llama-3\.3-70b/, /kimi-k2/, /qwen3?-?(235|32)/, /deepseek/, /llama.*70b/, /gpt-oss-20b/, /qwen/, /llama-4-scout/, /llama/],
  quick: [/llama-3\.1-8b|8b-instant/, /gpt-oss-20b/, /llama-4-scout/, /gpt-oss-120b/, /llama/],
  vision: [/llama-4-scout/, /llama-4-maverick/, /vision|vl\b|-vl-/],

async function liveModels(p){
  if (!p.models) return null;
  if (LIVE.has(p.name)) return LIVE.get(p.name);
  const pr = fetch(p.models, { headers: p.key ? { Authorization: "Bearer " + p.key } : {} }).then(r => r.ok ? r.json() : null).then(d => (d?.data || []).filter(m => m.active !== false).map(m => m.id).filter(id => !p.onlyFree || /:free$/.test(id)).filter(id => !/whisper|tts|guard|playai|orpheus|prompt-guard|safeguard|allam/i.test(id))).catch(() => null);

function rank(ids, kind){

}
async function call(p, o){
  const kind = o.images?.length ? "vision" : o.tier === "quick" ? "quick" : "text";

    try { const r = await call1(p, model, o); window.__pcLast = p.name + " · " + model; return r; }
    catch (e) { last = e; if (!(e.code === "model_gone" || e.code === "rate_limited")) throw e; }

}
async function call1(p, model, { prompt, images = [], tier = "default", json = false, signal, onText }){

    if (res.status === 413) throw err("prompt_too_large");

}

async function run(opts){
  const list = providers();
  if (!list.length) { window.__pcOpenSettings?.(); throw err("no_provider"); }

    try { const out = await call(p, opts); if (!String(out).trim()) throw err("empty_completion"); return out; }
    catch (e) { if (e.code === "cancelled") throw e; last = e; console.warn("[AI]", p.name, e.code, e.message); }
  }

function parseJSON(t){

const sample = async (prompt, o = {}) => ({ text: await run({ prompt, tier: o.modelTier || "default", signal: o.signal, onText: o.onText }) });
sample.json = async (prompt, o = {}) => {
  const images = o.images ? await Promise.all(o.images.map(toDataURL)) : [];
  for (let i = 0; i < 2; i++) {
    const t = await run({ prompt, images, tier: o.modelTier || "default", json: true, signal: o.signal });
    try { return parseJSON(t); } catch (e) { if (i) throw e; }
  }
};
sample.limits = async () => ({ images: { mediaTypes: ["image/jpeg", "image/png", "image/webp"], maxInputBytes: 3500000 } });

/* ---------- archivio locale (IndexedDB) con API simile a quella di prima ---------- */
const DBN = "portale-conoscenza", ST = "docs";
const idb = new Promise((res, rej) => { const r = indexedDB.open(DBN, 1); r.onupgradeneeded = () => r.result.createObjectStore(ST); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const mem = new Map(); let loaded = null; const subs = new Set();
const META = "~meta"; let meta = { t: {}, del: {} };
const saveMeta = () => put(META, meta);
const touch = (k, del) => { const now = Date.now(); if (del) { meta.del[k] = now; delete meta.t[k]; } else { meta.t[k] = now; delete meta.del[k]; } };

  fresh.forEach(([k, v]) => mem.set(k, v));

  LSset("seeded", "1");
});
const put = (k, v) => idb.then(db => new Promise((res, rej) => { const tx = db.transaction(ST, "readwrite"); v === undefined ? tx.objectStore(ST).delete(k) : tx.objectStore(ST).put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }));
const rid = () => Array.from(crypto.getRandomValues(new Uint8Array(10)), b => "abcdefghijklmnopqrstuvwxyz0123456789"[b % 36]).join("");
const parent = k => k.slice(0, k.lastIndexOf("/"));
let fireT; const fire = (fromSync) => { clearTimeout(fireT); fireT = setTimeout(() => subs.forEach(s => s()), 0); if (!fromSync) scheduleSync(); };
function query(col, ord, lim){
  let docs = [...mem.entries()].filter(([k]) => parent(k) === col).map(([k, v]) => ({ id: k.slice(col.length + 1), v }));
  if (ord) docs.sort((a, b) => ((a.v[ord.f] ?? 0) > (b.v[ord.f] ?? 0) ? 1 : (a.v[ord.f] ?? 0) < (b.v[ord.f] ?? 0) ? -1 : 0) * (ord.d === "desc" ? -1 : 1));

function coll(col, ord, lim){

    limit: n => coll(col, ord, n),

const FILE = "archivio.json";

async function gh(path, opt = {}){
  const c = CFG();
  const r = await fetch(`https://api.github.com/repos/${c.repo}/contents/${path}${opt.method ? "" : "?t=" + Date.now()}`, { cache: "no-store", ...opt, headers: { Authorization: "Bearer " + c.gh, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", ...(opt.headers || {}) } });
  return r;
}
async function sync(){
  const c = CFG(); if (!c.gh || !c.repo) return;
  if (SYNC.busy) { SYNC.again = true; return; }
  SYNC.busy = true; setSync("Sincronizzo…");
  try {
    await load();
    for (let attempt = 0; attempt < 3; attempt++) {
      let sha = null, remote = { docs: {}, t: {}, del: {} };
      const g = await gh(FILE);
      if (g.status === 401 || g.status === 403) throw new Error("token GitHub non valido o senza permesso sulla repository");
      if (g.status === 404) {
        const rr = await fetch(`https://api.github.com/repos/${c.repo}?t=${Date.now()}`, { cache: "no-store", headers: { Authorization: "Bearer " + c.gh, Accept: "application/vnd.github+json" } });
        if (rr.status === 404) throw new Error(`non vedo la repository ${c.repo}: controlla il nome (Proprietario/nome) e che il token abbia accesso proprio a questa repository`);
        if (rr.status === 401) throw new Error("token GitHub non valido o scaduto");
      }
      else if (!g.ok) throw new Error("GitHub " + g.status);
      else {
        const j = await g.json(); sha = j.sha;
        let text = j.content ? b64dec(j.content) : "";
        if (!text && j.size) { const raw = await gh(FILE, { headers: { Accept: "application/vnd.github.raw+json" } }); text = await raw.text(); }
        if (text) { const d = JSON.parse(text); remote = { docs: d.docs || {}, t: d.t || {}, del: d.del || {} }; }
      }
      let changed = false, push = !sha;
      const keys = new Set([...mem.keys(), ...Object.keys(meta.del), ...Object.keys(remote.docs), ...Object.keys(remote.del)]);
      for (const k of keys) {
        const lEx = mem.has(k), rEx = k in remote.docs;
        const lT = lEx ? (meta.t[k] || 0) : (meta.del[k] || 0), rT = rEx ? (remote.t[k] || 0) : (remote.del[k] || 0);
        if (rT > lT || (rT === lT && rEx && !lEx && !(k in meta.del))) {
          if (rEx) { mem.set(k, remote.docs[k]); meta.t[k] = rT; delete meta.del[k]; await put(k, remote.docs[k]); }
          else if (lEx || !(k in meta.del)) { mem.delete(k); meta.del[k] = rT; delete meta.t[k]; await put(k, undefined); }
          changed = true;
        } else if (lT > rT || (lEx && !rEx && !(k in remote.del))) push = true;
      }
      if (changed) { await saveMeta(); fire(true); }
      if (!push) break;
      const cut = Date.now() - 90 * 864e5;
      for (const [k, t] of Object.entries(meta.del)) if (t < cut) delete meta.del[k];
      const body = { formato: "portale-conoscenza", versione: 2, aggiornato: new Date().toISOString(), docs: Object.fromEntries(mem), t: meta.t, del: meta.del };
      const p = await gh(FILE, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: "Aggiornamento archivio", content: b64enc(JSON.stringify(body)), ...(sha ? { sha } : {}) }) });
      if (p.ok) break;
      if (p.status === 409 || p.status === 422) continue;
      if (p.status === 401 || p.status === 403) throw new Error("il token non può scrivere nella repository (serve Contents: Read and write)");
      throw new Error("GitHub " + p.status);
    }
    SYNC.last = Date.now(); setSync("Sincronizzato");
  } catch (e) { setSync("Sincronizzazione non riuscita", e.message || String(e)); }
  finally { SYNC.busy = false; if (SYNC.again) { SYNC.again = false; scheduleSync(500); } }
}
addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && Date.now() - SYNC.last > 20000) scheduleSync(200); });
setInterval(() => { if (document.visibilityState === "visible") scheduleSync(0); }, 120000);

/* collegamento di un altro dispositivo: link/QR con le impostazioni nel frammento (#), che non viene mai inviato a nessun server */
const PAIR = "#collega=";
function pairLink(){
  const c = CFG(), d = { groq: c.groq, openrouter: c.openrouter, gh: c.gh, repo: c.repo };
  const b = b64enc(JSON.stringify(d)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  return (location.protocol === "https:" ? location.origin + location.pathname : SITE) + PAIR + b;
}
/* Il link resta nell'indirizzo: così "Aggiungi alla schermata Home" (che su iPhone ha una memoria sua) riceve le impostazioni.
   Si applica solo se il dispositivo non è ancora configurato o se il link è nuovo. */
function applyPair(raw){
  const h = String(raw || ""), i = h.indexOf(PAIR); if (i < 0) return false;
  const code = h.slice(i + PAIR.length).trim();
  if (!code) return false;
  if (LS("pairCode") === code && LS("groq")) return false;
  try {
    const b = code.replace(/-/g, "+").replace(/_/g, "/");
    const d = JSON.parse(b64dec(b + "=".repeat((4 - b.length % 4) % 4)));
    for (const k of ["groq", "openrouter", "gh", "repo"]) if (d[k]) LSset(k, String(d[k]));
    LSset("pairCode", code);
    return true;
  } catch { return false; }
}
const readPair = () => applyPair(location.hash);
const PAIRED = readPair();
function loadQR(){ return window.qrcode ? Promise.resolve() : new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }

/* esporta / importa */
async function exportAll(){
  await load();
  const out = { formato: "portale-conoscenza", versione: 1, esportato: new Date().toISOString(), docs: Object.fromEntries(mem) };
  const blob = new Blob([JSON.stringify(out)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `portale-conoscenza-${new Date().toISOString().slice(0, 10)}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
async function importAll(file){
  const j = JSON.parse(await file.text()); if (j.formato !== "portale-conoscenza" || !j.docs) throw new Error("File non valido");
  await load(); let n = 0;
  const ok = Object.entries(j.docs).filter(([k]) => /^[\w\-./]+$/.test(k));
  ok.forEach(([k, v]) => { mem.set(k, v); touch(k); n++; });
  const db = await idb; await new Promise((res, rej) => { const tx = db.transaction(ST, "readwrite"), st = tx.objectStore(ST); ok.forEach(([k, v]) => st.put(v, k)); st.put(meta, META); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
  fire(); return n;
}

  .force("link", d3.forceLink().id(d => d.id).distance(l => l.dist).strength(l => l.str))

const spriteCache = new Map();
function glow(color){
  if (spriteCache.has(color)) return spriteCache.get(color);
  const s = 96, c = document.createElement("canvas"); c.width = c.height = s;
  const g = c.getContext("2d"), gr = g.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  gr.addColorStop(0, color); gr.addColorStop(.18, color); gr.addColorStop(.35, "rgba(0,0,0,0)");
  g.fillStyle = gr; g.globalAlpha = .55; g.fillRect(0, 0, s, s);
  const gr2 = g.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  gr2.addColorStop(0, color); gr2.addColorStop(1, "rgba(0,0,0,0)");
  g.globalAlpha = .35; g.fillStyle = gr2; g.fillRect(0, 0, s, s);
  spriteCache.set(color, c); return c;
}

function makeStars(){
  const N = isPhone() ? 1100 : 1900;
  const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;
  const clusters = [
    { a: -1.95, s: .55, w: .2, cols: ["#f2b55c", "#fcd34d", "#fde68a", "#fdba74"] },
    { a: Math.PI + .15, s: .55, w: .2, cols: ["#5eead4", "#67e8f9", "#99f6e4", "#f9a8d4", "#f472b6"] },
    { a: .35, s: .35, w: .05, cols: ["#f472b6", "#fb7185", "#4ade80"] }
  ];
  const base = ["#c4b5fd", "#a78bfa", "#ddd6fe", "#ffffff", "#b99bff", "#e9d5ff"];
  G.stars = Array.from({ length: N }, () => {
    let a = Math.random() * 6.283, cols = base, cl = false;
    const r = Math.random(); let acc = 0;
    for (const c of clusters) { acc += c.w; if (r < acc) { a = c.a + gauss() * c.s; cols = c.cols; cl = true; break; } }
    const d = 60 + Math.pow(Math.random(), cl ? .45 : .6) * 1550;
    return { a, d, r: (Math.random() * 1.5 + .35) * (cl ? 1.35 : 1), p: Math.random() * 6.28, hue: cols[Math.random() * cols.length | 0], ray: !cl || Math.random() < .25 };
  });
  G.t0 = performance.now();
}

function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
}

function buildGraph(){
  const prev = G.nodes, next = new Map(), links = [];
  const mk = (id, base) => { const o = prev.get(id); const n = Object.assign(o || {}, { id }, base); next.set(id, n); return n; };
  const core = mk("core", { kind: "core", label: "Conoscenza", color: "#c9b2ff", r: 16, charge: -900 });
  core.fx = 0; core.fy = 0;
  const cats = new Map();
  for (const n of S.notes) { const c = norm(n.categoria) || "altro"; cats.set(c, (cats.get(c) || 0) + 1); }
  if (S.trs.length) cats.set("__tr", S.trs.length);
  if (S.notes.length) cats.set("__gl", S.notes.length);
  const open = c => G.all || G.expanded.has(c);
  G.catRing = 130 + Math.min(200, cats.size * 20) + (G.all ? 60 : 0);
  let i = 0;
  for (const [c, count] of cats) {
    const node = mk("c:" + c, { kind: "cat", cat: c, label: catName(c), color: catColor(c), r: 8 + Math.min(10, Math.sqrt(count) * 2.6), charge: open(c) ? -700 : -420, count, open: open(c) });
    if (node.x == null) { const a = (i / cats.size) * Math.PI * 2 - Math.PI / 2; node.x = Math.cos(a) * G.catRing; node.y = Math.sin(a) * G.catRing; }
    links.push({ source: "core", target: node.id, dist: G.catRing, str: .08, kind: "core" });
    i++;
  }
  const visible = new Set();
  if (open("__gl")) {
    const hub = next.get("c:__gl");
    for (const n of S.notes) {
      let L = norm(n.titolo).replace(/^[^a-z0-9]+/, "").charAt(0).toUpperCase() || "#"; if (/[0-9]/.test(L)) L = "#";
      const sid = "s:__gl|" + L;
      const sn = next.get(sid) || (() => {
        const x = mk(sid, { kind: "sub", cat: "__gl", label: L, color: hub.color, r: 4.6, charge: -160, count: 0 });
        if (x.x == null) { x.x = hub.x + (Math.random() - .5) * 40; x.y = hub.y + (Math.random() - .5) * 40; }
        links.push({ source: hub.id, target: sid, dist: 58, str: .5, kind: "cat" });
        return x;
      })();
      sn.count++;
      const node = mk("w:" + n.id, { kind: "word", note: n, label: n.titolo, color: hub.color, r: 3.2, charge: -60 });
      if (node.x == null) { node.x = sn.x + (Math.random() - .5) * 26; node.y = sn.y + (Math.random() - .5) * 26; }
      links.push({ source: node.id, target: sid, dist: 28, str: .7, kind: "cat" });
    }
  }
  if (open("__tr")) {
    const hub = next.get("c:__tr");
    for (const t of S.trs) {
      const dk = trDir(t), sid = "s:__tr|" + dk;
      const sn = next.get(sid) || (() => {
        const x = mk(sid, { kind: "sub", cat: "__tr", label: dk === "it-en" ? "IT → EN" : "EN → IT", color: hub.color, r: 4.6, charge: -160, count: 0 });
        if (x.x == null) { x.x = hub.x + (Math.random() - .5) * 40; x.y = hub.y + (Math.random() - .5) * 40; }
        links.push({ source: hub.id, target: sid, dist: 62, str: .5, kind: "cat" });
        return x;
      })();
      sn.count++;
      const node = mk("t:" + t.id, { kind: "tr", tr: t, label: t.testo, color: hub.color, r: 3.2, charge: -60 });
      if (node.x == null) { node.x = sn.x + (Math.random() - .5) * 26; node.y = sn.y + (Math.random() - .5) * 26; }
      links.push({ source: node.id, target: sid, dist: 30, str: .7, kind: "cat" });
    }
  }
  for (const n of S.notes) {
    const c = norm(n.categoria) || "altro"; if (!open(c)) continue;
    const hub = next.get("c:" + c);
    let parent = hub;
    const sk = norm(n.sottocategoria);
    if (sk) {
      const sid = "s:" + c + "|" + sk;
      parent = next.get(sid) || (() => {
        const sn = mk(sid, { kind: "sub", cat: c, label: n.sottocategoria.charAt(0).toUpperCase() + n.sottocategoria.slice(1), color: hub.color, r: 4.6, charge: -160, count: 0 });
        if (sn.x == null) { sn.x = hub.x + (Math.random() - .5) * 40; sn.y = hub.y + (Math.random() - .5) * 40; }
        links.push({ source: hub.id, target: sid, dist: 62, str: .5, kind: "cat" });
        return sn;
      })();
      parent.count++;
    }
    const node = mk("n:" + n.id, { kind: "note", note: n, label: n.titolo, color: hub.color, r: 3.6, charge: -70 });
    if (node.x == null) { node.x = parent.x + (Math.random() - .5) * 26; node.y = parent.y + (Math.random() - .5) * 26; }
    links.push({ source: node.id, target: parent.id, dist: parent === hub ? 50 : 34, str: .7, kind: "cat" });
    visible.add(n.id);
  }
  const byTitle = new Map(S.notes.map(n => [norm(n.titolo), n]));
  const pairs = new Set(), ghostCount = new Map();
  for (const n of S.notes) {
    if (!visible.has(n.id)) continue;
    for (const raw of (n.collegamenti || [])) {
      const k = norm(raw); if (!k) continue;
      const other = byTitle.get(k);
      if (other && other.id !== n.id) {
        if (!visible.has(other.id)) continue;
        const key = [n.id, other.id].sort().join("|");
        if (!pairs.has(key)) { pairs.add(key); links.push({ source: "n:" + n.id, target: "n:" + other.id, dist: 110, str: .05, kind: "note" }); }
      } else if (!other && G.all) {
        ghostCount.set(k, (ghostCount.get(k) || 0) + 1);
        const gid = "g:" + k, src = next.get("n:" + n.id);
        const g = mk(gid, { kind: "ghost", label: raw, color: "#bfb2e6", r: 1.8, charge: -14 });
        if (g.x == null) { g.x = src.x + (Math.random() - .5) * 40; g.y = src.y + (Math.random() - .5) * 40; }
        links.push({ source: src.id, target: gid, dist: 22 + Math.random() * 16, str: .5, kind: "ghost" });
      }
    }
  }
  for (const [k, c] of ghostCount) { const g = next.get("g:" + k); g.r = 1.8 + Math.min(3, (c - 1) * 1.2); g.shared = c; }
  G.nodes = next; G.links = links;
  sim.nodes([...next.values()]);
  sim.force("link").links(links);
  sim.force("radial", d3.forceRadial(d => d.kind === "cat" ? (d.cat === "__gl" ? G.catRing + 110 : G.catRing) : 0).strength(d => d.kind === "cat" ? (d.cat === "__gl" ? .6 : .25) : 0));
  const cold = prev.size <= 1 && next.size > 1;
  sim.alpha(cold ? 1 : .6);
  if (cold) for (let k = 0; k < 220; k++) sim.tick();
  setHover(null);
}

function setHover(n){
  G.hover = n; G.neigh = new Set();
  const focus = n || (S.selected && G.nodes.get("n:" + S.selected));
  if (focus) { G.neigh.add(focus.id); for (const l of G.links) { if (l.source.id === focus.id) G.neigh.add(l.target.id); if (l.target.id === focus.id) G.neigh.add(l.source.id); } }
}

function viewCenter(){
  let cx = W / 2;
  if (!isPhone()) { const l = document.body.classList.contains("side-hidden") ? 0 : 360 + 32, r = document.body.classList.contains("detail-open") ? 460 + 32 : 0; cx = l + (W - l - r) / 2; }
  return [cx, isPhone() ? H / 2 - 30 : H / 2];
}

function draw(t){
  if (sim.alpha() > sim.alphaMin()) sim.tick();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);

  ctx.setTransform(DPR * T.k, 0, 0, DPR * T.k, DPR * T.x, DPR * T.y);
  const k = T.k, time = t / 1000, focus = G.hover || (S.selected && G.nodes.get("n:" + S.selected));
  const q = S.query;

  // burst: rays from the core + coloured dust, like an exploding vault
  ctx.globalCompositeOperation = "lighter";
  const prog = reduced ? 1 : 1 - Math.pow(1 - Math.min(1, Math.max(0, (t - G.t0) / 2600)), 3);
  const rot = reduced ? 0 : time * .006;
  const dimAll = focus ? .35 : 1;
  for (const s of G.stars) { const e = s.d * prog; s.x = Math.cos(s.a + rot) * e; s.y = Math.sin(s.a + rot) * e; }
  const rg = ctx.createRadialGradient(0, 0, 0, 0, 0, 1500 * prog + 1);
  rg.addColorStop(0, "rgba(214,190,255,1)"); rg.addColorStop(.25, "rgba(160,120,255,.7)"); rg.addColorStop(1, "rgba(120,80,230,0)");
  ctx.strokeStyle = rg; ctx.lineWidth = .7 / k; ctx.globalAlpha = .16 * dimAll;
  ctx.beginPath();
  for (const s of G.stars) if (s.ray) { ctx.moveTo(0, 0); ctx.lineTo(s.x, s.y); }
  ctx.stroke();
  const sk = 1 / Math.sqrt(k);
  for (const s of G.stars) {
    ctx.globalAlpha = (reduced ? .7 : .45 + .4 * Math.sin(time * .9 + s.p)) * dimAll;
    ctx.fillStyle = s.hue;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r * sk, 0, 6.283); ctx.fill();
  }
  // core bloom
  const cb = ctx.createRadialGradient(0, 0, 0, 0, 0, 340);
  cb.addColorStop(0, "rgba(235,220,255,.95)"); cb.addColorStop(.08, "rgba(190,150,255,.6)"); cb.addColorStop(.3, "rgba(140,90,255,.22)"); cb.addColorStop(1, "rgba(90,50,200,0)");
  ctx.globalAlpha = (reduced ? .8 : .7 + .12 * Math.sin(time * 1.1)) * prog;
  ctx.fillStyle = cb; ctx.beginPath(); ctx.arc(0, 0, 340, 0, 6.283); ctx.fill();

  // links
  ctx.lineWidth = 1 / k;
  for (const l of G.links) {
    const a = l.source, b = l.target;
    const on = focus ? (G.neigh.has(a.id) && G.neigh.has(b.id) && (a.id === focus.id || b.id === focus.id)) : true;
    let alpha = l.kind === "core" ? .22 : l.kind === "cat" ? .28 : l.kind === "note" ? .4 : .14;
    if (focus) alpha = on ? Math.min(.85, alpha * 2.6) : alpha * .25;
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = l.kind === "core" ? "#b99bff" : (l.kind === "note" ? "#e9ddff" : (a.color || "#b99bff"));
    if (l.kind === "core" && !focus) {
      const gr = ctx.createLinearGradient(a.x, a.y, b.x, b.y); gr.addColorStop(0, "rgba(185,155,255,.9)"); gr.addColorStop(1, b.color); ctx.strokeStyle = gr;
    }
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }

  // nodes
  for (const n of G.nodes.values()) {
    const dim = focus && !G.neigh.has(n.id);
    const match = q && n.kind === "note" && (norm(n.label).includes(q) || norm(n.note?.sintesi).includes(q));
    const tw = reduced ? 1 : 1 + .08 * Math.sin(time * 1.4 + (n.x || 0) * .05);
    let r = n.r * tw * (n === G.hover ? 1.5 : 1) * (match ? 1.7 : 1);
    if (n.kind === "core") r = n.r * (reduced ? 1 : 1 + .06 * Math.sin(time * 1.1));
    const halo = n.kind === "core" ? r * 6 : n.kind === "cat" ? r * (n.open ? 7.5 : 6.5) : n.kind === "ghost" ? r * 4.5 : n.kind === "sub" ? r * 5.5 : r * 7;
    ctx.globalAlpha = dim ? .08 : (n.kind === "ghost" ? .5 : .9);
    if (q && !match && n.kind !== "core") ctx.globalAlpha *= .25;
    ctx.drawImage(glow(n.color), n.x - halo, n.y - halo, halo * 2, halo * 2);
    ctx.globalAlpha = dim ? .2 : 1;
    if (q && !match && n.kind !== "core") ctx.globalAlpha = .2;
    const gl = n.cat === "__gl" || n.kind === "word";
    if (gl && n.kind === "cat") {
      // pianeta con anelli, come un piccolo Saturno dorato
      const R2 = r * 1.25, tilt = -0.42;
      const ring = (front) => {
        ctx.save(); ctx.translate(n.x, n.y); ctx.rotate(tilt);
        for (const [rx, w, a] of [[R2 * 2.3, 1.6, .55], [R2 * 2.75, 1, .3]]) {
          ctx.globalAlpha = (dim ? .15 : a); ctx.strokeStyle = n.color; ctx.lineWidth = w / k;
          ctx.beginPath(); ctx.ellipse(0, 0, rx, rx * .32, 0, front ? 0 : Math.PI, front ? Math.PI : 2 * Math.PI); ctx.stroke();
        }
        ctx.restore();
      };
      ring(false);
      const pg = ctx.createRadialGradient(n.x - R2 * .4, n.y - R2 * .4, R2 * .1, n.x, n.y, R2);
      pg.addColorStop(0, "#fff6d6"); pg.addColorStop(.45, n.color); pg.addColorStop(1, "#7a5a10");
      ctx.globalAlpha = dim ? .2 : 1; ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(n.x, n.y, R2, 0, 6.283); ctx.fill();
      ring(true);
      continue;
    }
    if (gl && n.kind === "sub") {
      // lettera = piccolo pianeta con la lettera incisa
      const h = r * 1.7;
      const pg = ctx.createRadialGradient(n.x - h * .35, n.y - h * .35, h * .1, n.x, n.y, h);
      pg.addColorStop(0, "#fff6d6"); pg.addColorStop(.5, n.color); pg.addColorStop(1, "#8a6512");
      ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(n.x, n.y, h, 0, 6.283); ctx.fill();
      ctx.fillStyle = "#2a1d00"; ctx.font = `700 ${h * 1.05}px Sora, system-ui, sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.globalCompositeOperation = "source-over"; ctx.fillText(n.label, n.x, n.y + .3); ctx.globalCompositeOperation = "lighter";
      continue;
    }
    ctx.fillStyle = n.kind === "ghost" ? "#d7ccf5" : n.color;
    ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, 6.283); ctx.fill();
    if (n.kind !== "ghost") { ctx.fillStyle = "#fff"; ctx.globalAlpha *= .85; ctx.beginPath(); ctx.arc(n.x, n.y, r * .42, 0, 6.283); ctx.fill(); }
  }
  ctx.globalCompositeOperation = "source-over";

  // selection ring
  if (S.selected) {
    const n = G.nodes.get("n:" + S.selected);
    if (n) { ctx.globalAlpha = .9; ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.2 / k; ctx.beginPath(); ctx.arc(n.x, n.y, n.r + 5 / k + (reduced ? 0 : 1.5 * Math.sin(time * 3) / k), 0, 6.283); ctx.stroke(); }
  }

  // labels
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  const PRI = { core: 0, cat: 1, sub: 2, note: 3, tr: 3, word: 3, ghost: 4 }, placed = [];
  const order = [...G.nodes.values()].sort((a, b) => (a === G.hover ? -1 : b === G.hover ? 1 : (PRI[a.kind] ?? 5) - (PRI[b.kind] ?? 5)));
  const hit = (x0, y0, x1, y1) => placed.some(r => x0 < r[2] && x1 > r[0] && y0 < r[3] && y1 > r[1]);
  for (const n of order) {
    const dim = focus && !G.neigh.has(n.id);
    let show = false, size = 11, color = "#d9d1f2", alpha = .85, font = "Sora, system-ui, sans-serif", weight = 500;
    if (n.kind === "core") { show = true; size = 13; color = "#efe7ff"; font = "Sora, system-ui, sans-serif"; size = 14; weight = 300; }
    else if (n.kind === "cat") { show = true; size = 11; color = n.color; font = "Sora, system-ui, sans-serif"; weight = 600; alpha = .95; }
    else if (n.kind === "sub" && n.cat === "__gl") { show = false; }
    else if (n.kind === "sub") { show = true; size = isPhone() ? 9.5 : 10; color = n.color; weight = 600; alpha = .9; }
    else if (n.kind === "note" || n.kind === "tr" || n.kind === "word") { show = true; size = isPhone() ? 9 : 10; alpha = .88; color = "#ece6fb"; }
    else if (n.kind === "ghost") { show = n === G.hover || (focus && G.neigh.has(n.id)) || k > 2.2; color = "#a79fc6"; size = 10; alpha = .7; }
    if (n === G.hover) { show = true; alpha = 1; color = "#fff"; }
    if (!show) continue;
    if (dim) alpha *= .2;
    ctx.globalAlpha = alpha;
    ctx.font = `${weight} ${size / k}px ${font}`;
    let label = n.kind === "cat" ? (n.cat === "__gl" ? "GLOSSARIO · TUTTE LE PAROLE" : n.label.toUpperCase()) : n.label;
    const leaf = n.kind === "note" || n.kind === "tr" || n.kind === "word" || n.kind === "ghost";
    if (leaf && n !== G.hover && label.length > 26) label = label.slice(0, 24).trimEnd() + "…";
    const w = ctx.measureText(label).width, h = size * 1.25 / k, pad = 2 / k;
    const off = (n.cat === "__gl" && n.kind === "cat" ? n.r * 4.4 + 6 / k : (n.r + 6) / k) + (n.kind === "core" ? n.r * .6 : 0);
    let x = n.x, y = n.y + off;
    if ((leaf || n.kind === "sub") && n !== G.hover) {
      const gap = (n.r + 5) / k, spots = [[n.x, n.y + off], [n.x, n.y - off - h], [n.x + gap + w / 2, n.y - h / 2], [n.x - gap - w / 2, n.y - h / 2],
        [n.x + gap + w / 2, n.y + off * .4], [n.x - gap - w / 2, n.y + off * .4], [n.x + gap + w / 2, n.y - off * .4 - h], [n.x - gap - w / 2, n.y - off * .4 - h], [n.x, n.y + off + h], [n.x, n.y - off - 2 * h]];
      const ok = spots.find(([sx, sy]) => !hit(sx - w / 2 - pad, sy - pad, sx + w / 2 + pad, sy + h + pad));
      if (!ok) continue;
      [x, y] = ok;
    }
    placed.push([x - w / 2 - pad, y - pad, x + w / 2 + pad, y + h + pad]);
    ctx.lineWidth = 3 / k; ctx.strokeStyle = "rgba(7,6,12,.85)"; ctx.strokeText(label, x, y);
    ctx.fillStyle = color; ctx.fillText(label, x, y);
  }

  requestAnimationFrame(draw);
}

function pick(px, py){
  const [x, y] = T.invert([px, py]);
  let best = null, bd = Infinity;
  for (const n of G.nodes.values()) {
    const d = Math.hypot(n.x - x, n.y - y), lim = n.r + 8 / T.k;
    if (d < lim && d < bd) { bd = d; best = n; }
  }
  return best;
}

const zoom = d3.zoom().scaleExtent([.15, 6]).clickDistance(5)
  .on("start", e => { if (e.sourceEvent?.type === "mousedown") canvas.classList.add("dragging"); })
  .on("zoom", e => { T = e.transform; })
  .on("end", () => canvas.classList.remove("dragging"));
d3.select(canvas).call(zoom).on("dblclick.zoom", null);

function fit(animate = true){
  const ns = [...G.nodes.values()].filter(n => n.kind !== "ghost");
  if (!ns.length) return;
  const xs = ns.map(n => n.x), ys = ns.map(n => n.y);
  const [x0, x1, y0, y1] = [Math.min(...xs) - 40, Math.max(...xs) + 40, Math.min(...ys) - 40, Math.max(...ys) + 50];
  const [cx, cy] = viewCenter();
  const availW = isPhone() ? W - 32 : (W - (document.body.classList.contains("side-hidden") ? 0 : 392) - (document.body.classList.contains("detail-open") ? 492 : 0)) - 40;
  const availH = isPhone() ? H - 200 : H - 80;
  const k = Math.max(.3, Math.min(1.6, Math.min(availW / (x1 - x0), availH / (y1 - y0))));
  const t = d3.zoomIdentity.translate(cx - k * (x0 + x1) / 2, cy - k * (y0 + y1) / 2).scale(k);
  const sel = d3.select(canvas);
  (animate && !reduced ? sel.transition().duration(800) : sel).call(zoom.transform, t);
}
function focusNode(id, minK = 1.3){
  const n = G.nodes.get(id); if (!n) return;
  const [cx, cy] = viewCenter();
  const k = Math.max(T.k, minK);
  const target = isPhone() ? [W / 2, H * .18] : [cx, cy];
  d3.select(canvas).transition().duration(reduced ? 0 : 700).call(zoom.transform, d3.zoomIdentity.translate(target[0] - k * n.x, target[1] - k * n.y).scale(k));
}

const tip = $("#tip");
canvas.addEventListener("pointermove", e => {
  if (e.pointerType === "touch") return;
  const n = pick(e.clientX, e.clientY);
  if (n !== G.hover) setHover(n);
  canvas.classList.toggle("pointing", !!n);
  if (n && n.kind !== "core") {
    const sub = n.kind === "cat" ? `${n.count} ${n.count === 1 ? "voce" : "voci"} · ${n.open ? "clic per chiudere" : "clic per aprire"}` : n.kind === "sub" ? `${catName(n.cat)} · ${n.count} ${n.count === 1 ? "voce" : "voci"}` : n.kind === "word" ? (n.note.sintesi || "").slice(0, 90) : n.kind === "tr" ? `${n.tr.traduzione} · ${trDir(n.tr) === "it-en" ? "IT → EN" : "EN → IT"}` : n.kind === "ghost" ? "Da esplorare · clic per approfondire" : catName(n.note.categoria) + " · " + (n.note.tipo || "");
    tip.innerHTML = `${esc(n.label)}<small>${esc(sub)}</small>`;
    tip.style.left = e.clientX + "px"; tip.style.top = e.clientY + "px"; tip.classList.add("on");
  } else tip.classList.remove("on");
});
canvas.addEventListener("pointerleave", () => { setHover(null); tip.classList.remove("on"); });
canvas.addEventListener("click", e => {
  const n = pick(e.clientX, e.clientY);
  tip.classList.remove("on");
  if (!n) { if (isPhone()) closeSheet(); return; }
  if (n.kind === "note") openNote(n.note.id);
  else if (n.kind === "tr") openTr(n.tr.id);
  else if (n.kind === "word") openNote(n.note.id);
  else if (n.kind === "cat") { toggleCat(n.cat); }
  else if (n.kind === "sub") focusNode(n.id);
  else if (n.kind === "ghost") explore(n.label);
  else fit();
});

function ingest(list){
  S.notes = list;
  $("#count").textContent = list.length ? `${list.length} ${list.length === 1 ? "voce" : "voci"}` : "";
  $("#mcount").textContent = list.length ? `${list.length} ${list.length === 1 ? "VOCE" : "VOCI"} · ${new Set(list.map(n => norm(n.categoria))).size} CATEGORIE` : "IL TUO GRAFO DELLA CONOSCENZA";
  const first = G.nodes.size <= 1;
  buildGraph();
  renderArchive(); renderTestHome(); renderGlossary();
  if (S.selected) { const n = S.notes.find(x => x.id === S.selected); if (n) { if (!S.editing) renderNote(n); } else closeDetail(); }
  if (first) setTimeout(() => fit(false), 30);
}

async function initData(){
  const c = window.claude;
  if (!c?.use) { banner("Apri questa pagina su claude.ai per salvare le voci e usare Claude."); ingest([]); return; }
  const loading = setTimeout(() => { if (!S.live) banner("Il tuo archivio non risponde ancora. Controlla la connessione."); }, 10000);
  c.use("sample").then(s => { S.sample = s; s?.limits?.().then(l => { if (l?.images) { S.imgLim = l.images; $("#photo").hidden = false; $("#photo-in").accept = l.images.mediaTypes.join(","); } }).catch(() => {}); });
  const db = await c.use("db");
  if (!db) { clearTimeout(loading); banner("Archivio non disponibile in questa vista: le voci nuove non verranno salvate."); ingest([]); return; }
  S.db = db;
  db.collection("notes").orderBy("createdAt", "desc").onSnapshot(snap => {
    if (!snap.metadata.fromCache) { S.live = true; clearTimeout(loading); banner(""); }
    ingest(snap.docs.map(d => ({ id: d.id, ...d.data() })));
  }, () => { clearTimeout(loading); banner("Non riesco a leggere l'archivio. Ricarica la pagina tra poco."); });
  db.collection("tests").orderBy("createdAt", "desc").limit(10).onSnapshot(snap => {
    S.tests = snap.docs.map(d => ({ id: d.id, ...d.data() })); renderTestHome();
  }, () => {});
  db.collection("translations").orderBy("createdAt", "desc").limit(1000).onSnapshot(snap => {
    S.trs = snap.docs.map(d => ({ id: d.id, ...d.data() })); renderTrHist(); buildGraph(); renderArchive(); renderTestHome();
  }, () => {});
}

// Una volta per dispositivo: porta all'infinito i verbi coniugati già salvati (traduzioni e voci di lingua)
async function lemmaFix(){
  try { if (localStorage.getItem("pc_lemma1") || !S.db || !aiReady()) return; } catch { return; }
  const trs = S.trs.filter(t => t.testo && t.testo.trim().split(/\s+/).length <= 3);
  const notes = S.notes.filter(n => norm(n.categoria) === "lingua" && n.titolo && n.titolo.trim().split(/\s+/).length <= 3);
  if (!trs.length && !notes.length) { try { localStorage.setItem("pc_lemma1", "1"); } catch {} return; }
  const items = [...trs.map(t => ({ id: "t:" + t.id, testo: t.testo, lingua: t.da || "?" })), ...notes.map(n => ({ id: "n:" + n.id, testo: n.titolo, lingua: "it" }))];
  const prompt = `Per ogni voce qui sotto, dimmi se è un VERBO CONIUGATO (una persona, un tempo, un participio o gerundio usato come verbo). Ignora sostantivi, aggettivi, plurali e verbi già all'infinito.
${JSON.stringify(items)}
Rispondi solo con JSON: {"verbi": [{"id": "id identico", "infinito": "infinito (inglese senza 'to', italiano es. 'mangiare'; stessa maiuscola iniziale dell'originale)", "traduzione": "traduzione dell'infinito nell'altra lingua (solo per id che iniziano con t:)", "forma": "che forma era, es. «went» è il passato semplice di «go»"}]}
Se nessuna voce è un verbo coniugato rispondi {"verbi": []}.`;
  try {
    const r = await S.sample.json(prompt, { modelTier: "default" });
    let n = 0;
    for (const v of (r.verbi || [])) {
      const inf = String(v.infinito || "").trim(), id = String(v.id || "");
      if (!inf) continue;
      if (id.startsWith("t:")) {
        const t = S.trs.find(x => x.id === id.slice(2)); if (!t || norm(t.testo) === norm(inf)) continue;
        const patch = { testo: inf, scritto: t.scritto || t.testo };
        if (v.traduzione) patch.traduzione = String(v.traduzione);
        if (v.forma) patch.nota = String(v.forma) + (t.nota ? " " + t.nota : "");
        await S.db.doc("translations/" + t.id).update(patch); n++;
      } else if (id.startsWith("n:")) {
        const x = S.notes.find(y => y.id === id.slice(2)); if (!x || norm(x.titolo) === norm(inf)) continue;
        await patchNote(x.id, { titolo: inf.charAt(0).toUpperCase() + inf.slice(1), scritto: x.scritto || x.titolo }); n++;
      }
    }
    localStorage.setItem("pc_lemma1", "1");
    if (n) toast(`Ho portato all'infinito ${n === 1 ? "1 verbo già salvato" : n + " verbi già salvati"}`);
  } catch {}
}
setTimeout(lemmaFix, 12000);

async function saveNote(data){
  if (S.db) { const ref = await S.db.collection("notes").add(data); return ref.id; }
  const id = "local-" + Date.now(); ingest([{ id, ...data }, ...S.notes]); return id;
}
async function patchNote(id, patch){
  if (S.db && !id.startsWith("local-")) return S.db.doc("notes/" + id).update(patch);
  const n = S.notes.find(x => x.id === id); Object.assign(n, patch); ingest([...S.notes]);
}
async function deleteNote(id){
  if (S.db && !id.startsWith("local-")) { const n = S.notes.find(x => x.id === id); if (n?.foto) S.db.doc("foto/" + id).delete().catch(() => {}); return S.db.doc("notes/" + id).delete(); }
  ingest(S.notes.filter(x => x.id !== id));
}

/* ================= ARCHIVE ================= */
function renderArchive(){
  const q = S.query, box = $("#cats");
  if (!S.notes.length && !S.trs.length) {
    box.innerHTML = `<div class="empty">Il grafo è ancora vuoto. Scrivi qui sopra la prima cosa che ti ha incuriosito: l'AI te la spiega, la salva e la colloca nella sua categoria. Ogni voce diventa una stella del grafo.</div>`;
    return;
  }
  const groups = new Map();
  for (const n of S.notes) {
    if (q && !(norm(n.titolo).includes(q) || norm(n.sintesi).includes(q) || norm(n.input).includes(q) || (n.tags || []).some(t => norm(t).includes(q)))) continue;
    const c = norm(n.categoria) || "altro";
    if (!groups.has(c)) groups.set(c, []);
    groups.get(c).push(n);
  }
  const sorted = [...groups.entries()].sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0]));
  box.classList.toggle("searching", !!q);
  const trs = S.trs.filter(t => !q || norm(t.testo).includes(q) || norm(t.traduzione).includes(q));
  if (!sorted.length && !trs.length) { box.innerHTML = `<div class="empty">Nessuna voce corrisponde a «${esc(S.queryRaw)}». <button class="linkbtn" data-explore="${esc(S.queryRaw)}">Approfondiscilo ora</button></div>`; return; }
  const hasEx = S.notes.some(n => n.esempio);
  box.innerHTML = sorted.map(([c, list]) => `
    <div class="cat ${S.openCats.has(c) ? "open" : ""}" data-cat="${esc(c)}">
      <button type="button" aria-expanded="${S.openCats.has(c)}"><span class="chev">▶</span><span class="dot" style="color:${catColor(c)}"></span><span class="name">${esc(catName(c))}</span><span class="n">${list.length}</span></button>
      <div class="notes">${list.map(n => `<button type="button" class="note-item ${n.id === S.selected ? "active" : ""}" data-id="${esc(n.id)}"><span class="t">${esc(n.titolo)}${n.esempio ? '<span class="badge">esempio</span>' : ""}</span><span class="s">${esc(n.sintesi)}</span></button>`).join("")}</div>
    </div>`).join("") + (trs.length ? `
    <div class="cat ${S.openCats.has("__tr") ? "open" : ""}" data-cat="__tr">
      <button type="button" aria-expanded="${S.openCats.has("__tr")}"><span class="chev">▶</span><span class="dot" style="color:${catColor("__tr")}"></span><span class="name">Traduzioni</span><span class="n">${trs.length}</span></button>
      <div class="notes">${[["en-it", "EN → IT"], ["it-en", "IT → EN"]].map(([k, lab]) => { const l = trs.filter(t => trDir(t) === k); return l.length ? `<div class="tr-sub">${lab} · ${l.length}</div>` + l.map(t => `<button type="button" class="note-item ${t.id === S.selTr ? "active" : ""}" data-tr="${esc(t.id)}"><span class="t">${esc(t.testo)}</span><span class="s">${esc(t.traduzione)}</span></button>`).join("") : ""; }).join("")}</div>
    </div>` : "") + (hasEx ? `<div style="margin-top:14px"><button class="linkbtn" id="rm-ex">Rimuovi le voci di esempio</button></div>` : "");
}
