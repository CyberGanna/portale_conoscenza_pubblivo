/* ---------- pronuncia (sintesi vocale gratuita del browser) ---------- */
const SAY_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>`;
const canSay = "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined";
const langOf = l => String(l || "").toLowerCase().startsWith("it") ? "it" : "en";
function sayBtn(text, lang, sm){
  if (!canSay || !text) return "";
  const l = langOf(lang);
  return `<button type="button" class="say${sm ? " sm" : ""}" data-say="${esc(text)}" data-lang="${l}" title="Ascolta la pronuncia" aria-label="Ascolta «${esc(text)}» in ${l === "it" ? "italiano" : "inglese"}">${SAY_ICON}</button>`;
}
function pickVoice(l){
  const vs = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith(l));
  const pref = l === "en" ? [/en.us/i, /en.gb/i] : [/it.it/i];
  const good = v => /premium|enhanced|natural|neural|google|siri|samantha|daniel|alice|federica|luca/i.test(v.name);
  for (const re of pref) { const m = vs.filter(v => re.test(v.lang)); if (m.length) return m.find(good) || m.find(v => v.localService) || m[0]; }
  return vs.find(good) || vs[0] || null;
}
function say(text, lang, btn){
  if (!canSay || !text) return;
  const l = langOf(lang);
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(String(text).replace(/[«»"]/g, ""));
  u.lang = l === "it" ? "it-IT" : "en-US";
  const v = pickVoice(l); if (v) u.voice = v;
  u.rate = l === "en" ? 0.85 : 0.95;
  document.querySelectorAll(".say.on").forEach(b => b.classList.remove("on"));
  if (btn) { btn.classList.add("on"); u.onend = u.onerror = () => btn.classList.remove("on"); }
  speechSynthesis.speak(u);
}
if (canSay) { try { speechSynthesis.getVoices(); } catch {} }
document.addEventListener("click", e => { const b = e.target.closest("[data-say]"); if (!b) return; e.preventDefault(); e.stopPropagation(); say(b.dataset.say, b.dataset.lang, b); }, true);

function trDir(t){ return (t.da || "").toLowerCase().startsWith("it") ? "it-en" : "en-it"; }
function trCard(t){
  return `<div class="tr-out">
    ${t.testo ? `<div class="tr-src">${sayBtn(t.testo, t.da, true)}${esc(t.testo)}${t.scritto ? `<span class="tr-fix">avevi scritto «${esc(t.scritto)}»</span>` : ""}</div>` : ""}
    <div class="tr-meta">${esc((t.da || "?").toUpperCase())} → ${esc((t.a || "?").toUpperCase())}${t.categoria ? " · " + esc(t.categoria) : ""}</div>
    <div class="tr-main" style="display:flex;align-items:center;gap:10px">${sayBtn(t.traduzione, t.a)}<span>${esc(t.traduzione)}</span></div>
    ${t.pronuncia ? `<div class="tr-meta">/${esc(t.pronuncia)}/</div>` : ""}
    ${t.alternative?.length ? `<p><span class="hint">Anche:</span> ${t.alternative.map(esc).join(" · ")}</p>` : ""}
    ${t.nota ? `<p>${esc(t.nota)}</p>` : ""}

  const intro = photo

NOTA DELL'UTENTE SULLA FOTO: ${text ? `"""${text}"""` : "(nessuna)"}`

TESTO DELL'UTENTE:
"""${text}"""`;
  return `${intro}

CATEGORIE GIÀ USATE NEL SUO ARCHIVIO: ${cats.length ? cats.join(", ") : "(nessuna)"}
CATEGORIE DI RIFERIMENTO: ${base.join(", ")}
Scegli UNA categoria ampia: preferisci una già usata o di riferimento; creane una nuova (una parola, minuscolo, italiano) solo se nessuna è adatta. Per intelligenza artificiale usa "ai". Non usare mai la categoria "psicologia": significati di parole, differenze tra termini, etimologie e modi di dire vanno in "lingua".

VOCI GIÀ NEL SUO ARCHIVIO: ${titles.length ? titles.join(" | ") : "(nessuna)"}

Rispondi solo con un oggetto JSON con questa forma esatta:
{

  "tipo": "termine | citazione | frase | concetto | persona | evento | opera | luogo",
  "autore": "autore della citazione o della frase, altrimenti stringa vuota",
  "categoria": "una parola",
  "sottocategoria": "ambito più preciso dentro la categoria, 1-2 parole, minuscolo; riusa una sottocategoria esistente se adatta (${subsTxt || "nessuna ancora"})",
  "sintesi": "una frase che coglie l'essenza, massimo 25 parole",
  "in_breve": ["3-5 punti chiave brevissimi, massimo 12 parole ciascuno: la versione sintetica da leggere in 20 secondi"],
  "spiegazione": "testo in Markdown di 180-300 parole: cos'è, origine e contesto, perché conta. Per una citazione: chi l'ha detta, quando, cosa significa, come è stata interpretata. Usa **grassetto** per i termini chiave e paragrafi brevi.",
  "esempi": ["3-5 esempi REALI e concreti, con il nome proprio in **grassetto** all'inizio, poi 1 frase su cosa fa o perché è un esempio. Se il concetto è una categoria (settore, tipo di azienda, prodotto, movimento, fenomeno) elenca casi reali che ne fanno parte: es. per 'financial technology' → **Revolut**, **Satispay**, **PayPal**, **Stripe**, **Klarna**; per 'impressionismo' → opere e artisti veri; per un bias → un caso storico o quotidiano preciso. Usa solo nomi che esistono davvero, niente esempi inventati o generici; lista vuota se non hanno senso"],

}
Scrivi sempre in italiano, anche se il testo è in inglese. Non inventare fatti, date o citazioni: se un'attribuzione è incerta o apocrifa, dillo.`;

async function explore(text, img){
  text = String(text || "").trim();
  if ((!text && !img) || S.busy) return;
  if (!img) {
    const dup = S.notes.find(n => norm(n.titolo) === norm(text) || norm(n.input) === norm(text));
    if (dup) { $("#q").value = ""; $("#go").disabled = true; openNote(dup.id); toast("È già nel tuo archivio"); return; }
  }
  if (!needSample()) return;
  S.busy = true; $("#go").disabled = true; $("#photo").disabled = true;
  if (!img && norm($("#q").value) === norm(text)) $("#q").value = "";
  showThinking(img ? (text || "La tua foto") : text, img?.thumb);
  const ctl = new AbortController(); S.ctl = ctl;
  try {
    const r = await S.sample.json(explainPrompt(text, !!img), { signal: ctl.signal, modelTier: "default", cache: false, ...(img ? { images: [img.blob] } : {}) });
    const arr = v => Array.isArray(v) ? v.map(String).filter(Boolean).slice(0, 8) : [];
    const note = {
      input: text,
      titolo: String(r.titolo || text).slice(0, 120),
      tipo: String(r.tipo || "termine").split("|")[0].trim().toLowerCase(),
      autore: String(r.autore || ""),
      categoria: norm(r.categoria) || "altro",
      sottocategoria: String(r.sottocategoria || ""),
      sintesi: String(r.sintesi || ""),
      in_breve: Array.isArray(r.in_breve) ? r.in_breve.map(String).filter(Boolean).slice(0, 6) : [],
      spiegazione: String(r.spiegazione || ""),
      esempi: arr(r.esempi), curiosita: arr(r.curiosita), collegamenti: arr(r.collegamenti), tags: arr(r.tags).map(norm),
      createdAt: Date.now()
    };
    if (img) {
      const sc = r.scheda || {}, str = v => String(v ?? "").trim();
      note.foto = true; note.input = text || "Foto";
      note.scheda = { riconoscimento: str(sc.riconoscimento).split("|")[0].trim().toLowerCase(), cosa: str(sc.cosa), dove: str(sc.dove), quando: str(sc.quando), info: Array.isArray(sc.info) ? sc.info.map(String).filter(Boolean).slice(0, 6) : [] };
    }
    const id = await saveNote(note);
    if (img) { S.photos.set(id, img.thumb); if (S.db && !id.startsWith("local-")) S.db.doc("foto/" + id).set({ data: img.thumb, createdAt: Date.now() }).catch(() => toast("Non sono riuscito a salvare la foto")); }
    $("#q").value = ""; $("#go").disabled = true;
    S.selected = id;
    const wait = Date.now();
    const tryOpen = () => { if (S.notes.find(x => x.id === id)) openNote(id); else if (Date.now() - wait < 4000) setTimeout(tryOpen, 120); else { renderNote({ id, ...note }); } };
    tryOpen();
    toast(`Salvata in ${catName(note.categoria)}`);
  } catch (e) {
    if (e?.code === "cancelled") { closeDetail(); }
    else if (e?.code === "quota_exceeded") { $("#d-body").innerHTML = `<div class="thinking"><div class="msg">Archivio pieno</div><div class="sub">Elimina qualche voce e riprova.</div></div>`; }
    else $("#d-body").innerHTML = `<div class="thinking"><div class="msg">Non ci sono riuscito</div><div class="sub">${esc(errMsg(e))}</div><button class="btn primary" type="button" data-explore="${esc(text)}">Riprova</button></div>`;
  } finally {
    clearInterval(showThinking.iv); S.busy = false; $("#go").disabled = !$("#q").value.trim(); $("#photo").disabled = false;
  }
}

In italiano.

Rispondi solo con JSON:
{"titolo": "...", "template": "nome esatto del template", "data": { ...i campi richiesti dal template... }, "spiegazione": ["frase 1", "frase 2", "frase 3"], "inferenze": ""}`;
  try {

    for (let i = 0; i < 2 && !schema; i++) {

const IG_GUIDE = Object.entries(IG_T).map(([t, [, quando, forma]]) => `- "${t}": ${quando} → data = ${forma}`).join("\n");
const IG_THEME = { colorBg: "#0b0912", base: { text: { "font-family": "Sora, Helvetica, Arial, sans-serif" } }, palette: ["#a78bfa", "#5eead4", "#f2b55c", "#fb7185", "#7dd3fc", "#86efac"] };
function igNormalize(r){
  const t = String(r?.template || "").trim(); if (!IG_T[t]) return null;
  const key = IG_T[t][0], d = r.data && typeof r.data === "object" ? r.data : {};
  const str = (v, n = 80) => String(v ?? "").replace(/\s+/g, " ").trim().slice(0, n);
  const item = (x, depth = 0) => { if (typeof x === "string") x = { label: x }; if (!x || !str(x.label)) return null;
    const o = { label: str(x.label, 48) }; if (str(x.desc)) o.desc = str(x.desc, 90); if (str(x.icon)) o.icon = str(x.icon, 24);

function renderGlossary(){
  const q = norm($("#g-search").value);
  const items = S.notes.filter(n => !q || norm(n.titolo).includes(q) || norm(n.sintesi).includes(q))
    .sort((a, b) => norm(a.titolo).localeCompare(norm(b.titolo), "it"));
  if (!items.length) { $("#g-letters").innerHTML = ""; $("#g-list").innerHTML = `<div class="empty">${S.notes.length ? "Nessuna parola trovata." : "Qui troverai, in ordine alfabetico, la definizione di ogni parola che cerchi."}</div>`; return; }
  const groups = new Map();
  for (const n of items) { let L = norm(n.titolo).replace(/^[^a-z0-9]+/, "").charAt(0).toUpperCase() || "#"; if (/[0-9]/.test(L)) L = "#"; if (!groups.has(L)) groups.set(L, []); groups.get(L).push(n); }
  $("#g-letters").innerHTML = [...groups.keys()].map(L => `<button type="button" data-L="${esc(L)}">${esc(L)}</button>`).join("");
  $("#g-list").innerHTML = [...groups].map(([L, list]) => `<div class="g-L" id="gL-${esc(L)}">${esc(L)}</div>` + list.map(n => `<button type="button" class="g-item" data-id="${esc(n.id)}"><span class="gt"><span class="dot" style="color:${catColor(n.categoria)}"></span>${esc(n.titolo)}<span class="gk">${esc(n.tipo || "")}</span></span><span class="gd">${esc(n.sintesi)}</span></button>`).join("")).join("");
}

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

async function genBatched(chosen, N, mk, onStep){
  const all = !S.tNum, size = 8, batches = [];
  if (all) for (let i = 0; i < chosen.length; i += size) batches.push(chosen.slice(i, i + size)); else batches.push(chosen);
  const raw = [];
  for (let b = 0; b < batches.length; b++) {
    onStep?.(b, batches.length);
    const r = await S.sample.json(mk(batches[b], all ? batches[b].length : N, all), { modelTier: "default", cache: false });
    raw.push(...(Array.isArray(r.domande) ? r.domande : []));
  }
  return raw;
}

function quizWords(text){
  const t = " " + norm(text) + " ", out = [];
  for (const x of S.trs) {
    const en = langOf(x.da) === "en" ? x.testo : x.traduzione;
    if (!en || en.length > 40) continue;
    const k = norm(en);
    if (k && t.includes(k) && new RegExp("[^a-z0-9]" + k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "[^a-z0-9]").test(t) && !out.some(o => norm(o) === k)) out.push(en);
  }
  return out.slice(0, 4);
}
function sayRow(words){ return words.length ? `<div class="q-say">${words.map(w => `<span class="w">${sayBtn(w, "en", true)}${esc(w)}</span>`).join("")}</div>` : ""; }
function renderQ(){
  const Q = S.quiz, q = Q.qs[Q.i], note = q.nota && S.notes.find(n => n.id === q.nota);
  const color = note ? catColor(note.categoria) : "var(--accent)";
  $("#d-cat").innerHTML = `<span class="dot" style="color:${color}"></span>Test${note ? " · " + esc(catName(note.categoria)) : Q.ambito?.includes?.("__tr") ? " · Traduzioni" : ""}`;
  $("#d-body").innerHTML = `<div class="quiz">
    <div class="q-top"><span>${Q.ripasso ? "Ripasso · " : ""}Domanda ${Q.i + 1} di ${Q.qs.length}</span><span style="margin-left:auto">${Q.score} ${Q.score === 1 ? "giusta" : "giuste"}</span></div>
    <div class="q-bar"><i style="width:${(Q.i / Q.qs.length) * 100}%"></i></div>
    <div class="q-text">${esc(q.domanda)}</div>
    ${canSay && Q.ambito?.includes?.("__tr") ? sayRow(quizWords(q.domanda)) : ""}
    <div class="q-opts">${q.opzioni.map((o, i) => `<button type="button" class="q-opt" data-o="${i}"><b>${"ABCDE"[i]}</b><span>${esc(o)}</span></button>`).join("")}</div>
    <div id="q-after"></div>
    <div class="q-ask"><h4>Chiedi all'AI</h4><div class="q-chat" id="q-chat"></div><div class="q-sugg" id="q-sugg"></div>
    <form id="q-ask-f"><input id="q-ask-in" type="text" autocomplete="off" placeholder="Non capisco una parola, dammi un indizio…"><button class="btn primary" type="submit">Chiedi</button></form></div></div>`;
  Q.answered = false;
  q.chat = q.chat || [];
  renderAsk();
  $("#d-body").scrollTop = 0;
}
function answerQ(i){
  const Q = S.quiz; if (!Q || Q.answered) return;
  Q.answered = true;
  const q = Q.qs[Q.i], ok = i === q.corretta;
  if (ok) Q.score++; else Q.wrong.push(Q.i);
  document.querySelectorAll(".q-opt").forEach((b, j) => { b.disabled = true; if (j === q.corretta) b.classList.add("ok"); else if (j === i) b.classList.add("ko"); });
  const note = q.nota && S.notes.find(n => n.id === q.nota);
  const last = Q.i === Q.qs.length - 1;
  const why = !ok && q.perche?.[i] ? `<p class="q-why"><b>Perché «${esc(q.opzioni[i])}» non va:</b> ${esc(q.perche[i])}</p>` : "";
  $("#q-after").innerHTML = `<div class="q-exp"><strong style="color:${ok ? "var(--ok)" : "var(--danger)"}">${ok ? "Giusto" : "Sbagliato"}</strong>${ok ? "" : `<p class="q-why"><b>Risposta giusta:</b> ${esc(q.opzioni[q.corretta])}</p>`}${why}<p class="q-why"><b>Perché:</b> ${esc(q.spiegazione)}</p>${canSay && Q.ambito?.includes?.("__tr") ? (w => w.length ? `<p class="q-why" style="margin-bottom:0"><b>Ascolta:</b></p>${sayRow(w)}` : "")(quizWords(q.domanda + " " + q.opzioni[q.corretta] + " " + q.spiegazione)) : ""}${note ? `<br><button class="linkbtn" type="button" data-open-q="${esc(note.id)}">Ripassa «${esc(note.titolo)}»</button>` : ""}</div>
    <div class="row" style="margin-top:14px"><button class="btn primary" type="button" id="q-next">${last ? "Vedi il risultato" : "Avanti →"}</button></div>`;
  document.querySelector(".q-bar i").style.width = ((Q.i + 1) / Q.qs.length) * 100 + "%";
  document.querySelector(".q-top span:last-child").textContent = `${Q.score} ${Q.score === 1 ? "giusta" : "giuste"}`;
  renderAsk();
  $("#q-next").focus({ preventScroll: true });
  $("#q-after").scrollIntoView({ behavior: reduced ? "auto" : "smooth", block: "nearest" });
}
function renderAsk(){
  const Q = S.quiz; if (!Q || !$("#q-chat")) return;
  const q = Q.qs[Q.i];
  $("#q-chat").innerHTML = (q.chat || []).map(m => m.r === "u" ? `<div class="me">${esc(m.t)}</div>` : m.wait ? `<div class="ai wait">Sto pensando…</div>` : `<div class="ai">${md(m.t)}</div>`).join("");
  const sugg = Q.answered ? ["Spiegamelo più semplice", "Fammi un esempio concreto", "Perché le altre sono sbagliate?"] : ["Dammi un indizio", "Cosa vuol dire la domanda?"];
  $("#q-sugg").innerHTML = (q.chat || []).length > 4 ? "" : sugg.map(t => `<button type="button" data-ask="${esc(t)}">${esc(t)}</button>`).join("");
}
async function askQ(text){
  const Q = S.quiz; text = String(text || "").trim(); if (!Q || !text) return;
  const q = Q.qs[Q.i]; q.chat = q.chat || [];
  if (q.chat.some(m => m.wait)) return;
  const note = q.nota && S.notes.find(n => n.id === q.nota);
  const prev = q.chat.map(m => (m.r === "u" ? "Utente: " : "AI: ") + m.t).join("\n");
  q.chat.push({ r: "u", t: text }, { r: "a", wait: true });
  renderAsk(); $("#q-ask-in").value = "";
  const rule = Q.answered
    ? `L'utente ha già risposto. Risposta giusta: "${q.opzioni[q.corretta]}". Spiegazione: ${q.spiegazione}. Puoi parlare liberamente della soluzione.`
    : `L'utente NON ha ancora risposto: NON rivelare quale opzione è giusta e non escludere opzioni in modo che la risposta diventi ovvia. Puoi chiarire parole, dare un indizio, ricordare un concetto.`;
  try {
    const r = await S.sample.json(`Sei un tutor paziente dentro un quiz. Domanda del quiz: "${q.domanda}"
Opzioni: ${q.opzioni.map((o, i) => "ABCDE"[i] + ") " + o).join(" · ")}
${rule}
${note ? `Argomento: ${note.titolo}. Sintesi: ${note.sintesi}` : ""}
${prev ? "Conversazione finora:\n" + prev : ""}
Nuova domanda dell'utente: ${text}
Rispondi in italiano, in modo semplice e chiaro, massimo 80 parole. Rispondi solo con JSON: {"risposta": "testo (markdown semplice consentito)"}`, { modelTier: "default", cache: false });
    q.chat[q.chat.length - 1] = { r: "a", t: String(r.risposta || "Non ho una risposta, prova a riformulare.") };
  } catch (e) {
    q.chat[q.chat.length - 1] = { r: "a", t: "Non sono riuscito a rispondere: " + errMsg(e) };
  }
  if (S.quiz === Q && Q.qs[Q.i] === q) { renderAsk(); $("#q-chat").lastElementChild?.scrollIntoView({ behavior: reduced ? "auto" : "smooth", block: "nearest" }); }
}
$("#d-body").addEventListener("submit", e => { if (e.target.id === "q-ask-f") { e.preventDefault(); askQ($("#q-ask-in").value); } });
function endQ(){
  const Q = S.quiz, tot = Q.qs.length, pct = Math.round(Q.score / tot * 100);
  const col = pct >= 80 ? "#5eead4" : pct >= 50 ? "#f2b55c" : "#fb7185";
  const verdict = pct === 100 ? "Perfetto, lo sai a memoria." : pct >= 80 ? "Ottimo, lo hai capito bene." : pct >= 50 ? "Buona base, qualcosa da ripassare." : "Vale la pena ripassare.";
  const wrongNotes = [...new Map(Q.wrong.map(i => Q.qs[i].nota).filter(Boolean).map(id => [id, S.notes.find(n => n.id === id)])).values()].filter(Boolean);
  const C = 2 * Math.PI * 62;
  $("#d-cat").innerHTML = `<span class="dot" style="color:${col}"></span>Risultato`;
  $("#d-body").innerHTML = `<div class="q-end">
    <svg class="q-ring" viewBox="0 0 150 150"><circle cx="75" cy="75" r="62" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="8"/><circle cx="75" cy="75" r="62" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(C * pct / 100).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 75 75)" style="filter:drop-shadow(0 0 8px ${col})"/><text x="75" y="72" text-anchor="middle" dominant-baseline="central" font-size="34" font-weight="300" fill="#fff" font-family="Sora, sans-serif">${Q.score}/${tot}</text><text x="75" y="100" text-anchor="middle" font-size="11" fill="#9890b3" font-family="Sora, sans-serif">${pct}%</text></svg>
    <div class="q-verdict">${verdict}</div>
    ${Q.wrong.length ? `<div class="row" style="justify-content:center;margin-top:6px"><button class="btn primary" type="button" id="q-wrong">Riprova le ${Q.wrong.length} ${Q.wrong.length === 1 ? "sbagliata" : "sbagliate"}</button></div>` : ""}
    ${wrongNotes.length ? `<div class="q-review d-sec"><h3>Da ripassare</h3><div class="links">${wrongNotes.map(n => `<button type="button" class="chip known" style="--c:${catColor(n.categoria)}" data-open="${esc(n.id)}">● ${esc(n.titolo)}</button>`).join("")}</div></div>` : ""}
    <div class="row" style="justify-content:center;margin-top:12px"><button class="btn ${Q.wrong.length ? "" : "primary"}" type="button" id="q-again">Nuovo test</button></div></div>`;
  S.lastWrong = { qs: Q.wrong.map(i => { const { chat, ...x } = Q.qs[i]; return x; }), ambito: Q.ambito };
  const rec = { createdAt: Date.now(), punteggio: Q.score, totale: tot, ambito: Q.ambito, sbagliate: wrongNotes.map(n => n.id), errori: JSON.parse(JSON.stringify(S.lastWrong.qs.map(({ chat, ...x }) => x))), ...(Q.ripasso ? { ripasso: true } : {}) };
  if (S.db) S.db.collection("tests").add(rec).catch(() => {}); else { S.tests = [rec, ...S.tests]; renderTestHome(); }
  S.quiz = null;
}
$("#d-body").addEventListener("click", e => {
  const o = e.target.closest(".q-opt"); if (o) { answerQ(+o.dataset.o); return; }
  const sg = e.target.closest("[data-ask]"); if (sg && S.quiz) { askQ(sg.dataset.ask); return; }

  const r = e.target.closest("[data-open-q]"); if (r) { S.quiz = null; openNote(r.dataset.openQ); }
});

/* ---------- immagini e schemi dal web ---------- */
const enc = encodeURIComponent;
const WEBL = {
  gimg: q => `https://www.google.com/search?tbm=isch&q=${enc(q)}`,
  commons: q => `https://commons.wikimedia.org/w/index.php?title=Special:MediaSearch&type=image&search=${enc(q)}`,
  wiki: t => `https://it.wikipedia.org/wiki/${enc(String(t).replace(/ /g, "_"))}`,
  pin: q => `https://www.pinterest.com/search/pins/?q=${enc(q)}`
};
function webHTML(n){
  const w = n.web || {}, qi = w.query_it || n.titolo, qe = w.query_en || qi;
  const a = (href, label, sub) => `<a class="wl" href="${esc(href)}" target="_blank" rel="noopener noreferrer"><b>${esc(label)}</b><small>${esc(sub)}</small></a>`;
  const links = [
    a(WEBL.gimg(qi), "Foto e immagini", "Google Immagini"),
    a(WEBL.commons(qe), "Immagini libere", "Wikimedia Commons"),
    w.wikipedia ? a(WEBL.wiki(w.wikipedia), "Voce con illustrazioni", "Wikipedia") : "",
    a(WEBL.gimg((w.schema_query || ("schema " + qi))), "Schemi e infografiche", "Google Immagini"),
    a(WEBL.gimg("diagram " + qe), "Diagrammi in inglese", "più risultati"),
    a(WEBL.pin((w.schema_query_en || ("infographic " + qe))), "Infografiche", "Pinterest")
  ].join("");
  const noti = (w.schemi_noti || []).slice(0, 4);
  return `<div class="wl-grid">${links}</div>${noti.length ? `<div class="wn"><div class="el-k" style="margin:14px 0 8px">Schemi famosi già fatti da altri</div>${noti.map(x => `<a class="wn-i" href="${esc(WEBL.gimg(x.cerca || x.titolo))}" target="_blank" rel="noopener noreferrer"><b>${esc(x.titolo)}</b>${x.fonte ? `<small>${esc(x.fonte)}</small>` : ""}${x.perche ? `<span>${esc(x.perche)}</span>` : ""}</a>`).join("")}</div>` : ""}`;
}
async function genWeb(){
  const n = S.notes.find(x => x.id === S.selected); if (!n || !needSample()) return;
  const btn = $("#mk-web"), box = $("#web-box"); btn.disabled = true;
  box.innerHTML = `<div class="inline-think"><span class="mini"></span>Preparo le ricerche…</div>`;
  try {
    const r = await S.sample.json(`L'utente vuole trovare sul web immagini e schemi già fatti su "${n.titolo}" (${catName(n.categoria)}). Sintesi: ${n.sintesi}
Dai:
- "query_it" e "query_en": le parole migliori per trovare un'immagine di questa cosa (2-5 parole);
- "schema_query" e "schema_query_en": le parole migliori per trovare schemi, diagrammi o infografiche che la spiegano;
- "wikipedia": il titolo esatto della voce di Wikipedia in italiano, solo se sei sicuro che esista, altrimenti "";
- "schemi_noti": 0-4 schemi, diagrammi o immagini FAMOSI e realmente esistenti che spiegano questo argomento (per esempio «Figura 1 del paper Attention Is All You Need», «la piramide di Maslow», «il ciclo di Krebs nei libri di biologia»), con "titolo", "fonte" (autore, rivista o sito), "perche" (max 12 parole) e "cerca" (query per trovarlo). Solo se sei certo che esistano: altrimenti lista vuota. Non inventare.
Rispondi solo con JSON: {"query_it","query_en","schema_query","schema_query_en","wikipedia","schemi_noti":[]}`, { modelTier: "default", cache: false });
    const str = v => String(v ?? "").trim();
    const web = { query_it: str(r.query_it), query_en: str(r.query_en), schema_query: str(r.schema_query), schema_query_en: str(r.schema_query_en), wikipedia: str(r.wikipedia),
      schemi_noti: (Array.isArray(r.schemi_noti) ? r.schemi_noti : []).slice(0, 4).map(x => ({ titolo: str(x.titolo), fonte: str(x.fonte), perche: str(x.perche), cerca: str(x.cerca) })).filter(x => x.titolo) };
    await patchNote(n.id, { web });
    if (S.selected === n.id) { box.innerHTML = webHTML({ ...n, web }); btn.textContent = "Cerca di nuovo"; btn.classList.remove("primary"); }
  } catch (e) { box.innerHTML = (n.web ? webHTML(n) : "") + `<p class="err">${esc(errMsg(e))}</p>`; }
  finally { if (btn.isConnected) btn.disabled = false; }
}

async function shrink(file, max, q){
  const bmp = await createImageBitmap(file, { imageOrientation: "from-image" }).catch(async () => {
    const url = URL.createObjectURL(file); const im = new Image(); im.src = url; await im.decode(); URL.revokeObjectURL(url); return im;
  });
  const w0 = bmp.width, h0 = bmp.height, k = Math.min(1, max / Math.max(w0, h0));
  const c = document.createElement("canvas"); c.width = Math.round(w0 * k); c.height = Math.round(h0 * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  return c;
}
async function explorePhoto(file){
  if (!file || S.busy) return;
  if (!/^image\//.test(file.type) && !/\.(heic|heif)$/i.test(file.name)) { toast("Scegli un'immagine"); return; }
  try {
    const big = await shrink(file, 1568);
    const blob = await new Promise(r => big.toBlob(r, "image/jpeg", .86));
    if (S.imgLim?.maxInputBytes && blob.size > S.imgLim.maxInputBytes) { toast("La foto è troppo grande"); return; }
    const small = await shrink(file, 720);
    let thumb = small.toDataURL("image/jpeg", .74);
    if (thumb.length > 180000) thumb = small.toDataURL("image/jpeg", .55);
    const note = q.value.trim(); q.value = ""; $("#go").disabled = true;
    explore(note, { blob, thumb });
  } catch { toast("Non riesco ad aprire questa immagine. Prova con una JPG o PNG."); }
}
