<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mia Dashboard</title>
<meta name="theme-color" content="#050608">
<meta name="description" content="La dashboard personale di Ale: meteo, calendario, notizie, conoscenza e collegamenti.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050608; --glass:rgba(20,24,33,.62); --glass-2:rgba(28,33,45,.7); --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --ink:#eef1f7; --muted:#97a0b3; --faint:#5d6578; --blue:#2f7bff; --blue-2:#5b9bff; --green:#34d399; --orange:#f59e0b; --red:#f43f5e; --teal:#22d3ee; --violet:#a78bfa;
  --r:22px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:Sora,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* sfere di luce sullo sfondo */
.orbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orbs i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55}
.orbs .o1{width:420px;height:420px;right:6%;top:-140px;background:radial-gradient(circle at 40% 40%,#f2b84b,#b8640f 60%,transparent 72%)}
.orbs .o2{width:520px;height:520px;left:-200px;bottom:-160px;background:radial-gradient(circle,#1d4fd8,#0b2a7a 55%,transparent 72%)}
.orbs .o3{width:360px;height:360px;right:-120px;bottom:-60px;background:radial-gradient(circle,#19c3d6,#0b6b80 55%,transparent 72%);opacity:.45}
.orbs .o4{width:300px;height:300px;left:42%;bottom:-170px;background:radial-gradient(circle,#2fd47c,#0e6b3d 55%,transparent 72%);opacity:.35}

.glass{background:linear-gradient(180deg,rgba(32,38,52,.55),rgba(14,17,24,.72));border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 20px 50px rgba(0,0,0,.35)}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:8px 16px;font-weight:500;font-size:13px}
.pill.blue{background:var(--blue);color:#fff;box-shadow:0 6px 24px rgba(47,123,255,.45)}
.pill.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line)}
.round{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 8px;border-radius:7px;background:rgba(52,211,153,.14);color:var(--green);font-weight:600}
.tag.blue{background:rgba(47,123,255,.16);color:var(--blue-2)} .tag.orange{background:rgba(245,158,11,.16);color:#fbbf24}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line-2);background:rgba(255,255,255,.04);font-size:13px;transition:.15s}
.chip.on{background:rgba(47,123,255,.2);border-color:var(--blue);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid var(--line-2);font-size:13px;font-weight:500}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.input{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line-2);background:rgba(0,0,0,.35);outline:none}
.input:focus{border-color:var(--blue)}
.soon{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:rgba(47,123,255,.1);border:1px solid rgba(47,123,255,.3);font-size:13px;line-height:1.5;color:#c9d8ff}

/* ================= PC ================= */
.app{position:relative;z-index:1;display:grid;grid-template-columns:250px 1fr;gap:22px;padding:22px;min-height:100vh}
.side{position:sticky;top:22px;height:calc(100vh - 44px);display:flex;flex-direction:column;padding:16px 12px}
.brand{display:flex;align-items:center;gap:11px;padding:4px 6px 14px}
.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#3b8bff,#1747c9);box-shadow:0 6px 18px rgba(47,123,255,.5);font-weight:700}
.brand b{display:block;font-size:15px} .brand small{font-size:11px;color:var(--muted)}
.search{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:12px;background:rgba(0,0,0,.3);border:1px solid var(--line);color:var(--muted);margin-bottom:8px}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:13px}
.search kbd{font-size:10px;padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.08);font-family:inherit}
.nav-h{font-size:10px;letter-spacing:.12em;color:var(--faint);font-weight:600;padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:11px;color:#c8cedb;font-size:13.5px;margin:1px 0}
.nav a:hover{background:rgba(255,255,255,.05)}
.nav a.on{background:linear-gradient(90deg,#2f7bff,#2563eb);color:#fff;box-shadow:0 6px 20px rgba(47,123,255,.35)}
.nav a .n{margin-left:auto;font-size:10px;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;background:rgba(47,123,255,.25);color:var(--blue-2)}
.nav a.on .n{background:rgba(255,255,255,.25);color:#fff}
.side .grow{flex:1}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#e8ecf5;color:#111;font-size:12px;font-weight:700}
.me b{font-size:13px;display:block} .me small{font-size:11px;color:var(--muted)}

.main{min-width:0;display:flex;flex-direction:column;gap:20px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:6px 4px 0}
.top h1{font-size:22px;font-weight:600;letter-spacing:-.01em}
.sub{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);margin-top:5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
.top .acts{display:flex;gap:10px;align-items:center;position:relative}
.menu{position:absolute;right:0;top:46px;z-index:20;min-width:220px;padding:6px;display:none}
.menu.open{display:block}
.menu button{display:flex;width:100%;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;text-align:left;font-size:13px}
.menu button:hover{background:rgba(255,255,255,.06)}

.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:20px}
.c{padding:20px;min-width:0}
.c h3{font-size:14px;font-weight:600}
.c .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.c .hd small{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;font-weight:400}
.c .hd a,.c .hd button.lnk{font-size:12px;color:var(--blue-2)}
.span8{grid-column:span 8}.span4{grid-column:span 4}.span6{grid-column:span 6}.span3{grid-column:span 3}.span12{grid-column:span 12}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line);margin:-20px -20px 18px}
.stat{padding:18px 20px;border-right:1px solid var(--line);min-width:0}
.stat:last-child{border-right:0}
.stat .l{font-size:11.5px;color:var(--muted)}
.stat .v{font-size:30px;font-weight:600;letter-spacing:-.02em;margin:6px 0 8px;white-space:nowrap}
.stat .s{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid var(--line)}
.seg button{padding:5px 12px;border-radius:999px;font-size:11.5px;color:var(--muted)}
.seg button.on{background:rgba(255,255,255,.12);color:#fff}
.chart{width:100%;height:240px;display:block}
.chart text{fill:var(--faint);font-size:10.5px;font-family:Sora,sans-serif}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .lbl b{font-size:24px;font-weight:600;display:block}
.ring .lbl small{font-size:11px;color:var(--muted)}
.kv{display:grid;grid-template-columns:1fr auto;gap:9px 14px;font-size:12.5px;align-content:center}
.kv span:nth-child(odd){color:var(--muted)} .kv span:nth-child(even){text-align:right;font-weight:500}
.bars{display:flex;align-items:flex-end;gap:5px;height:70px;margin:14px 0}
.bars i{flex:1;border-radius:4px 4px 2px 2px;background:linear-gradient(180deg,var(--blue-2),#1d4fd8);min-height:6px;opacity:.9}
.bars i.now{background:linear-gradient(180deg,#fbbf24,#d97706)}
.rows .r{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.rows .r:first-child{border-top:0}
.rows .r .t{flex:1;min-width:0}
.rows .r .t b{display:block;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rows .r .t small{font-size:11.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.nw-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;max-width:980px}
.nw-bar .sp{flex:1}
.br-row{display:flex;gap:10px;align-items:flex-end} .br-row .input{flex:1;resize:vertical}
.br-ans{margin-top:12px;padding:12px 14px;border-radius:12px;background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.3);font-size:13.5px;line-height:1.6}
.br-md{font-size:14px;line-height:1.65} .br-md h2{font-size:18px;margin:6px 0} .br-md h3,.br-md h4{font-size:15px;margin:10px 0 4px} .br-md p{margin:6px 0} .br-md ul{margin:6px 0 6px 18px}
.br-md blockquote{border-left:3px solid var(--line-2);padding-left:10px;color:var(--muted)} .br-md code{background:rgba(255,255,255,.08);padding:1px 5px;border-radius:5px}
.br-md .tag{font-size:11px} .br-ans p{margin:4px 0}
a.wl{color:#fbbf24;text-decoration:none;border-bottom:1px dashed rgba(251,191,36,.5)} a.wl.miss{color:var(--muted);border-bottom-color:var(--line-2)}
.br-ta{min-height:300px;font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.55;resize:vertical;margin-bottom:6px}
.br-back{margin-top:14px;padding-top:10px;border-top:1px solid var(--line);font-size:13px}
.br-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.br-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;max-width:980px}
.br-grp{display:flex;flex-direction:column;gap:6px} .br-h{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:4px 2px}
.br-it{text-align:left;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid var(--line)} .br-it.on{border-color:#f59e0b}
.br-it b{display:block;font-size:13.5px;font-weight:600} .br-it small{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.br-mini{font-size:13px} .br-mini p{margin:3px 0}
.nw-list{display:grid;gap:12px;max-width:980px}
.nw{padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid var(--line)}
.nw-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-bottom:6px}
.nw-n{padding:2px 8px;border-radius:999px;background:rgba(47,123,255,.16);color:var(--blue-2);font-weight:600}
.nw-n.hot{background:rgba(244,63,94,.18);color:#fda4af}
.nw-t{display:block;font-size:15px;font-weight:600;line-height:1.35;color:var(--ink)}
.nw-t:hover{color:#fff;text-decoration:underline}
.nw-s{font-size:13px;color:var(--muted);line-height:1.5;margin-top:6px}
.nw-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.nw-tags span{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted)}
.nw-act{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.nw-act .btn{padding:6px 11px;font-size:12px}
.nw-act details{font-size:12px;color:var(--muted)} .nw-act summary{cursor:pointer}
.nw-act details a{display:block;padding:3px 0;color:var(--blue-2)}
.nw-sum{margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.3);font-size:13px;line-height:1.55;white-space:pre-line}
.nw-sum:empty{display:none}
.nw-mini .r .t b{font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.minical{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px}
.minical .h{font-size:10.5px;color:var(--faint);padding-bottom:4px}
.minical span{padding:7px 0;border-radius:9px}
.minical span.x{color:var(--faint)}
.minical span{position:relative} .minical .dots{position:absolute;left:0;right:0;bottom:1px;display:flex;justify-content:center;gap:2px} .minical .dots b{width:4px;height:4px;border-radius:50%}
.minical span.pick{cursor:pointer} .minical span.pick:hover{background:rgba(255,255,255,.06)} .minical span.sel{outline:1px solid var(--blue)}
.gc-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;max-width:980px} @media (max-width:899px){.gc-grid{grid-template-columns:1fr}}
.gc-f{display:flex;flex-direction:column;gap:10px} .gc-row{display:flex;gap:10px} .gc-row>*{flex:1} .gc-chk{display:flex;align-items:center;gap:8px;font-size:13px}
.rm-chk{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-2);flex:0 0 auto;display:grid;place-items:center;font-size:12px;color:#fff} .rm-chk.on{background:var(--green);border-color:var(--green)}
.rm-done .t b{text-decoration:line-through;color:var(--muted)}
.al-r .t{flex:1 0 auto} .al-r .t b{white-space:nowrap}
.sc-help summary{cursor:pointer;font-size:14px} .gc-row .btn{flex:0 0 auto}
.gc-cols{display:flex;flex-wrap:wrap;gap:8px} .gc-col{width:28px;height:28px;border-radius:50%;border:2px solid transparent;outline:1px solid rgba(255,255,255,.12)} .gc-col.on{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
button.ev-r{width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);cursor:pointer} .rows button.ev-r:first-child{border-top:0} .ev-ic{border:0}
@media (max-width:560px){.gc-dt{display:none}}
.mk-list{display:flex;flex-direction:column} .mk-r{display:grid;grid-template-columns:1fr auto 84px;gap:6px 14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)} .mk-r:first-child{border-top:0}
.mk-n{display:flex;gap:8px;align-items:center;flex-wrap:wrap} .mk-n b{font-size:14px} .mk-l small{display:block;margin-top:3px;font-size:11.5px}
.mk-p{font-size:17px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums} .mk-why{grid-column:1/-1;font-size:12.5px;line-height:1.45;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.mk-why p{margin:2px 0} .mk-why b{color:var(--ink)} .tag.red{background:rgba(244,63,94,.16);color:#fb7185} .mk-kv span:nth-child(even){text-align:right}
@media (max-width:560px){.mk-sp{display:none} .mk-r{grid-template-columns:1fr auto}}
.btn.danger{background:rgba(244,63,94,.18);border-color:var(--red);color:#fda4af}
.gc-day{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:12px 0 2px}
.minical span.today{background:var(--blue);color:#fff;font-weight:600;box-shadow:0 4px 14px rgba(47,123,255,.5)}
.view{display:flex;flex-direction:column;gap:18px}
.view .c,.view .soon{max-width:980px}

/* ================= TELEFONO ================= */
.phone,.sheet{display:none}
@media (max-width:899px){
  .app{display:none}
  .phone{display:block;position:relative;z-index:1;min-height:100vh;padding:calc(var(--safe-t) + 18px) 20px calc(var(--safe-b) + 120px)}
  .orbs .o1{width:300px;height:300px;right:-90px;top:-90px}
  .orbs .o2{width:380px;height:380px;left:-180px;bottom:20%}
  .phone .ph-music{display:grid;position:absolute;right:16px;top:calc(var(--safe-t) + 12px);z-index:3}
  .ph-date{font-size:13px;color:var(--muted);text-align:center;font-weight:500}
  .ph-hello{font-size:13px;text-align:center;margin-top:2px}
  .wid{margin:16px 0 22px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-radius:24px}
  .wid .big{font-size:44px;font-weight:300;letter-spacing:-.03em;line-height:1}
  .wid .city{font-size:13px;font-weight:600}
  .wid .desc{font-size:12px;color:var(--muted);margin-top:4px}
  .wid .right{text-align:right;font-size:12px;color:var(--muted)}
  .wid .emo{font-size:30px;line-height:1;margin-bottom:6px}
  .apps{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 10px}
  .app-i{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px;color:#e6e9f0;text-align:center;-webkit-tap-highlight-color:transparent}
  .app-i .sq{position:relative;width:62px;height:62px;border-radius:16px;display:grid;place-items:center;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 8px 18px rgba(0,0,0,.35)}
  .app-i .sq svg.i{width:28px;height:28px;stroke-width:2}
  .app-i:active .sq{transform:scale(.92)}
  .app-i .badge{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--red);font-size:11px;font-weight:600;display:grid;place-items:center;border:2px solid var(--bg)}
  .cal-i{background:#fff!important;color:#111!important;display:flex!important;flex-direction:column;gap:0;align-items:center;justify-content:center}
  .cal-i small{font-size:9px;font-weight:700;color:var(--red);letter-spacing:.04em}
  .cal-i b{font-size:26px;font-weight:400;line-height:1}
  .dock{position:fixed;left:12px;right:12px;bottom:calc(var(--safe-b) + 10px);z-index:5;display:flex;justify-content:space-around;padding:12px 10px;border-radius:30px}
  .dock .app-i span.lab{display:none}
  .sheet{display:block;position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;transform:translateX(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding:calc(var(--safe-t) + 10px) 16px calc(var(--safe-b) + 40px)}
  .sheet.open{transform:none}
  .sheet .bar{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 0 14px;background:linear-gradient(var(--bg) 70%,transparent)}
  .sheet .bar button{color:var(--blue-2);font-size:15px;display:flex;align-items:center;gap:2px;justify-self:start}
  .sheet .bar h2{font-size:15px;font-weight:600}
  .sheet .c{padding:16px}

<script>
"use strict";
/* ---------------- dati e impostazioni (solo su questo dispositivo) ---------------- */
const KEY = "mia-dashboard-v1";
const DEF = {
  name: "Ale",
  city: { name: "Lugano", country: "Svizzera", lat: 46.0037, lon: 8.9511 },
  sound: { music: false, ui: true, vol: 0.6, style: "beat" },
  news: { cats: ["politica", "economia", "ai", "tecnologia", "hacker", "esteri", "clima", "altro"], countries: ["mondo"] },
  links: [
        { n: "karimvarini.com", u: "https://karimvarini.com", i: "globe" },
    { n: "OmniRoute (solo sul PC)", u: "http://localhost:20128", i: "server" },
    { n: "GitHub", u: "https://github.com/CyberGanna", i: "git" },
  ],
};
let S = load();
if (S.name === "Karim") { S.name = "Ale"; try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }
function load(){ try { return { ...structuredClone(DEF), ...JSON.parse(localStorage.getItem(KEY) || "{}") }; } catch { return structuredClone(DEF); } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} if (window.syncMark) window.syncMark(); }
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ico = (n, st = "") => `<svg class="i" style="${st}"><use href="#i-${n}"/></svg>`;
const toast = t => { const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 2200); };

const NEWS_CATS = [
  ["politica", "Politica"], ["economia", "Economia e finanza"], ["ai", "Intelligenza artificiale"], ["tecnologia", "Tecnologia"],
  ["hacker", "Attacchi hacker"], ["esteri", "Esteri e geopolitica"], ["clima", "COP31 e clima"], ["altro", "Altro"],
];
const COUNTRIES = [
  ["mondo", "Tutto il mondo"], ["us", "USA"], ["it", "Italia"], ["ch", "Svizzera"], ["eu", "Unione Europea"], ["uk", "Regno Unito"],
  ["de", "Germania"], ["es", "Spagna"], ["fr", "Francia"], ["ru", "Russia"], ["ua", "Ucraina"], ["cn", "Cina"], ["il", "Israele"],
  ["me", "Medio Oriente"], ["in", "India"], ["jp", "Giappone"], ["br", "Brasile"], ["tr", "Turchia"],
];

/* ---------------- app (stesse sezioni su PC e telefono) ---------------- */
const APPS = [
  { id: "oggi", t: "Dashboard", i: "grid", g: "linear-gradient(135deg,#3b8bff,#1747c9)", pcOnly: true },
  { id: "calendario", t: "Calendario", i: "cal", g: "#fff" },
  { id: "notizie", t: "Notizie", i: "news", g: "linear-gradient(135deg,#f43f5e,#be123c)" },
  { id: "conoscenza", t: "Conoscenza", i: "brain", g: "linear-gradient(135deg,#a78bfa,#6d28d9)" },
  { id: "cervello", t: "Cervello", i: "net", g: "linear-gradient(135deg,#f59e0b,#b45309)" },
  { id: "mercati", t: "Mercati", i: "chart", g: "linear-gradient(135deg,#22c55e,#15803d)", pcOnly: true },
  { id: "meteo", t: "Meteo", i: "sun", g: "linear-gradient(135deg,#38bdf8,#1d4ed8)" },
  { id: "promemoria", t: "Promemoria", i: "bell", g: "linear-gradient(135deg,#fb923c,#ea580c)" },
  { id: "sveglie", t: "Sveglie", i: "alarm", g: "linear-gradient(135deg,#334155,#0f172a)" },
  { id: "collegamenti", t: "Collegamenti", i: "link", g: "linear-gradient(135deg,#34d399,#047857)" },
  { id: "impostazioni", t: "Impostazioni", i: "sliders", g: "linear-gradient(135deg,#94a3b8,#475569)" },
];
const NAV = [["OGGI", ["oggi", "calendario", "promemoria", "sveglie"]], ["INFORMAZIONE", ["notizie", "mercati", "meteo", "conoscenza", "cervello"]], ["STRUMENTI", ["collegamenti", "impostazioni"]]];
const appById = id => APPS.find(a => a.id === id);
let cur = "oggi";
const isPhone = () => matchMedia("(max-width:899px)").matches;

function go(id, opt = {}){
  $("#new-menu").classList.remove("open");
  cur = id; renderStatic();
  if (isPhone()){
    if (id === "oggi") return closeSheet();
    $("#sheet-t").textContent = appById(id).t;
    $("#sheet-body").innerHTML = VIEWS[id](opt);
    $("#sheet").classList.toggle("portal-open", id === "conoscenza");
    $("#sheet").classList.add("open"); $("#sheet").scrollTop = 0;
    history.replaceState(null, "", "#" + id);
    after(id, $("#sheet-body"), opt);
  } else {
    renderNav();
    const body = $("#pc-body");
    body.innerHTML = id === "oggi" ? DASH() : `<div class="view">${VIEWS[id](opt)}</div>`;
    history.replaceState(null, "", id === "oggi" ? location.pathname : "#" + id);
    after(id, body, opt);
    window.scrollTo(0, 0);
  }
}
function closeSheet(){ $("#sheet").classList.remove("open"); cur = "oggi"; history.replaceState(null, "", location.pathname); renderPhone(); }

function renderNav(){
  $("#nav").innerHTML = NAV.map(([h, ids]) => `<div class="nav-h">${h}</div>` + ids.map(id => { const a = appById(id);
    const n = id === "conoscenza" && notes.length ? `<span class="n">${notes.length}</span>` : id === "collegamenti" ? `<span class="n">${S.links.length}</span>` : "";
    return `<a href="#${id}" class="${cur === id ? "on" : ""}" onclick="event.preventDefault();go('${id}')">${ico(a.i)}${a.t}${n}</a>`; }).join("")).join("");
}

/* ---------------- tempo ---------------- */
const GIORNI = ["domenica", "lunedì", "martedì", "mercoledì", "giovedì", "venerdì", "sabato"];
const MESI = ["gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno", "luglio", "agosto", "settembre", "ottobre", "novembre", "dicembre"];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const dateLong = d => `${cap(GIORNI[d.getDay()])} ${d.getDate()} ${MESI[d.getMonth()]}`;
const hhmm = d => d.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
const greet = () => { const h = new Date().getHours(); return h < 5 ? "Buonanotte" : h < 13 ? "Buongiorno" : h < 18 ? "Buon pomeriggio" : "Buonasera"; };
function weekNo(d){ const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day); const y = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y) / 864e5 + 1) / 7); }

/* ---------------- meteo (Open-Meteo, gratis, senza chiave) ---------------- */
const WMO = c => c === 0 ? ["☀️", "Sereno"] : c <= 2 ? ["🌤️", "Poco nuvoloso"] : c === 3 ? ["☁️", "Nuvoloso"] : c <= 48 ? ["🌫️", "Nebbia"] : c <= 57 ? ["🌦️", "Pioviggine"] : c <= 67 ? ["🌧️", "Pioggia"] : c <= 77 ? ["🌨️", "Neve"] : c <= 82 ? ["🌧️", "Rovesci"] : c <= 86 ? ["🌨️", "Rovesci di neve"] : ["⛈️", "Temporale"];
let W = null; try { W = JSON.parse(localStorage.getItem(KEY + "-meteo") || "null"); } catch {}
async function loadWeather(){
  const { lat, lon } = S.city;
  const u = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m&hourly=temperature_2m,weather_code,precipitation_probability&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset&timezone=auto&forecast_days=7`;
  try { const r = await fetch(u); if (!r.ok) throw 0; W = await r.json(); W._city = S.city.name; W._at = Date.now(); localStorage.setItem(KEY + "-meteo", JSON.stringify(W)); }
  catch { if (!W) return; }
  refresh();
}
const wOk = () => W && W._city === S.city.name;
function nextHours(n = 24){
  if (!wOk()) return [];
  const now = Date.now(), h = W.hourly, out = [];
  for (let i = 0; i < h.time.length && out.length < n; i++){ const t = new Date(h.time[i]); if (t.getTime() + 36e5 > now) out.push({ t, temp: h.temperature_2m[i], code: h.weather_code[i], rain: h.precipitation_probability[i] }); }
  return out;
}

/* ---------------- conoscenza: legge le note del portale (stesso sito, sola lettura) ---------------- */
let notes = [];
async function loadNotes(){
  try {
    if (indexedDB.databases){ const list = await indexedDB.databases(); if (!list.some(d => d.name === "portale-conoscenza")) return; }
    const db = await new Promise((res, rej) => { const r = indexedDB.open("portale-conoscenza"); r.onupgradeneeded = () => r.transaction.abort(); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
    if (!db.objectStoreNames.contains("docs")){ db.close(); return; }
    const all = await new Promise((res, rej) => { const out = [], rq = db.transaction("docs").objectStore("docs").openCursor(); rq.onsuccess = () => { const c = rq.result; if (c){ const k = String(c.key); if (/^notes\/[^/]+$/.test(k) && c.value) out.push(c.value); c.continue(); } else res(out); }; rq.onerror = () => rej(rq.error); });
    db.close();
    notes = all.filter(n => n.titolo).sort((a, b) => ts(b.createdAt) - ts(a.createdAt));
    refresh();
  } catch {}
}
const ts = v => typeof v === "number" ? v : v?.seconds ? v.seconds * 1000 : Date.parse(v) || 0;

/* ---------------- grafico ad area morbido ---------------- */
function areaChart(pts, { w = 760, h = 240, unit = "°" } = {}){
  if (pts.length < 2) return `<div class="muted" style="padding:40px 0;text-align:center">Carico il meteo…</div>`;
  const pad = { l: 34, r: 10, t: 14, b: 26 };
  const vals = pts.map(p => p.v), lo = Math.floor(Math.min(...vals) - 1), hi = Math.ceil(Math.max(...vals) + 1);
  const X = i => pad.l + i / (pts.length - 1) * (w - pad.l - pad.r), Y = v => pad.t + (hi - v) / (hi - lo || 1) * (h - pad.t - pad.b);
  const P = pts.map((p, i) => [X(i), Y(p.v)]);
  let d = `M${P[0][0]},${P[0][1]}`;
  for (let i = 0; i < P.length - 1; i++){ const p0 = P[i - 1] || P[i], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2] || p2;
    d += ` C${p1[0] + (p2[0] - p0[0]) / 6},${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6},${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]},${p2[1]}`; }
  const steps = 4, grid = Array.from({ length: steps + 1 }, (_, i) => lo + (hi - lo) * i / steps);
  const every = Math.ceil(pts.length / 7);
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#2f7bff" stop-opacity=".45"/><stop offset="1" stop-color="#2f7bff" stop-opacity="0"/></linearGradient>
    <filter id="gl"><feGaussianBlur stdDeviation="4"/></filter></defs>
    ${grid.map(v => `<line x1="${pad.l}" x2="${w - pad.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(255,255,255,.06)"/><text x="4" y="${Y(v) + 4}">${Math.round(v)}${unit}</text>`).join("")}
    <path d="${d} L${X(P.length - 1)},${h - pad.b} L${pad.l},${h - pad.b}Z" fill="url(#ga)"/>
    <path d="${d}" fill="none" stroke="#5b9bff" stroke-width="5" opacity=".5" filter="url(#gl)"/>
    <path d="${d}" fill="none" stroke="#5b9bff" stroke-width="2.2"/>
    <circle cx="${P[0][0]}" cy="${P[0][1]}" r="4.5" fill="#fbbf24" stroke="#050608" stroke-width="2"/>
    ${pts.map((p, i) => i % every === 0 ? `<text x="${X(i)}" y="${h - 6}" text-anchor="middle">${p.l}</text>` : "").join("")}
  </svg>`;
}

const BR_DIR = "cervello/";
const BR_TYPES = [["diario", "Diario", "#f59e0b"], ["idee", "Idee", "#a78bfa"], ["obiettivi", "Obiettivi", "#34d399"], ["progetti", "Progetti", "#2f7bff"],
  ["persone", "Persone", "#f472b6"], ["libri", "Libri e film", "#22d3ee"], ["spesa", "Liste", "#fb923c"], ["note", "Note", "#94a3b8"]];

const BR = { files: null, err: "", busy: false, open: null, edit: false, q: "", tab: "elenco", ai: "", aiBusy: false, at: 0 };
try { BR.files = JSON.parse(localStorage.getItem(KEY + "-cervello") || "null"); } catch {}

async function brApi(path, opt = {}){
  const c = brCfg();

async function brLoad(force){

  BR.busy = true; BR.err = "";

    const t = await brApi("git/trees/HEAD?recursive=1");
    if (t.status === 404 || t.status === 409){ BR.files = BR.files || []; if (t.status === 404) throw new Error(`non trovo la repository ${brCfg().repo}`); }
    else {
      const tree = (await t.json()).tree || [];
      const old = new Map((BR.files || []).map(f => [f.path, f]));
      const want = tree.filter(x => x.type === "blob" && x.path.startsWith(BR_DIR) && /\.md$/i.test(x.path));
      const out = [];
      const queue = [...want];
      await Promise.all(Array.from({ length: 6 }, async () => {
        for (let x; (x = queue.shift());){
          const o = old.get(x.path);

          const b = await brApi("git/blobs/" + x.sha); if (!b.ok) continue;

async function brWrite(path, text, msg){

function brMd(text){
  const inl = s => esc(s)
    .replace(/\[\[([^\]|#]+)(?:\|([^\]]+))?\]\]/g, (m, n, a) => { const f = brFind(n.trim()); return `<a class="wl ${f ? "" : "miss"}" href="#" onclick="event.preventDefault();brOpenName(decodeURIComponent('${jq(n.trim())}'))">${a || n}</a>`; })
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|\W)\*([^*\s][^*]*)\*/g, "$1<i>$2</i>").replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|\s)#([\p{L}\w-]+)/gu, '$1<span class="tag">#$2</span>');
  const out = []; let list = null;
  for (const raw of text.split("\n")){
    const l = raw.trimEnd(), m = l.match(/^\s*[-*]\s+(\[( |x)\]\s+)?(.*)$/i);
    if (m){ if (!list){ list = []; out.push(list); } list.push((m[1] ? (m[2].toLowerCase() === "x" ? "☑ " : "☐ ") : "") + inl(m[3])); continue; }
    list = null;
    const h = l.match(/^(#{1,3})\s+(.*)$/);
    if (h) out.push(`<h${h[1].length + 1}>${inl(h[2])}</h${h[1].length + 1}>`);
    else if (l.startsWith(">")) out.push(`<blockquote>${inl(l.replace(/^>\s?/, ""))}</blockquote>`);
    else if (l) out.push(`<p>${inl(l)}</p>`);
  }
  return out.map(x => Array.isArray(x) ? `<ul>${x.map(i => `<li>${i}</li>`).join("")}</ul>` : x).join("");
}

  try { toast("Salvo…"); await brWrite(BR.open, ta.value.replace(/\s*$/, "") + "\n"); BR.edit = false; toast("Salvato"); reView(); }
  catch (e){ toast("Errore: " + e.message); }

/* l'AI come "API del cervello": capisce se deve scrivere o rispondere */
async function brAsk(){
  const box = document.getElementById("br-q"); const q = box?.value.trim(); if (!q || BR.aiBusy) return;
  let key = ""; try { key = localStorage.getItem("pc_groq") || ""; } catch {}
  if (!key){ BR.ai = "Per l'AI serve la chiave Groq gratuita: inseriscila una volta nelle impostazioni AI del portale (Conoscenza)."; return reView(); }
  BR.aiBusy = true; BR.ai = "Ci penso…"; reView();
  const files = BR.files || [];
  const index = files.map(f => `${f.path} | ${brTitle(f)}`).join("\n").slice(0, 6000);
  const call = async (messages, json) => {
    for (const model of ["llama-3.3-70b-versatile", "llama-3.1-8b-instant"]){
      const r = await fetch("https://api.groq.com/openai/v1/chat/completions", { method: "POST", headers: { "content-type": "application/json", authorization: "Bearer " + key },
        body: JSON.stringify({ model, temperature: 0.2, max_tokens: 700, messages, ...(json ? { response_format: { type: "json_object" } } : {}) }) });
      if (r.status === 401) throw new Error("la chiave Groq non è valida");
      if (r.ok) return (await r.json()).choices?.[0]?.message?.content || "";
    }
    throw new Error("l'AI non risponde adesso");
  };
  try {
    let plan; const raw = await call([
      { role: "system", content: `Sei l'archivista del "secondo cervello" di ${S.name}: file Markdown nella cartella ${BR_DIR}, con sottocartelle ${BR_TYPES.map(t => t[0]).join(", ")}. Oggi è ${brToday()}.
Decidi se la richiesta chiede di SCRIVERE qualcosa nell'archivio o di RISPONDERE a una domanda. Rispondi solo con JSON:
{"azione":"scrivi","file":"${BR_DIR}<cartella>/<nome>.md","titolo":"...","testo":"riga o righe Markdown da aggiungere, in italiano, usando [[nome]] per collegare persone, progetti e idee"}
oppure {"azione":"rispondi","cerca":["parole chiave per trovare i file giusti"]}.
Regole: il diario del giorno è ${BR_DIR}diario/${brToday()}.md; se un file adatto esiste già usa quello; i nomi file nuovi sono minuscoli con trattini.
File esistenti (percorso | titolo):
${index || "(nessuno)"}` },
      { role: "user", content: q }], true);
    try { plan = JSON.parse(raw); } catch { plan = { azione: "rispondi", cerca: [] }; }
    if (plan.azione === "scrivi" && plan.file && plan.testo){
      let path = String(plan.file).replace(/^\/+/, ""); if (!path.startsWith(BR_DIR)) path = BR_DIR + path; if (!/\.md$/i.test(path)) path += ".md";
      path = path.replace(/\.\.+/g, "");
      await brAppend(path, plan.testo, plan.titolo);
      BR.ai = `Fatto: l'ho scritto in [[${brName(path)}]].\n\n${plan.testo}`; BR.open = path; BR.edit = false; box.value = "";
    } else {
      const words = [...new Set([...(plan.cerca || []), ...q.split(/\s+/)].map(w => String(w).toLowerCase()).filter(w => w.length > 3))];
      const scored = files.map(f => ({ f, s: words.reduce((a, w) => a + (f.text.toLowerCase().split(w).length - 1) + (f.path.toLowerCase().includes(w) ? 3 : 0), 0) })).filter(x => x.s).sort((a, b) => b.s - a.s).slice(0, 6);
      const ctx = scored.map(({ f }) => `### ${f.path}\n${f.text.slice(0, 1800)}`).join("\n\n");
      BR.ai = await call([
        { role: "system", content: `Rispondi in italiano, breve e diretto, usando SOLO i file del secondo cervello qui sotto. Cita i file con [[nome-file]] (senza .md). Se non trovi la risposta, dillo chiaramente.\n\n${ctx || "(nessun file pertinente)"}` },
        { role: "user", content: q }]);
    }
  } catch (e){ BR.ai = "Non ci sono riuscito: " + (e.message || e); }
  BR.aiBusy = false; reView();
}

/* grafo: punti = note, linee = [[collegamenti]] */
function brGraph(){
  const cv = document.getElementById("br-graph"); if (!cv) return;
  const files = BR.files || [], W2 = cv.clientWidth, H2 = cv.clientHeight, dpr = devicePixelRatio || 1;
  cv.width = W2 * dpr; cv.height = H2 * dpr; const g = cv.getContext("2d"); g.scale(dpr, dpr);
  const N = files.map((f, i) => ({ f, x: W2 / 2 + Math.cos(i * 2.4) * (40 + i * 6), y: H2 / 2 + Math.sin(i * 2.4) * (40 + i * 6), vx: 0, vy: 0, d: 0 }));
  const idx = new Map(files.map((f, i) => [f.path, i])), E = [];
  files.forEach((f, i) => brLinks(f.text).forEach(n => { const t = brFind(n); if (t && t.path !== f.path){ E.push([i, idx.get(t.path)]); N[i].d++; N[idx.get(t.path)].d++; } }));
  for (let it = 0; it < 260; it++){
    for (let a = 0; a < N.length; a++) for (let b = a + 1; b < N.length; b++){
      const dx = N[b].x - N[a].x, dy = N[b].y - N[a].y, d2 = dx * dx + dy * dy + 0.01, k = Math.min(8, 7000 / d2), d = Math.sqrt(d2);
      N[a].vx -= dx / d * k; N[a].vy -= dy / d * k; N[b].vx += dx / d * k; N[b].vy += dy / d * k;
    }
    for (const [a, b] of E){ const dx = N[b].x - N[a].x, dy = N[b].y - N[a].y, d = Math.hypot(dx, dy) || 1, f = (d - 110) * 0.03 / d; N[a].vx += dx * f; N[a].vy += dy * f; N[b].vx -= dx * f; N[b].vy -= dy * f; }
    for (const n of N){ n.vx += (W2 / 2 - n.x) * 0.003; n.vy += (H2 / 2 - n.y) * 0.003; n.x += n.vx * 0.5; n.y += n.vy * 0.5; n.vx *= 0.6; n.vy *= 0.6;
      n.x = Math.max(20, Math.min(W2 - 20, n.x)); n.y = Math.max(20, Math.min(H2 - 20, n.y)); }
  }
  g.strokeStyle = "rgba(160,180,255,.25)"; g.lineWidth = 1;
  for (const [a, b] of E){ g.beginPath(); g.moveTo(N[a].x, N[a].y); g.lineTo(N[b].x, N[b].y); g.stroke(); }
  g.font = "11px system-ui, sans-serif"; g.textAlign = "center";
  for (const n of N){ const r = 4 + Math.min(8, n.d * 1.5), c = BR_COL[brType(n.f.path)];
    g.beginPath(); g.arc(n.x, n.y, r, 0, 7); g.fillStyle = c; g.shadowColor = c; g.shadowBlur = 12; g.fill(); g.shadowBlur = 0;
    g.fillStyle = "rgba(230,235,245,.85)"; g.fillText(brTitle(n.f).slice(0, 22), n.x, n.y + r + 12); }
  cv.onclick = e => { const b = cv.getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top;
    let best = null, bd = 400; for (const n of N){ const d = (n.x - x) ** 2 + (n.y - y) ** 2; if (d < bd){ bd = d; best = n; } }
    if (best){ BR.open = best.f.path; BR.tab = "elenco"; BR.edit = false; reView(); } };
}

/* ---------------- GOOGLE CALENDAR ----------------
   Accesso con l'account Google di Ale (OAuth nel browser, gratis). Il permesso dura un'ora,
   poi basta un tocco su "Collega" (o si rinnova da solo se la sessione Google è aperta). */
const GC_SCOPE = "https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/calendar.readonly";
const GC_REDIRECT = location.origin + location.pathname.replace(/index\.html$/, "");
const GC_COL = { "": ["Colore del calendario", ""], 7: ["Pavone", "#039be5"], 9: ["Mirtillo", "#3f51b5"], 1: ["Lavanda", "#7986cb"], 3: ["Vinaccia", "#8e24aa"], 4: ["Fenicottero", "#e67c73"],
  11: ["Pomodoro", "#d50000"], 6: ["Mandarino", "#f4511e"], 5: ["Banana", "#f6bf26"], 2: ["Salvia", "#33b679"], 10: ["Basilico", "#0b8043"], 8: ["Grafite", "#616161"] };
const GC = { ev: null, err: "", busy: false, at: 0, form: false };
const gcId = () => (S.gcal && S.gcal.id) || "";
let GTOK = null; try { GTOK = JSON.parse(localStorage.getItem(KEY + "-gtok") || "null"); } catch {}
try { GC.ev = JSON.parse(localStorage.getItem(KEY + "-gcal") || "null"); } catch {}
const gcOk = () => GTOK && GTOK.exp > Date.now() + 60e3;
(function gcReturn(){
  // ritorno dalla pagina di Google: il token arriva nel frammento #access_token=...
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get("state") === "gcal" && h.get("access_token")){
    GTOK = { t: h.get("access_token"), exp: Date.now() + (+h.get("expires_in") || 3600) * 1000 };
    try { localStorage.setItem(KEY + "-gtok", JSON.stringify(GTOK)); } catch {}
    history.replaceState(null, "", location.pathname + "#calendario");
  } else if (h.get("state") === "gcal" && h.get("error")) history.replaceState(null, "", location.pathname + "#calendario");
})();
function gcLogin(silent){
  if (!gcId()) return go("impostazioni");
  const q = new URLSearchParams({ client_id: gcId(), redirect_uri: GC_REDIRECT, response_type: "token", scope: GC_SCOPE, state: "gcal", include_granted_scopes: "true", ...(silent ? { prompt: "none" } : {}) });
  location.href = "https://accounts.google.com/o/oauth2/v2/auth?" + q;
}
async function gcApi(path, opt = {}){
  const r = await fetch("https://www.googleapis.com/calendar/v3/" + path, { ...opt, headers: { Authorization: "Bearer " + GTOK.t, "Content-Type": "application/json", ...(opt.headers || {}) } });
  if (r.status === 401){ GTOK = null; try { localStorage.removeItem(KEY + "-gtok"); } catch {} throw new Error("scaduto"); }
  if (!r.ok) throw new Error("Google " + r.status);
  return r.status === 204 ? null : r.json();
}
const dayKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const evStart = e => new Date(e.start.dateTime || e.start.date + "T00:00:00");
const evEnd = e => new Date(e.end.dateTime || e.end.date + "T00:00:00");
const evAllDay = e => !e.start.dateTime;
async function gcLoad(force){
  if (!gcId() || !gcOk() || GC.busy || (!force && Date.now() - GC.at < 5 * 6e4)) return;
  GC.busy = true; GC.err = "";
  try {
    const from = new Date(); from.setDate(1); from.setMonth(from.getMonth() - 1); from.setHours(0, 0, 0, 0);
    const to = new Date(from); to.setMonth(to.getMonth() + 4);
    const items = [];
    const cals = (await gcApi("users/me/calendarList?minAccessRole=reader")).items || [{ id: "primary", backgroundColor: "#2f7bff", summary: "" }];
    for (const c of cals.filter(c => c.selected !== false).slice(0, 8)){
      const j = await gcApi(`calendars/${encodeURIComponent(c.id)}/events?singleEvents=true&orderBy=startTime&maxResults=500&timeMin=${from.toISOString()}&timeMax=${to.toISOString()}`);
      for (const e of j.items || []) if (e.status !== "cancelled" && e.start) items.push({ id: e.id, cal: c.id, col: (e.colorId && GC_COL[e.colorId]?.[1]) || c.backgroundColor || "#2f7bff", colorId: e.colorId || "", note: e.description || "", rec: !!e.recurringEventId, calName: c.summaryOverride || c.summary, t: e.summary || "(senza titolo)", where: e.location || "", start: e.start, end: e.end, link: e.htmlLink, own: c.accessRole === "owner" || c.accessRole === "writer" });
    }
    GC.ev = items.sort((a, b) => evStart(a) - evStart(b)); GC.at = Date.now();
    try { localStorage.setItem(KEY + "-gcal", JSON.stringify(GC.ev)); } catch {}
  } catch (e){ GC.err = e.message === "scaduto" ? "" : e.message; }
  GC.busy = false;
  if (cur === "calendario" && !GC.form && !(GC.bulk && GC.bulk.busy)) reView(); else if (cur === "oggi") refresh();
}
const evOn = d => (GC.ev || []).filter(e => { const s = evStart(e), en = evEnd(e), a = new Date(d.getFullYear(), d.getMonth(), d.getDate()), b = new Date(a); b.setDate(b.getDate() + 1); return s < b && (en > a || +s === +a); });
const evTime = e => evAllDay(e) ? "Tutto il giorno" : hhmm(evStart(e)) + "–" + hhmm(evEnd(e));
function evRows(list, empty){

    return e.own && gcOk() ? `<button class="r ev-r" onclick="gcEdit(decodeURIComponent('${jq(e.cal)}'),decodeURIComponent('${jq(e.id)}'))">${inner}<span class="muted" style="font-size:12px">Modifica</span></button>`
      : `<a class="r" href="${esc(e.link || "#")}" target="_blank" rel="noopener">${inner}</a>`; }).join("")}</div>`;
}

function gcBulkBox(){
  if (!GC.bulk) return "";
  return `<div class="glass c" id="gc-bulk"><div class="hd"><div><h3>Colora più eventi insieme</h3><small>Cambia il colore a tutti i tuoi eventi (passati e futuri) il cui titolo inizia con la parola che scrivi</small></div></div>
    <div class="gc-f"><input class="input" id="gcb-t" placeholder="Il titolo inizia con… (es. Verifica)" value="${esc(GC.bulk.t || "")}">

      ${GC.bulk.msg ? `<div class="muted" style="font-size:13px">${esc(GC.bulk.msg)}</div>` : ""}

async function gcBulk(){
  const t = $("#gcb-t").value.trim(), c = document.querySelector("#gc-bulk .gc-col.on")?.dataset.k ?? "11";
  if (!t) return toast("Scrivi con cosa inizia il titolo");
  const low = t.toLowerCase();
  GC.bulk = { t, c, busy: true, msg: "Cerco gli eventi…" }; reView();
  let done = 0, fail = 0;
  try {
    const cals = ((await gcApi("users/me/calendarList?minAccessRole=writer")).items || [{ id: "primary" }]);
    for (const cal of cals){
      let page = "";
      do {
        const j = await gcApi(`calendars/${encodeURIComponent(cal.id)}/events?singleEvents=false&maxResults=2500&q=${encodeURIComponent(t)}${page ? "&pageToken=" + encodeURIComponent(page) : ""}`);
        for (const e of j.items || []){
          if (e.status === "cancelled" || !(e.summary || "").trim().toLowerCase().startsWith(low) || (e.colorId || "") === c) continue;
          try { await gcApi(`calendars/${encodeURIComponent(cal.id)}/events/${encodeURIComponent(e.id)}`, { method: "PATCH", body: JSON.stringify({ colorId: c || null }) }); done++; GC.bulk.msg = `Colorati ${done}…`; }
          catch { fail++; }
        }
        page = j.nextPageToken || "";
      } while (page);
    }
    GC.bulk = { t, c, busy: false, msg: done ? `Fatto: ${done} eventi colorati${fail ? `, ${fail} non riusciti` : ""}.` : (fail ? `Non sono riuscito a cambiarne ${fail}.` : `Nessun evento da cambiare: o non ce ne sono, o hanno già quel colore.`) };
    toast(done ? `${done} eventi colorati` : "Niente da cambiare");
    await gcLoad(true);
  } catch (e){
    GC.bulk = { t, c, busy: false, msg: "" };
    if (e.message === "scaduto"){ toast("Permesso scaduto: ricollego"); return gcLogin(false); }
    toast("Errore: " + e.message);
  }
  reView();
}

/* ---------------- SINCRONIZZAZIONE PC <-> TELEFONO ----------------
   Le scelte della dashboard (nome, città, notizie, collegamenti, sveglie, promemoria, Google)
   vanno nel file dashboard.json della repository privata del portale. Vince la modifica più recente. */
const SYNC_KEYS = ["name", "city", "news", "links", "alarms", "rem", "gcal", "scOk"];
const SY = { snap: {}, busy: false, again: false, timer: null, last: 0, err: "" };
S._t = S._t || {};
const snapOf = k => JSON.stringify(S[k] ?? null);
for (const k of SYNC_KEYS) SY.snap[k] = snapOf(k);
window.syncMark = () => {
  let ch = false;
  for (const k of SYNC_KEYS){ const v = snapOf(k); if (v !== SY.snap[k]){ SY.snap[k] = v; S._t[k] = Date.now(); ch = true; } }
  if (ch){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} clearTimeout(SY.timer); SY.timer = setTimeout(dsSync, 2500); }
};
async function dsSync(){
  if (!brCfg().gh) return;
  if (SY.busy){ SY.again = true; return; }
  SY.busy = true;
  try {
    for (let i = 0; i < 3; i++){
      const g = await brApi("contents/dashboard.json?t=" + Date.now());
      let remote = { data: {}, t: {} }, sha;
      if (g.ok){ const j = await g.json(); sha = j.sha; try { remote = JSON.parse(b64d(j.content || "")); } catch {} }
      else if (g.status === 404){ const rr = await brApi(""); if (rr.status === 404) throw new Error(`non trovo la repository ${brCfg().repo}`); }
      else throw new Error("GitHub " + g.status);
      let changed = false, push = !sha;
      for (const k of SYNC_KEYS){
        const lt = S._t[k] || 0, rt = (remote.t || {})[k] || 0, has = remote.data && k in remote.data;
        if (has && (rt > lt || (lt === 0 && rt === 0 && snapOf(k) !== JSON.stringify(remote.data[k] ?? null) && sha))){
          S[k] = remote.data[k]; S._t[k] = rt; SY.snap[k] = snapOf(k); changed = true;
        } else if (lt > rt || !has) push = true;
      }
      if (changed){
        try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {}
        const typing = document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName);
        if (!typing) refresh();
      }
      if (!push) break;
      for (const k of SYNC_KEYS) if (!S._t[k]) S._t[k] = 1;
      const body = { formato: "mia-dashboard", versione: 1, aggiornato: new Date().toISOString(), data: Object.fromEntries(SYNC_KEYS.map(k => [k, S[k] ?? null])), t: Object.fromEntries(SYNC_KEYS.map(k => [k, S._t[k]])) };
      const p = await brApi("contents/dashboard.json", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: "Dashboard: sincronizzazione", content: b64e(JSON.stringify(body, null, 1)), ...(sha ? { sha } : {}) }) });
      if (p.ok){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} break; }
      if (p.status === 409 || p.status === 422) continue;
      throw new Error("GitHub " + p.status);
    }
    SY.last = Date.now(); SY.err = "";
  } catch (e){ SY.err = e.message || String(e); }
  SY.busy = false;
  if (cur === "impostazioni" && !(document.activeElement && /INPUT/.test(document.activeElement.tagName))) reView();
  if (SY.again){ SY.again = false; setTimeout(dsSync, 500); }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() - SY.last > 20e3) dsSync(); });
setInterval(() => { if (!document.hidden) dsSync(); }, 120e3);
function syncBox(){
  const on = !!brCfg().gh;
  return `<div class="glass c"><div class="hd"><div><h3>Sincronizzazione PC e telefono</h3><small>${!on ? "Non attiva" : SY.err ? "Problema: " + esc(SY.err) : SY.busy ? "Sincronizzo…" : SY.last ? "Attiva · ultima alle " + hhmm(new Date(SY.last)) : "Attiva"}</small></div><span class="muted">${ico("git")}</span></div>
    <p class="muted" style="font-size:13px;line-height:1.6">${on ? `Nome, città, notizie, collegamenti, sveglie, promemoria e Google Calendar sono salvati nella tua repository privata <b>${esc(brCfg().repo)}</b> e restano uguali su tutti i dispositivi. Musica e volume restano per dispositivo.`
      : `Usa la stessa chiave GitHub del portale. Apri <b>Conoscenza</b>, tocca ⚙ e attiva la sincronizzazione (sul telefono basta "Collega telefono" dal PC): da quel momento anche la dashboard si sincronizza da sola.`}</p>
    ${on ? `<button class="btn" style="margin-top:10px" onclick="dsSync()">Sincronizza adesso</button>` : `<button class="btn blue" style="margin-top:10px" onclick="go('conoscenza')">Apri Conoscenza</button>`}</div>`;
}

/* ---------------- TELEFONO: home con griglia di icone ---------------- */
function appIcon(a, withLab = true){
  const now = new Date();
  const inner = a.id === "calendario" ? `<small>${GIORNI[now.getDay()].slice(0, 3).toUpperCase()}</small><b>${now.getDate()}</b>` : ico(a.i);
  return `<button class="app-i" onclick="go('${a.id}')"><span class="sq ${a.id === "calendario" ? "cal-i" : ""}" style="background:${a.g}">${inner}</span>${withLab ? `<span class="lab">${a.t}</span>` : ""}</button>`;
}
function renderPhone(){
  const now = new Date();
  $("#ph-date").textContent = dateLong(now);
  $("#ph-hello").textContent = `${greet()}, ${S.name}`;
  const c = wOk() ? W.current : null, d = wOk() ? W.daily : null;
  $("#ph-wid").innerHTML = c ? `<div><div class="city">${esc(S.city.name)}</div><div class="big">${Math.round(c.temperature_2m)}°</div><div class="desc">${WMO(c.weather_code)[1]}</div></div><div class="right"><div class="emo">${WMO(c.weather_code)[0]}</div>Max ${Math.round(d.temperature_2m_max[0])}° Min ${Math.round(d.temperature_2m_min[0])}°<br>Pioggia ${d.precipitation_probability_max[0] ?? 0}%</div>`
    : `<div><div class="city">${esc(S.city.name)}</div><div class="desc">Carico il meteo…</div></div>`;
  const list = APPS.filter(a => !a.pcOnly && a.id !== "collegamenti");
  const links = S.links.filter(l => /^https?:\/\/([\w-]+\.)*github\.com/i.test(l.u)).slice(0, 2);
  $("#ph-apps").innerHTML = list.map(a => appIcon(a)).join("") + links.map(l => `<a class="app-i" href="${esc(l.u)}" ${/^https?:/.test(l.u) ? 'target="_blank" rel="noopener"' : ""}><span class="sq" style="background:linear-gradient(135deg,#1f2937,#0b1220);border:1px solid var(--line-2)">${ico(l.i || "link")}</span><span class="lab">${esc(l.n.length > 12 ? l.n.slice(0, 11) + "…" : l.n)}</span></a>`).join("");
  $("#ph-dock").style.display = "none";
}

/* ---------------- avvio ---------------- */
function renderStatic(){
  const now = new Date();
  $("#hello").textContent = `${greet()}, ${S.name}`;
  $("#sub").textContent = `${dateLong(now)} · ${cur === "oggi" ? "Dashboard" : appById(cur).t}`;
  $("#me-name").textContent = S.name; $("#me-sync").textContent = brCfg().gh ? "Uguale su PC e telefono" : "Dati salvati su questo dispositivo"; $("#me-av").textContent = S.name.slice(0, 2).toUpperCase();
}
function refresh(){
  renderStatic();
  if (isPhone()){ renderPhone(); if ($("#sheet").classList.contains("open") && cur !== "conoscenza" && cur !== "cervello") { $("#sheet-body").innerHTML = VIEWS[cur]({}); } }
  else { renderNav(); if (cur === "conoscenza" && $("#pc-body iframe")) return; if (cur === "cervello" && $("#pc-body .br-ai")) return; $("#pc-body").innerHTML = cur === "oggi" ? DASH() : `<div class="view">${VIEWS[cur]({})}</div>`; }
}
$("#new-btn").onclick = e => { e.stopPropagation(); $("#new-menu").classList.toggle("open"); };
document.addEventListener("click", e => { if (!e.target.closest("#new-menu")) $("#new-menu").classList.remove("open"); });
document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); $("#q").focus(); } if (e.key === "Escape" && isPhone()) closeSheet(); });
$("#q").addEventListener("keydown", e => { if (e.key !== "Enter") return; const v = e.target.value.trim().toLowerCase(); if (!v) return;
  const a = APPS.find(x => x.t.toLowerCase().includes(v)); if (a) { e.target.value = ""; return go(a.id); }
  const l = S.links.find(x => x.n.toLowerCase().includes(v)); if (l) { e.target.value = ""; return window.open(l.u, "_blank"); }
  toast("Nessun risultato per “" + e.target.value + "”"); });
matchMedia("(max-width:899px)").addEventListener("change", () => { const id = cur; $("#sheet").classList.remove("open"); refresh(); if (id !== "oggi") go(id); });
setInterval(() => { const el = $("#clock"); if (el) el.textContent = hhmm(new Date()); }, 15000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && (!W || Date.now() - (W._at || 0) > 30 * 6e4)) loadWeather(); });

let installBtn = null;
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installBtn = e; });
async function doInstall(){ if (!installBtn) return; installBtn.prompt(); await installBtn.userChoice; installBtn = null; reView(); }
/* suoni: il browser li sblocca solo dopo un tocco */
S.sound = { ...DEF.sound, ...(S.sound || {}) }; if (!S.sound.style) S.sound.style = "beat"; Sound.load(S.sound);
function paintMusic(){ document.querySelectorAll(".music-btn").forEach(b => b.classList.toggle("on", !!S.sound.music)); }
async function toggleMusic(){ S.sound.music = !S.sound.music; save(); paintMusic(); await Sound.setMusic(S.sound.music); toast(S.sound.music ? "Musica rilassante accesa" : "Musica spenta"); if (cur === "impostazioni") reView(); }
async function setStyle(v){ S.sound.style = v; save(); reView(); await Sound.setStyle(v); toast(v === "beat" ? "Stile: beat chill" : "Stile: calmo"); }
let unlocked = false;
document.addEventListener("pointerdown", e => {
  if (!unlocked){ unlocked = true; Sound.unlock(); }
}, { capture: true });
document.addEventListener("visibilitychange", () => document.hidden ? Sound.pause() : Sound.resume());
paintMusic();
/* aggiornamenti dell'app: su iPhone l'app aperta dall'icona resta in memoria con il codice vecchio.
   Quando torna in primo piano controllo se c'è una versione nuova e, appena è pronta, ricarico da solo. */
const APP_V = "15";
let swReg = null, bootAt = Date.now();
if ("serviceWorker" in navigator){
  const hadCtl = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(r => { swReg = r; r.update().catch(() => {}); }).catch(() => {});
  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (!hadCtl || reloading) return; reloading = true; location.reload(); });
}
async function checkAppUpdate(manual){
  try {
    const r = await fetch("version.txt", { cache: "no-store" }); const v = (await r.text()).trim();
    if (v && v !== APP_V){
      // al massimo un ricaricamento ogni 5 minuti per la stessa versione, per non entrare in un giro infinito
      let last = 0; try { last = +localStorage.getItem(KEY + "-upd-" + v) || 0; } catch {}
      if (!manual && Date.now() - last < 5 * 6e4) return;
      try { localStorage.setItem(KEY + "-upd-" + v, Date.now()); } catch {}
      if (manual) toast("Aggiorno l'app…"); swReg && await swReg.update().catch(() => {}); setTimeout(() => location.reload(), 600); return;
    }
    if (manual) toast("Hai già l'ultima versione");
  } catch { if (manual) toast("Nessuna connessione"); }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkAppUpdate(false); });
setTimeout(() => checkAppUpdate(false), 3000);

const start = (location.hash || "").slice(1);
refresh();
if (start && appById(start)) go(start);
loadWeather(); loadNotes(); loadNews(); loadMk(); brLoad(false); gcLoad(true); setTimeout(dsSync, 1200);
document.addEventListener("visibilitychange", () => { if (!document.hidden) gcLoad(false); });
setInterval(loadNews, 15 * 6e4); setInterval(loadMk, 10 * 6e4);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { loadNews(); loadMk(); } });
</script>
