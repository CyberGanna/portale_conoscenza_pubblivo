<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mia Dashboard</title>
<meta name="theme-color" content="#050608">
<meta name="description" content="La dashboard personale di Ale: meteo, calendario, notizie, conoscenza e collegamenti.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050608; --glass:rgba(20,24,33,.62); --glass-2:rgba(28,33,45,.7); --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --ink:#eef1f7; --muted:#97a0b3; --faint:#5d6578; --blue:#2f7bff; --blue-2:#5b9bff; --green:#34d399; --orange:#f59e0b; --red:#f43f5e; --teal:#22d3ee; --violet:#a78bfa;
  --r:22px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:Sora,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* sfere di luce sullo sfondo */
.orbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orbs i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55}
.orbs .o1{width:420px;height:420px;right:6%;top:-140px;background:radial-gradient(circle at 40% 40%,#f2b84b,#b8640f 60%,transparent 72%)}
.orbs .o2{width:520px;height:520px;left:-200px;bottom:-160px;background:radial-gradient(circle,#1d4fd8,#0b2a7a 55%,transparent 72%)}
.orbs .o3{width:360px;height:360px;right:-120px;bottom:-60px;background:radial-gradient(circle,#19c3d6,#0b6b80 55%,transparent 72%);opacity:.45}
.orbs .o4{width:300px;height:300px;left:42%;bottom:-170px;background:radial-gradient(circle,#2fd47c,#0e6b3d 55%,transparent 72%);opacity:.35}

.glass{background:linear-gradient(180deg,rgba(32,38,52,.55),rgba(14,17,24,.72));border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 20px 50px rgba(0,0,0,.35)}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:8px 16px;font-weight:500;font-size:13px}
.pill.blue{background:var(--blue);color:#fff;box-shadow:0 6px 24px rgba(47,123,255,.45)}
.pill.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line)}
.round{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 8px;border-radius:7px;background:rgba(52,211,153,.14);color:var(--green);font-weight:600}
.tag.blue{background:rgba(47,123,255,.16);color:var(--blue-2)} .tag.orange{background:rgba(245,158,11,.16);color:#fbbf24}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1px solid var(--line-2);background:rgba(255,255,255,.04);font-size:13px;transition:.15s}
.chip.on{background:rgba(47,123,255,.2);border-color:var(--blue);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid var(--line-2);font-size:13px;font-weight:500}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.input{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line-2);background:rgba(0,0,0,.35);outline:none}
.input:focus{border-color:var(--blue)}
.soon{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:rgba(47,123,255,.1);border:1px solid rgba(47,123,255,.3);font-size:13px;line-height:1.5;color:#c9d8ff}

/* ================= PC ================= */
.app{position:relative;z-index:1;display:grid;grid-template-columns:250px 1fr;gap:22px;padding:22px;min-height:100vh}
.side{position:sticky;top:22px;height:calc(100vh - 44px);display:flex;flex-direction:column;padding:16px 12px}
.brand{display:flex;align-items:center;gap:11px;padding:4px 6px 14px}
.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#3b8bff,#1747c9);box-shadow:0 6px 18px rgba(47,123,255,.5);font-weight:700}
.brand b{display:block;font-size:15px} .brand small{font-size:11px;color:var(--muted)}
.search{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:12px;background:rgba(0,0,0,.3);border:1px solid var(--line);color:var(--muted);margin-bottom:8px}
.search input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:13px}
.search kbd{font-size:10px;padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.08);font-family:inherit}
.nav-h{font-size:10px;letter-spacing:.12em;color:var(--faint);font-weight:600;padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:11px;color:#c8cedb;font-size:13.5px;margin:1px 0}
.nav a:hover{background:rgba(255,255,255,.05)}
.nav a.on{background:linear-gradient(90deg,#2f7bff,#2563eb);color:#fff;box-shadow:0 6px 20px rgba(47,123,255,.35)}
.nav a .n{margin-left:auto;font-size:10px;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;background:rgba(47,123,255,.25);color:var(--blue-2)}
.nav a.on .n{background:rgba(255,255,255,.25);color:#fff}
.side .grow{flex:1}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#e8ecf5;color:#111;font-size:12px;font-weight:700}
.me b{font-size:13px;display:block} .me small{font-size:11px;color:var(--muted)}

.main{min-width:0;display:flex;flex-direction:column;gap:20px;padding-bottom:80px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:6px 4px 0}
.top h1{font-size:22px;font-weight:600;letter-spacing:-.01em}
.sub{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);margin-top:5px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}
.top .acts{display:flex;gap:10px;align-items:center;position:relative}
.menu{position:absolute;right:0;top:46px;z-index:20;min-width:220px;padding:6px;display:none}
.menu.open{display:block}
.menu button{display:flex;width:100%;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;text-align:left;font-size:13px}
.menu button:hover{background:rgba(255,255,255,.06)}

.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:20px}
/* benvenuto */
.wel{position:relative;overflow:hidden;border-radius:28px;padding:34px 34px 30px;margin-bottom:26px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(20,26,44,.85),rgba(8,10,18,.9))}
.wel-aura{position:absolute;inset:0;pointer-events:none;filter:blur(60px);opacity:.55}
.wel-aura i{position:absolute;width:420px;height:420px;border-radius:50%;animation:welFloat 16s ease-in-out infinite alternate}
.wel-aura i:nth-child(1){background:#3b82f6;left:-120px;top:-160px} .wel-aura i:nth-child(2){background:#a855f7;right:-100px;top:-120px;animation-duration:19s;animation-delay:-5s} .wel-aura i:nth-child(3){background:#10b981;left:35%;bottom:-260px;opacity:.6;animation-duration:22s;animation-delay:-9s}
@keyframes welFloat{0%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,40px) scale(1.15)}100%{transform:translate(-40px,70px) scale(.9)}}
.wel-top{position:relative;display:flex;align-items:center;gap:20px;margin-bottom:26px}
.wel-orb{--s:64px}
.wel-h{margin:0;font-size:38px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.wel-h span{display:inline-block}
.wel-in .wel-h span{opacity:0;transform:translateY(18px) rotate(4deg);filter:blur(6px);animation:welCh .55s cubic-bezier(.2,.9,.3,1.2) forwards;animation-delay:var(--d)}
@keyframes welCh{to{opacity:1;transform:none;filter:none}}
.wel-q{margin:8px 0 0;font-size:17px;color:var(--muted)}
.wel-rot{position:relative;display:inline-grid;color:var(--ink);font-weight:600} .wel-rot span{grid-area:1/1;opacity:0;animation:welRot 9s infinite;background:linear-gradient(90deg,#60a5fa,#c084fc,#34d399);-webkit-background-clip:text;background-clip:text;color:transparent}
.wel-rot span:nth-child(2){animation-delay:3s} .wel-rot span:nth-child(3){animation-delay:6s}
@keyframes welRot{0%{opacity:0;transform:translateY(10px)}5%,30%{opacity:1;transform:none}35%,100%{opacity:0;transform:translateY(-10px)}}
.wel-grid{position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.wel-c{--mx:50%;--my:50%;position:relative;display:flex;align-items:center;gap:14px;text-align:left;padding:16px 16px 16px 14px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.035);color:var(--ink);cursor:pointer;overflow:hidden;transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .25s,background .25s,box-shadow .25s;font:inherit}
.wel-c::before{content:"";position:absolute;inset:0;background:radial-gradient(240px circle at var(--mx) var(--my),rgba(255,255,255,.10),transparent 60%);opacity:0;transition:opacity .25s}
.wel-c:hover{border-color:rgba(255,255,255,.22);background:rgba(255,255,255,.06);box-shadow:0 14px 40px rgba(0,0,0,.35)} .wel-c:hover::before{opacity:1}
.wel-in .wel-c{opacity:0;transform:translateY(22px) scale(.97);animation:welCard .6s cubic-bezier(.2,.9,.3,1.15) forwards;animation-delay:calc(.75s + var(--i) * .07s)}
@keyframes welCard{to{opacity:1;transform:none}}
.wel-ic{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:13px;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.35)} .wel-ic .i{width:22px;height:22px}
.wel-c:hover .wel-ic{animation:welPop .5s cubic-bezier(.2,.9,.3,1.6)} @keyframes welPop{40%{transform:scale(1.15) rotate(-6deg)}}
.wel-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px} .wel-t b{font-size:14.5px;font-weight:600} .wel-t small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wel-ar{opacity:.35;font-size:18px;transition:transform .25s,opacity .25s} .wel-c:hover .wel-ar{opacity:1;transform:translateX(4px)}
.wel-flash{animation:welFlash 2.2s ease} @keyframes welFlash{0%,100%{box-shadow:none}15%,55%{box-shadow:0 0 0 2px #60a5fa,0 0 40px rgba(96,165,250,.45)}}
.wel-sep{display:flex;align-items:center;gap:12px;margin:0 0 18px;color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase} .wel-sep::before,.wel-sep::after{content:"";flex:1;height:1px;background:var(--line)}
html.no-anim .wel-in .wel-h span,html.no-anim .wel-in .wel-c{animation:none;opacity:1;transform:none;filter:none} html.no-anim .wel-aura i{animation:none}
@media (prefers-reduced-motion:reduce){.wel-in .wel-h span,.wel-in .wel-c{animation:none;opacity:1;transform:none;filter:none}.wel-aura i,.wel-rot span{animation:none}.wel-rot span:first-child{opacity:1}}
.c{padding:20px;min-width:0}
.c h3{font-size:14px;font-weight:600}
.c .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.c .hd small{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;font-weight:400}
.c .hd a,.c .hd button.lnk{font-size:12px;color:var(--blue-2)}
.span8{grid-column:span 8}.span4{grid-column:span 4}.span6{grid-column:span 6}.span3{grid-column:span 3}.span12{grid-column:span 12}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line);margin:-20px -20px 18px}
.stat{padding:18px 20px;border-right:1px solid var(--line);min-width:0}
.stat:last-child{border-right:0}
.stat .l{font-size:11.5px;color:var(--muted)}
.stat .v{font-size:30px;font-weight:600;letter-spacing:-.02em;margin:6px 0 8px;white-space:nowrap}
.stat .s{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid var(--line)}
.seg button{padding:5px 12px;border-radius:999px;font-size:11.5px;color:var(--muted)}
.seg button.on{background:rgba(255,255,255,.12);color:#fff}
.chart{width:100%;height:240px;display:block}
.chart text{fill:var(--faint);font-size:10.5px;font-family:Sora,sans-serif}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .lbl b{font-size:24px;font-weight:600;display:block}
.ring .lbl small{font-size:11px;color:var(--muted)}
.kv{display:grid;grid-template-columns:1fr auto;gap:9px 14px;font-size:12.5px;align-content:center}
.kv span:nth-child(odd){color:var(--muted)} .kv span:nth-child(even){text-align:right;font-weight:500}
.bars{display:flex;align-items:flex-end;gap:5px;height:70px;margin:14px 0}
.bars i{flex:1;border-radius:4px 4px 2px 2px;background:linear-gradient(180deg,var(--blue-2),#1d4fd8);min-height:6px;opacity:.9}
.bars i.now{background:linear-gradient(180deg,#fbbf24,#d97706)}
.rows .r{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.rows .r:first-child{border-top:0}
.rows .r .t{flex:1;min-width:0}
.rows .r .t b{display:block;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rows .r .t small{font-size:11.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.nw-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;max-width:980px}
.nw-bar .sp{flex:1}
.br-row{display:flex;gap:10px;align-items:flex-end} .br-row .input{flex:1;resize:vertical}
.br-ans{margin-top:12px;padding:12px 14px;border-radius:12px;background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.3);font-size:13.5px;line-height:1.6}
.br-md{font-size:14px;line-height:1.65} .br-md h2{font-size:18px;margin:6px 0} .br-md h3,.br-md h4{font-size:15px;margin:10px 0 4px} .br-md p{margin:6px 0} .br-md ul{margin:6px 0 6px 18px}
.br-md blockquote{border-left:3px solid var(--line-2);padding-left:10px;color:var(--muted)} .br-md code{background:rgba(255,255,255,.08);padding:1px 5px;border-radius:5px}
.br-md .tag{font-size:11px} .br-ans p{margin:4px 0}
a.wl{color:#fbbf24;text-decoration:none;border-bottom:1px dashed rgba(251,191,36,.5)} a.wl.miss{color:var(--muted);border-bottom-color:var(--line-2)}
.br-ta{min-height:300px;font-family:ui-monospace,Menlo,monospace;font-size:13px;line-height:1.55;resize:vertical;margin-bottom:6px}
.br-back{margin-top:14px;padding-top:10px;border-top:1px solid var(--line);font-size:13px}
.br-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.br-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;max-width:980px}
.br-grp{display:flex;flex-direction:column;gap:6px} .br-h{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:4px 2px}
.br-it{text-align:left;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid var(--line)} .br-it.on{border-color:#f59e0b}
.br-it b{display:block;font-size:13.5px;font-weight:600} .br-it small{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.br-mini{font-size:13px} .br-mini p{margin:3px 0}
.nw-list{display:grid;gap:12px;max-width:980px}
.nw{padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid var(--line)}
.nw-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-bottom:6px}
.nw-n{padding:2px 8px;border-radius:999px;background:rgba(47,123,255,.16);color:var(--blue-2);font-weight:600}
.nw-n.hot{background:rgba(244,63,94,.18);color:#fda4af}
.nw-t{display:block;font-size:15px;font-weight:600;line-height:1.35;color:var(--ink)}
.nw-t:hover{color:#fff;text-decoration:underline}
.nw-s{font-size:13px;color:var(--muted);line-height:1.5;margin-top:6px}
.nw-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.nw-tags span{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted)}
.nw-act{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.nw-act .btn{padding:6px 11px;font-size:12px}
.nw-act details{font-size:12px;color:var(--muted)} .nw-act summary{cursor:pointer}
.nw-act details a{display:block;padding:3px 0;color:var(--blue-2)}
.nw-sum{margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.3);font-size:13px;line-height:1.55;white-space:pre-line}
.nw-sum:empty{display:none}
.nw-mini .r .t b{font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.minical{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px}
.minical .h{font-size:10.5px;color:var(--faint);padding-bottom:4px}
.minical span{padding:7px 0;border-radius:9px}
.minical span.x{color:var(--faint)}
.minical span{position:relative} .minical .dots{position:absolute;left:0;right:0;bottom:1px;display:flex;justify-content:center;gap:2px} .minical .dots b{width:4px;height:4px;border-radius:50%}
.minical span.pick{cursor:pointer} .minical span.pick:hover{background:rgba(255,255,255,.06)} .minical span.sel{outline:1px solid var(--blue)}
.gc-grid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1fr);gap:18px} @media (max-width:1180px){.gc-grid{grid-template-columns:1fr}} @media (max-width:899px){.gc-grid{grid-template-columns:1fr}}
.bigcal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.bc-h{font-size:11px;color:var(--faint);text-align:left;padding:0 6px 2px;text-transform:uppercase;letter-spacing:.05em}
.bc-d{min-height:104px;border-radius:12px;background:rgba(255,255,255,.025);border:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;overflow:hidden;transition:background .15s}
.bc-d:hover{background:rgba(255,255,255,.06)} .bc-d.x{background:transparent;border-color:transparent;cursor:default}

function areaChart(pts, { w = 760, h = 240, unit = "°" } = {}){
  if (pts.length < 2) return `<div class="muted" style="padding:40px 0;text-align:center">Carico il meteo…</div>`;
  const pad = { l: 34, r: 10, t: 14, b: 26 };
  const vals = pts.map(p => p.v), lo = Math.floor(Math.min(...vals) - 1), hi = Math.ceil(Math.max(...vals) + 1);
  const X = i => pad.l + i / (pts.length - 1) * (w - pad.l - pad.r), Y = v => pad.t + (hi - v) / (hi - lo || 1) * (h - pad.t - pad.b);
  const P = pts.map((p, i) => [X(i), Y(p.v)]);
  let d = `M${P[0][0]},${P[0][1]}`;
  for (let i = 0; i < P.length - 1; i++){ const p0 = P[i - 1] || P[i], p1 = P[i], p2 = P[i + 1], p3 = P[i + 2] || p2;
    d += ` C${p1[0] + (p2[0] - p0[0]) / 6},${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6},${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]},${p2[1]}`; }
  const steps = 4, grid = Array.from({ length: steps + 1 }, (_, i) => lo + (hi - lo) * i / steps);
  const every = Math.ceil(pts.length / 7);
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <defs><linearGradient id="ga" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#2f7bff" stop-opacity=".45"/><stop offset="1" stop-color="#2f7bff" stop-opacity="0"/></linearGradient>
    <filter id="gl"><feGaussianBlur stdDeviation="4"/></filter></defs>
    ${grid.map(v => `<line x1="${pad.l}" x2="${w - pad.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(255,255,255,.06)"/><text x="4" y="${Y(v) + 4}">${Math.round(v)}${unit}</text>`).join("")}
    <path d="${d} L${X(P.length - 1)},${h - pad.b} L${pad.l},${h - pad.b}Z" fill="url(#ga)"/>
    <path d="${d}" fill="none" stroke="#5b9bff" stroke-width="5" opacity=".5" filter="url(#gl)"/>
    <path d="${d}" fill="none" stroke="#5b9bff" stroke-width="2.2"/>
    <circle cx="${P[0][0]}" cy="${P[0][1]}" r="4.5" fill="#fbbf24" stroke="#050608" stroke-width="2"/>
    ${pts.map((p, i) => i % every === 0 ? `<text x="${X(i)}" y="${h - 6}" text-anchor="middle">${p.l}</text>` : "").join("")}
  </svg>`;
}

function bigCal(y, m){
  const first = new Date(y, m, 1), days = new Date(y, m + 1, 0).getDate(), off = (first.getDay() + 6) % 7, today = new Date();
  const selK = typeof calSel === "string" ? calSel.slice(0, 10) : dayKey(today);

  for (let i = 0; i < off; i++) cells += `<div class="bc-d x"></div>`;
  for (let d = 1; d <= days; d++){
    const dt = new Date(y, m, d), k = dayKey(dt), t = dayKey(today) === k, ev = GC.ev ? evOn(dt) : [];
    cells += `<div class="bc-d ${t ? "today" : ""} ${k === selK ? "sel" : ""}" onclick="calSel='${k}T12:00:00';reView()"><span class="bc-n">${d}</span>
      ${ev.slice(0, 3).map(e => `<span class="bc-e" style="--c:${esc(e.col)}">${evAllDay(e) ? "" : `<b>${hhmm(evStart(e))}</b> `}${esc(e.t)}</span>`).join("")}${ev.length > 3 ? `<span class="bc-more">+${ev.length - 3} ${EN ? "more" : "altri"}</span>` : ""}</div>`;
  }
  const tail = (7 - (off + days) % 7) % 7; for (let i = 0; i < tail; i++) cells += `<div class="bc-d x"></div>`;
  return `<div class="bigcal">${cells}</div>`;
}
function miniCal(y, m, pick){
  const first = new Date(y, m, 1), days = new Date(y, m + 1, 0).getDate(), off = (first.getDay() + 6) % 7, prev = new Date(y, m, 0).getDate(), today = new Date();
  let cells = (EN ? ["M", "T", "W", "T", "F", "S", "S"] : ["L", "M", "M", "G", "V", "S", "D"]).map(d => `<div class="h">${d}</div>`).join("");
  for (let i = 0; i < off; i++) cells += `<span class="x">${prev - off + 1 + i}</span>`;
  const selK = typeof calSel === "string" ? calSel.slice(0, 10) : "";
  for (let d = 1; d <= days; d++){ const t = today.getFullYear() === y && today.getMonth() === m && today.getDate() === d, dt = new Date(y, m, d), k = dayKey(dt), ev = typeof GC !== "undefined" && GC.ev ? evOn(dt) : [];
    const dots = ev.length ? `<i class="dots">${ev.slice(0, 3).map(e => `<b style="background:${esc(e.col)}"></b>`).join("")}</i>` : "";
    cells += pick ? `<span class="${t ? "today" : ""} ${k === selK ? "sel" : ""} pick" onclick="calSel='${k}T12:00:00';reView()">${d}${dots}</span>` : `<span class="${t ? "today" : ""}">${d}${dots}</span>`; }
  const tail = (7 - (off + days) % 7) % 7; for (let i = 1; i <= tail; i++) cells += `<span class="x">${i}</span>`;

/* l'Action che trascrive, scritta una volta sola nella repository privata */
const VD_WF = `name: Video salvati
# Scrive la dashboard: per ogni link in video/coda scarica l'audio, lo trascrive con Whisper (gratis, sul server di GitHub)
# e salva didascalia + trascrizione in video/<id>.json. L'analisi la fa poi Aris nella dashboard.
on:
  push:
    paths: ["video/coda/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: video
  cancel-in-progress: false
jobs:
  trascrivi:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -U yt-dlp faster-whisper imageio-ffmpeg numpy
      - name: Trascrivi i video in coda
        run: |
          python3 - <<'PY'
          import glob, json, os, subprocess, time
          import numpy as np, imageio_ffmpeg
          from faster_whisper import WhisperModel
          model = None
          for q in sorted(glob.glob("video/coda/*.json")):
              job = json.load(open(q)); vid = job["id"]; url = job["u"]; out = {"id": vid, "u": url, "at": int(time.time() * 1000)}
              for f in glob.glob("/tmp/a.*"): os.remove(f)
              r = subprocess.run(["yt-dlp", "--no-warnings", "--no-playlist", "-f", "bestaudio/best", "-o", "/tmp/a.%(ext)s", "--write-info-json", "--max-filesize", "200M", url], capture_output=True, text=True, timeout=600)
              info = {}
              if os.path.exists("/tmp/a.info.json"): info = json.load(open("/tmp/a.info.json"))
              out.update({"title": info.get("title") or "", "cap": (info.get("description") or "")[:3000], "by": info.get("uploader") or info.get("channel") or "", "dur": info.get("duration") or 0, "thumb": info.get("thumbnail") or ""})
              media = [f for f in glob.glob("/tmp/a.*") if not f.endswith(".json")]
              if media:
                  model = model or WhisperModel("small", device="cpu", compute_type="int8")
                  raw = subprocess.run([imageio_ffmpeg.get_ffmpeg_exe(), "-nostdin", "-i", media[0], "-f", "s16le", "-ac", "1", "-ar", "16000", "-"], capture_output=True).stdout
                  audio = np.frombuffer(raw, np.int16).astype(np.float32) / 32768.0
                  segs, inf = model.transcribe(audio, vad_filter=True)
                  out["tr"] = " ".join(s.text.strip() for s in segs)[:12000]; out["lang"] = inf.language
              else:
                  out["err"] = (r.stderr or r.stdout or "download non riuscito")[-400:]
              json.dump(out, open(f"video/{vid}.json", "w"), ensure_ascii=False)
              os.remove(q)
              print(vid, url, "ok" if media else "senza audio")
          PY
      - name: Salva i risultati
        run: |
          git config user.name "video-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A video
          git diff --cached --quiet && exit 0
          git commit -q -m "Video trascritti"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
`;

function mdlRun(fn, id){ const g = EN; EN = MDL_EN; try { fn(); } finally { EN = g; } const el = document.getElementById(id); if (el) mdlTr(el); }
async function trText(t, tl){
  const k = tl + "|" + t; if (k in TR_C) return TR_C[k];
  try { const r = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${tl}&dt=t&q=${encodeURIComponent(t)}`); const j = await r.json(); return TR_C[k] = (j[0] || []).map(x => x[0]).join("") || t; }

function mdlTr(el){
  const tl = MDL_EN ? "en" : "it", nodes = [];
  el.querySelectorAll("[data-tr]").forEach(e => { if (e.dataset.tr === "ai" && MDL_EN === EN0) return;
    const w = document.createTreeWalker(e, NodeFilter.SHOW_TEXT); let n; while ((n = w.nextNode())) if (/[a-zà-ù]{3}/i.test(n.nodeValue)) nodes.push(n); });
  const miss = [];

  miss.forEach(async n => { const t = n.nodeValue.trim(), out = await trText(t, tl); if (n.isConnected && n.nodeValue.trim() === t && (MDL_EN ? "en" : "it") === tl) n.nodeValue = n.nodeValue.replace(t, out); });

      const text = /^#\s+/m.test(f.text) && f.text.trim().startsWith("#") && !f.text.trim().startsWith("##") ? f.text.replace(/^#\s+[^\n]*/, "# " + nome) : `# ${nome}\n\n` + f.text.replace(/^\s+/, "");
      try { await brWrite(f.path, text, "Cervello: nuovo nome " + nome); n++; } catch {} }
    if (force) toast(n ? `Rinominate ${n} note` : "I nomi vanno già bene");
  } catch (e){ if (force) toast("Non riesco adesso: " + e.message); }
  S.brRen = Date.now(); save(); brRetitle.busy = false; brRefresh();
}
function brRefresh(){ if (cur === "cervello" && !BR.edit) reView(); else if (cur === "oggi") refresh(); }
async function brWrite(path, text, msg){
  const old = (BR.files || []).find(f => f.path === path);
  let sha = old?.sha;
  for (let i = 0; i < 2; i++){
    const r = await brApi("contents/" + path.split("/").map(encodeURIComponent).join("/"), { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: msg || "Cervello: " + brName(path), content: b64e(text), ...(sha ? { sha } : {}) }) });
    if (r.ok){ const j = await r.json(); const f = { path, sha: j.content.sha, text };
      BR.files = [...(BR.files || []).filter(x => x.path !== path), f].sort((a, b) => a.path.localeCompare(b.path)); brSave(); return f; }
    if (r.status === 409 || r.status === 422){ const g = await brApi("contents/" + path + "?t=" + Date.now()); sha = g.ok ? (await g.json()).sha : undefined; continue; }
    throw new Error("GitHub " + r.status);
  }
  throw new Error("salvataggio non riuscito, riprova");
}
async function brDel(btn){
  if (!btn.dataset.ok){ btn.dataset.ok = 1; btn.innerHTML = "Sicuro? Elimina"; btn.classList.add("danger"); setTimeout(() => { if (btn.isConnected){ delete btn.dataset.ok; btn.innerHTML = ico("trash"); btn.classList.remove("danger"); } }, 4000); return; }
  const path = BR.open, f = (BR.files || []).find(x => x.path === path); if (!f) return;
  try {
    toast("Elimino…");
    let sha = f.sha;
    for (let i = 0; i < 2; i++){
      const r = await brApi("contents/" + path.split("/").map(encodeURIComponent).join("/"), { method: "DELETE", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: "Cervello: eliminata " + brName(path), sha }) });
      if (r.ok || r.status === 404) break;
      if ((r.status === 409 || r.status === 422) && i === 0){ const g = await brApi("contents/" + path + "?t=" + Date.now()); if (!g.ok) break; sha = (await g.json()).sha; continue; }
      throw new Error("GitHub " + r.status);
    }
    BR.files = (BR.files || []).filter(x => x.path !== path); brSave(); BR.open = null; BR.edit = false; toast("Nota eliminata"); reView();
  } catch (e){ toast("Non riesco a eliminarla: " + e.message); }

async function brAppend(path, line, title){

/* markdown essenziale, con [[collegamenti]] */
function brMd(text){
  const inl = s => esc(s)
    .replace(/\[\[([^\]|#]+)(?:\|([^\]]+))?\]\]/g, (m, n, a) => { const f = brFind(n.trim()); return `<a class="wl ${f ? "" : "miss"}" href="#" onclick="event.preventDefault();brOpenName(decodeURIComponent('${jq(n.trim())}'))">${a || n}</a>`; })
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/(^|\W)\*([^*\s][^*]*)\*/g, "$1<i>$2</i>").replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|\s)#([\p{L}\w-]+)/gu, '$1<span class="tag">#$2</span>');
  const out = []; let list = null;
  for (const raw of text.split("\n")){
    const l = raw.trimEnd(), m = l.match(/^\s*[-*]\s+(\[( |x)\]\s+)?(.*)$/i);
    if (m){ if (!list){ list = []; out.push(list); } list.push((m[1] ? (m[2].toLowerCase() === "x" ? "☑ " : "☐ ") : "") + inl(m[3])); continue; }
    list = null;
    const h = l.match(/^(#{1,3})\s+(.*)$/);
    if (h) out.push(`<h${h[1].length + 1}>${inl(h[2])}</h${h[1].length + 1}>`);
    else if (l.startsWith(">")) out.push(`<blockquote>${inl(l.replace(/^>\s?/, ""))}</blockquote>`);
    else if (l) out.push(`<p>${inl(l)}</p>`);
  }
  return out.map(x => Array.isArray(x) ? `<ul>${x.map(i => `<li>${i}</li>`).join("")}</ul>` : x).join("");
}

oppure {"azione":"rispondi","cerca":["parole chiave per trovare i file giusti"]}.
Regole: il diario del giorno è ${BR_DIR}diario/${brToday()}.md; se un file adatto esiste già usa quello; i nomi file nuovi sono minuscoli con trattini.
File esistenti (percorso | titolo):
${index || "(nessuno)"}` },
      { role: "user", content: q }], true);

/* grafo: punti = note, linee = [[collegamenti]] */
function brGraph(){
  const cv = document.getElementById("br-graph"); if (!cv) return;
  const files = BR.files || [], W2 = cv.clientWidth, H2 = cv.clientHeight, dpr = devicePixelRatio || 1;
  cv.width = W2 * dpr; cv.height = H2 * dpr; const g = cv.getContext("2d"); g.scale(dpr, dpr);
  const N = files.map((f, i) => ({ f, x: W2 / 2 + Math.cos(i * 2.4) * (40 + i * 6), y: H2 / 2 + Math.sin(i * 2.4) * (40 + i * 6), vx: 0, vy: 0, d: 0 }));
  const idx = new Map(files.map((f, i) => [f.path, i])), E = [];
  files.forEach((f, i) => brLinks(f.text).forEach(n => { const t = brFind(n); if (t && t.path !== f.path){ E.push([i, idx.get(t.path)]); N[i].d++; N[idx.get(t.path)].d++; } }));
  for (let it = 0; it < 260; it++){
    for (let a = 0; a < N.length; a++) for (let b = a + 1; b < N.length; b++){
      const dx = N[b].x - N[a].x, dy = N[b].y - N[a].y, d2 = dx * dx + dy * dy + 0.01, k = Math.min(8, 7000 / d2), d = Math.sqrt(d2);
      N[a].vx -= dx / d * k; N[a].vy -= dy / d * k; N[b].vx += dx / d * k; N[b].vy += dy / d * k;
    }
    for (const [a, b] of E){ const dx = N[b].x - N[a].x, dy = N[b].y - N[a].y, d = Math.hypot(dx, dy) || 1, f = (d - 110) * 0.03 / d; N[a].vx += dx * f; N[a].vy += dy * f; N[b].vx -= dx * f; N[b].vy -= dy * f; }
    for (const n of N){ n.vx += (W2 / 2 - n.x) * 0.003; n.vy += (H2 / 2 - n.y) * 0.003; n.x += n.vx * 0.5; n.y += n.vy * 0.5; n.vx *= 0.6; n.vy *= 0.6;
      n.x = Math.max(20, Math.min(W2 - 20, n.x)); n.y = Math.max(20, Math.min(H2 - 20, n.y)); }
  }
  g.strokeStyle = "rgba(160,180,255,.25)"; g.lineWidth = 1;
  for (const [a, b] of E){ g.beginPath(); g.moveTo(N[a].x, N[a].y); g.lineTo(N[b].x, N[b].y); g.stroke(); }
  g.font = "11px system-ui, sans-serif"; g.textAlign = "center";
  for (const n of N){ const r = 4 + Math.min(8, n.d * 1.5), c = BR_COL[brType(n.f.path)];
    g.beginPath(); g.arc(n.x, n.y, r, 0, 7); g.fillStyle = c; g.shadowColor = c; g.shadowBlur = 12; g.fill(); g.shadowBlur = 0;
    g.fillStyle = "rgba(230,235,245,.85)"; g.fillText(brTitle(n.f).slice(0, 22), n.x, n.y + r + 12); }
  cv.onclick = e => { const b = cv.getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top;
    let best = null, bd = 400; for (const n of N){ const d = (n.x - x) ** 2 + (n.y - y) ** 2; if (d < bd){ bd = d; best = n; } }
    if (best){ BR.open = best.f.path; BR.tab = "elenco"; BR.edit = false; reView(); } };
}

async function dsSync(){

    for (let i = 0; i < 3; i++){
      const g = await brApi("contents/dashboard.json?t=" + Date.now());

        const lt = S._t[k] || 0, rt = (remote.t || {})[k] || 0, has = remote.data && k in remote.data;
        if (has && (SY_LIST.includes(k) || k === "del")){

          if (mj !== snapOf(k)){ S[k] = merged; SY.snap[k] = snapOf(k); changed = true; }

          if (mj !== JSON.stringify(remote.data[k] ?? null)){ S._t[k] = Date.now(); push = true; }

      if (!push) break;
      for (const k of SYNC_KEYS) if (!S._t[k]) S._t[k] = 1;
      const body = { formato: "mia-dashboard", versione: 1, aggiornato: new Date().toISOString(), data: Object.fromEntries(SYNC_KEYS.map(k => [k, S[k] ?? null])), t: Object.fromEntries(SYNC_KEYS.map(k => [k, S._t[k]])) };
      const p = await brApi("contents/dashboard.json", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: "Dashboard: sincronizzazione", content: b64e(JSON.stringify(body, null, 1)), ...(sha ? { sha } : {}) }) });

  let rows = [], title = "Oggi";
  if (GC.ev){
    const today = evOn(now).filter(e => evAllDay(e) || evEnd(e) > now);
    if (today.length) rows = today.slice(0, 3).map(e => [evAllDay(e) ? "Tutto il giorno" : hhmm(evStart(e)), e]);
    else {
      title = "Prossimi";
      for (let i = 1; i < 8 && rows.length < 3; i++){ const d = new Date(now); d.setDate(d.getDate() + i);
        for (const e of evOn(d)) { if (rows.length < 3 && !rows.some(r => r[1] === e)) rows.push([(i === 1 ? "Domani" : cap(GIORNI[d.getDay()]).slice(0, 3) + " " + d.getDate()) + (evAllDay(e) ? "" : " " + hhmm(evStart(e))), e]); } }
    }
  }
  const body = !GC.ev ? `<div class="cw-none">${gcId() ? "Tocca per collegare Google Calendar" : "Tocca per aprire il calendario"}</div>`
    : rows.length ? `<div class="cw-h">${title}</div>${rows.map(([t, e]) => `<div class="cw-e"><i style="background:${esc(e.col)}"></i><div><b>${esc(e.t)}</b><small>${t}${e.where ? " · " + esc(e.where) : ""}</small></div></div>`).join("")}`
    : `<div class="cw-none">Nessun impegno nei prossimi giorni</div>`;
  return left + `<div class="cw-r">${body}</div>`;
}

/* aggiornamenti dell'app: su iPhone l'app aperta dall'icona resta in memoria con il codice vecchio.
   Quando torna in primo piano controllo se c'è una versione nuova e, appena è pronta, ricarico da solo. */
const APP_V = "53";
let swReg = null, bootAt = Date.now();
if ("serviceWorker" in navigator){
  const hadCtl = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(r => { swReg = r; r.update().catch(() => {}); }).catch(() => {});
  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (!hadCtl || reloading) return; reloading = true; location.reload(); });
}
async function checkAppUpdate(manual){
  try {
    const r = await fetch("version.txt", { cache: "no-store" }); const v = (await r.text()).trim();
    if (v && v !== APP_V){
      // al massimo un ricaricamento ogni 5 minuti per la stessa versione, per non entrare in un giro infinito
      let last = 0; try { last = +localStorage.getItem(KEY + "-upd-" + v) || 0; } catch {}
      if (!manual && Date.now() - last < 5 * 6e4) return;
      try { localStorage.setItem(KEY + "-upd-" + v, Date.now()); } catch {}
      if (manual) toast("Aggiorno l'app…"); swReg && await swReg.update().catch(() => {}); setTimeout(() => location.reload(), 600); return;
    }
    if (manual) toast("Hai già l'ultima versione");
  } catch { if (manual) toast("Nessuna connessione"); }
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) checkAppUpdate(false); });
