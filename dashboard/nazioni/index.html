<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050608">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="../icons/icon.svg">
<title>Nazioni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050608; --sea:#08101e; --land:#1b2233; --land-h:#273149; --border:#3a4560; --dim:#10151f;
  --glass:rgba(16,20,30,.78); --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.16);
  --ink:#eef1f7; --muted:#97a0b3; --faint:#5d6578;
  --target:#fbbf24; --ok:#34d399; --ko:#f43f5e; --blue:#2f7bff; --blue-2:#5b9bff;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:Sora,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
[hidden]{display:none!important}

/* ---------- mappa ---------- */
#map{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;background:radial-gradient(ellipse at 50% 40%,#0b1426 0%,#050608 75%)}
#map.drag{cursor:grabbing}
#map svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.sphere{fill:var(--sea);stroke:rgba(91,155,255,.18);stroke-width:1px;vector-effect:non-scaling-stroke}
.grat{fill:none;stroke:rgba(255,255,255,.035);stroke-width:1px;vector-effect:non-scaling-stroke}
.c{fill:var(--land);stroke:var(--border);stroke-width:.6px;vector-effect:non-scaling-stroke;stroke-linejoin:round;transition:fill .25s}
.c.t{fill:#141a27}
.c.off{fill:#0b0f17;stroke:#141a26}
@media (hover:hover){ body.explore .c:not(.t):hover,body.dove .c:not(.t):not(.off):hover{fill:var(--land-h)} }
.c.known{fill:#1d5a4a} .c.rip{fill:#6b2236}
.c.tg{fill:var(--target);stroke:#fff3c4;stroke-width:1.2px}
.c.ok{fill:var(--ok);stroke:#d1fae5;stroke-width:1.2px}
.c.ko{fill:var(--ko);stroke:#ffe4e6;stroke-width:1.2px}
.c.sel{fill:var(--blue-2);stroke:#dbeafe;stroke-width:1.2px}
.m{fill:rgba(255,255,255,.07);stroke:rgba(200,210,230,.55);stroke-width:1px;vector-effect:non-scaling-stroke}
.m.off{display:none}
.m.known{stroke:var(--ok)} .m.rip{stroke:var(--ko)}
.m.tg{fill:rgba(251,191,36,.35);stroke:var(--target);stroke-width:2px} .m.ok{fill:rgba(52,211,153,.35);stroke:var(--ok);stroke-width:2px} .m.ko{fill:rgba(244,63,94,.35);stroke:var(--ko);stroke-width:2px} .m.sel{fill:rgba(91,155,255,.35);stroke:var(--blue-2);stroke-width:2px}
.m.tg,.m.ok{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{stroke-opacity:.35}}
.glow{fill:none;stroke:var(--target);stroke-opacity:.45;stroke-width:7px;vector-effect:non-scaling-stroke;stroke-linejoin:round;pointer-events:none;animation:glow 1.6s ease-in-out infinite}
.glow.ok{stroke:var(--ok)}
@keyframes glow{50%{stroke-opacity:.12}}

#labels{position:fixed;inset:0;pointer-events:none;z-index:3}
.lab{position:absolute;transform:translate(-50%,-130%);padding:5px 10px;border-radius:10px;background:rgba(8,10,16,.88);border:1px solid var(--line-2);font-size:12.5px;font-weight:600;white-space:nowrap;box-shadow:0 8px 20px -8px #000}
.lab.ok{border-color:rgba(52,211,153,.7);color:#bbf7d0} .lab.ko{border-color:rgba(244,63,94,.7);color:#fecdd3} .lab.sel{border-color:rgba(91,155,255,.7)}
.lab small{display:block;font-weight:400;color:var(--muted);font-size:11px;margin-top:1px}
#tip{position:fixed;z-index:4;pointer-events:none;padding:4px 9px;border-radius:8px;background:rgba(8,10,16,.9);border:1px solid var(--line-2);font-size:12px;font-weight:500;display:none}

/* ---------- comandi mappa ---------- */
.zoom{position:fixed;right:16px;bottom:calc(20px + var(--safe-b));z-index:5;display:flex;flex-direction:column;gap:6px}
.zoom button{width:42px;height:42px;border-radius:14px;background:var(--glass);border:1px solid var(--line-2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:grid;place-items:center;font-size:20px;font-weight:500}
.zoom button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.zoom button:active{transform:scale(.94)}

/* ---------- pannelli ---------- */
.glass{background:var(--glass);border:1px solid var(--line-2);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);box-shadow:0 24px 50px -20px rgba(0,0,0,.8)}
#home{position:fixed;z-index:6;top:16px;left:16px;bottom:16px;width:380px;border-radius:26px;overflow-y:auto;padding:22px 20px 24px;display:flex;flex-direction:column;gap:18px;scrollbar-width:thin}
#home h1{font-size:24px;font-weight:700;letter-spacing:-.03em}
#home h1 + p{color:var(--muted);font-size:13px;margin-top:4px;line-height:1.5}
.prog{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;background:rgba(255,255,255,.035);border:1px solid var(--line)}
.ring{width:58px;height:58px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px}
.prog .tx{font-size:13px;color:var(--muted);line-height:1.55}
.prog .tx b{color:var(--ink);font-weight:600}
.modes{display:grid;gap:10px}
.mode{display:flex;align-items:center;gap:13px;text-align:left;padding:14px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid var(--line);transition:background .2s,transform .2s var(--ease)}
.mode:hover{background:rgba(255,255,255,.075)}
.mode:active{transform:scale(.98)}
.mode .ic{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:21px}
.mode b{display:block;font-size:15px;font-weight:600}
.mode span.d{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.4}
.mode .badge{margin-left:auto;min-width:26px;height:26px;padding:0 8px;border-radius:13px;background:var(--ko);font-size:12px;font-weight:600;display:grid;place-items:center;flex:none}
.mode[disabled]{opacity:.45;cursor:default}
.sec h3{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:9px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:7px 12px;border-radius:999px;border:1px solid var(--line-2);font-size:12.5px;color:var(--muted);background:rgba(255,255,255,.02)}
.chip.on{background:var(--ink);color:#0a0c12;border-color:var(--ink);font-weight:600}
.riplist{display:flex;flex-wrap:wrap;gap:6px}
.riplist button{padding:5px 10px;border-radius:9px;background:rgba(244,63,94,.12);border:1px solid rgba(244,63,94,.3);font-size:12.5px;color:#fecdd3}
.muted{color:var(--muted);font-size:12.5px;line-height:1.5}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.sync{font-size:11.5px;color:var(--faint);display:flex;align-items:center;gap:7px}
.sync i{width:7px;height:7px;border-radius:50%;background:#5d6578;flex:none}
.sync[data-st=ok] i{background:var(--ok)} .sync[data-st=err] i{background:var(--ko)} .sync[data-st=busy] i{background:var(--target)}

/* in gioco */
#qbar{position:fixed;z-index:6;top:16px;left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 32px));border-radius:22px;padding:12px 12px 12px 18px;display:flex;align-items:center;gap:12px}
#qbar .q{flex:1;min-width:0}
#qbar .q small{display:block;font-size:11.5px;color:var(--muted);letter-spacing:.02em}
#qbar .q b{display:block;font-size:19px;font-weight:600;letter-spacing:-.02em;line-height:1.25;margin-top:2px}
#qbar .q b em{font-style:normal;color:var(--target)}
.x{width:38px;height:38px;border-radius:12px;border:1px solid var(--line-2);display:grid;place-items:center;flex:none;color:var(--muted)}
.x svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.bar{height:3px;border-radius:2px;background:rgba(255,255,255,.08);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--ok));transition:width .4s var(--ease)}

#ans{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(18px + var(--safe-b));width:min(560px,calc(100% - 32px));border-radius:22px;padding:12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{padding:13px 12px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:14.5px;font-weight:500;min-height:50px;line-height:1.25;transition:background .2s}
.opt:hover{background:rgba(255,255,255,.1)}
.opt.ok{background:rgba(52,211,153,.22);border-color:var(--ok);color:#d1fae5}
.opt.ko{background:rgba(244,63,94,.2);border-color:var(--ko);color:#ffe4e6}
.opt[disabled]{cursor:default}
.type{position:relative}
.type input{width:100%;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid var(--line-2);font-size:16px;outline:none}
.type input:focus{border-color:var(--blue-2)}
.sugg{position:absolute;left:0;right:0;bottom:calc(100% + 6px);border-radius:14px;overflow:hidden;background:rgba(14,18,27,.97);border:1px solid var(--line-2)}
.sugg button{display:block;width:100%;text-align:left;padding:11px 16px;font-size:14px;border-bottom:1px solid var(--line)}
.sugg button:last-child{border-bottom:0}
.sugg button:hover,.sugg button.on{background:rgba(91,155,255,.18)}
.row{display:flex;gap:8px;margin-top:8px}
.btn{padding:11px 16px;border-radius:13px;background:rgba(255,255,255,.07);border:1px solid var(--line-2);font-weight:500;font-size:13.5px}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.btn.grow{flex:1}
.fb{display:flex;align-items:center;gap:12px}
.fb .ico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:19px;font-weight:700}
.fb.ok .ico{background:rgba(52,211,153,.2);color:var(--ok)} .fb.ko .ico{background:rgba(244,63,94,.2);color:var(--ko)}
.fb .t{flex:1;min-width:0}
.fb .t b{display:block;font-size:15.5px}
.fb .t span{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;line-height:1.4}
.hint{font-size:12.5px;color:var(--muted);text-align:center;padding:4px 0 2px}

/* fine partita */
#end{position:fixed;z-index:7;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100% - 32px));max-height:calc(100% - 40px);overflow-y:auto;border-radius:26px;padding:24px;text-align:center}
#end .big{font-size:46px;font-weight:700;letter-spacing:-.04em;margin:6px 0 2px}
#end h2{font-size:19px;font-weight:600}
#end .riplist{justify-content:center;margin:14px 0 4px}
#end .row{flex-wrap:wrap;margin-top:18px} #end .btn{white-space:nowrap}

/* esplora */
#exbar{position:fixed;z-index:6;top:16px;left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 32px));border-radius:22px;padding:12px 12px 12px 18px;display:flex;align-items:center;gap:12px}
#exbar .q{flex:1;min-width:0}
#exbar .q b{font-size:16px;font-weight:600}
#exbar .q small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
#excard{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(18px + var(--safe-b));width:min(420px,calc(100% - 32px));border-radius:22px;padding:14px 16px}
#excard b{font-size:18px;display:block}
#excard .muted{margin-top:3px}

@media (max-width:760px){
  #home{top:auto;left:0;right:0;bottom:0;width:auto;max-height:62%;border-radius:26px 26px 0 0;padding:18px 16px calc(20px + var(--safe-b));border-bottom:0}
  #home::before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin:-6px auto 2px;flex:none}
  #home h1{font-size:21px} #home h1 + p{display:none} #home{gap:14px}
  .zoom{top:calc(14px + var(--safe-t));bottom:auto;right:12px}
  body.home .zoom{display:none}
  body.play .zoom,body.explore .zoom{top:calc(104px + var(--safe-t))}
  #qbar,#exbar{top:calc(10px + var(--safe-t));width:calc(100% - 20px);padding:10px 10px 10px 14px;border-radius:18px}
  #qbar .q b{font-size:17px}
  #ans{bottom:calc(10px + var(--safe-b));width:calc(100% - 20px);padding:10px;border-radius:18px}
  .opt{font-size:14px;padding:11px 10px;min-height:46px}
  #excard{bottom:calc(10px + var(--safe-b));width:calc(100% - 20px)}
}
</style>
</head>
<body class="home">
<div id="map"><svg id="svg" aria-label="Mappa del mondo"><g id="world"></g></svg></div>
<div id="labels"></div>
<div id="tip"></div>
<div class="zoom">
  <button onclick="zoomBy(1.6)" aria-label="Ingrandisci">+</button>
  <button onclick="zoomBy(1/1.6)" aria-label="Rimpicciolisci">−</button>
  <button onclick="reframe()" aria-label="Inquadra"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>
<aside id="home" class="glass"></aside>
<div id="qbar" class="glass" hidden></div>
<div id="ans" class="glass" hidden></div>
<div id="end" class="glass" hidden></div>
<div id="exbar" class="glass" hidden></div>
<div id="excard" class="glass" hidden></div>

<script>
"use strict";
/* ============ dati ============ */
const ZONE = { mondo:"Tutto il mondo", eu:"Europa", as:"Asia", af:"Africa", na:"Nord e Centro America", sa:"Sud America", oc:"Oceania", isole:"Isole" };
/* nazioni che stanno tutte su isole (anche quelle che dividono un'isola con un vicino, come Haiti o Irlanda) */
const ISOLE = new Set("IS IE GB MT CY JP PH ID LK MV SG BH TW TL MG MU SC KM CV ST CU JM HT DO BS BB TT GD LC VC KN AG DM NZ PG FJ SB VU WS TO KI TV NR PW FM MH".split(" "));
const CONT_N = { eu:"Europa", as:"Asia", af:"Africa", na:"Nord e Centro America", sa:"Sud America", oc:"Oceania" };
const ALSO = { RU:["as"], TR:["eu"], KZ:["eu"], GE:["eu"], AZ:["eu"], AM:["eu"], EG:["as"] }; // paesi a cavallo di due continenti
const ALIAS = { US:["usa","america","stati uniti d'america","u.s.a."], GB:["uk","inghilterra","gran bretagna","united kingdom","britain"], NL:["olanda","holland","netherlands"], MM:["birmania","burma"], SZ:["swaziland"],
  CD:["congo","rd congo","repubblica democratica del congo","congo kinshasa","zaire"], CG:["congo brazzaville","repubblica del congo"], CZ:["cechia","czechia"], CI:["costa d'avorio","ivory coast"], KP:["nord corea"], KR:["sud corea"],
  VA:["citta del vaticano","santa sede","vatican"], MK:["macedonia"], TL:["timor leste"], CF:["repubblica centrafricana","centrafrica"], DO:["repubblica dominicana","santo domingo"], AE:["emirati","eau","uae","emirati arabi"],
  BA:["bosnia"], TT:["trinidad"], ST:["sao tome"], RU:["federazione russa"], BY:["belarus"], MD:["moldova"], KG:["kirghisia","kyrgyzstan"], PS:["palestine","stato di palestina"], VC:["saint vincent","st vincent"], KN:["saint kitts","st kitts"],
  AG:["antigua"], FM:["micronesia"], GW:["guinea bissau"], PG:["papua"], BH:["bahrain"], RW:["rwanda"], KZ:["kazakhstan","kazakistan"], TJ:["tajikistan"], CV:["cabo verde"], LK:["ceylon"], IR:["persia"], TH:["tailandia"],
  AZ:["azerbaijan"], DJ:["djibouti"], SS:["sud sudan","south sudan"], ZA:["sud africa","repubblica sudafricana"], LC:["st lucia"], SA:["arabia"], MC:["principato di monaco"], CH:["confederazione elvetica"], DE:["deutschland"] };
let M = null, C = {}, Q = [], NAMEIDX = [];

/* ============ stato (salvato nel telefono/PC e sincronizzato) ============ */
const LS = "nazioni-ale";
let S = { c:{}, opt:{ zona:"mondo", n:20, risp:"scelte" } };
try { const s = JSON.parse(localStorage.getItem(LS) || "null"); if (s) S = { ...S, ...s, opt:{ ...S.opt, ...(s.opt||{}) } }; } catch(e) {}
function save(){ try { localStorage.setItem(LS, JSON.stringify(S)); } catch(e) {} }
const st = k => S.c[k] || { ok:0, ko:0, s:0, r:0, t:0 };
function mark(k, good){
  const x = { ...st(k) };
  if (good){ x.ok++; x.s++; if (x.r && x.s >= 2) x.r = 0; }
  else { x.ko++; x.s = 0; x.r = 1; }
  x.t = Date.now(); S.c[k] = x; save(); syncSoon();
  return x;
}
function setRip(k, on){ const x = { ...st(k), r: on ? 1 : 0, s: 0, t: Date.now() }; S.c[k] = x; save(); syncSoon(); }
const isKnown = k => { const x = S.c[k]; return x && x.ok > 0 && !x.r; };
const ripList = () => Q.filter(k => S.c[k] && S.c[k].r);
const inZone = (k, z) => z === "mondo" || (z === "isole" ? ISOLE.has(k) : C[k].c === z || (ALSO[k] || []).includes(z));

/* ============ util ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
const shuffle = a => { for (let i = a.length - 1; i > 0; i--){ const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
function lev(a, b){ /* distanza tra parole; due lettere scambiate contano come un solo errore */
  const m = a.length, n = b.length, d = Array.from({ length:m + 1 }, (_, i) => [i, ...Array(n).fill(0)]); for (let j = 0; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++){ d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1); }
  return d[m][n]; }
function km(a, b){ const R = 6371, r = Math.PI / 180, dl = (b[1] - a[1]) * r, dn = (b[0] - a[0]) * r;
  const h = Math.sin(dl / 2) ** 2 + Math.cos(a[1] * r) * Math.cos(b[1] * r) * Math.sin(dn / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); }
const fmtKm = d => d < 100 ? "meno di 100 km" : "circa " + (Math.round(d / 50) * 50).toLocaleString("it-CH") + " km";

/* ============ mappa: disegno, zoom e trascinamento ============ */
const svg = $("#svg"), world = $("#world"), mapEl = $("#map");
const V = { k:1, x:0, y:0 }; let kMin = .5, kMax = 200, anim = null;
const PATH = {}, MARK = {};
function draw(){
  const NS = "http://www.w3.org/2000/svg";
  let h = `<path class="sphere" d="${M.sphere}"/><path class="grat" d="${M.grat}"/>`;
  for (const c of M.c) h += `<path class="c${c.q ? "" : " t"}" data-k="${c.k}" d="${c.d}"/>`;
  h += `<g id="glows"></g><g id="marks">`;
  for (const c of M.c) if (c.q && c.a < 3) h += `<circle class="m" data-k="${c.k}" cx="${c.x}" cy="${c.y}" r="1"/>`;
  world.innerHTML = h + `</g>`;
  world.querySelectorAll(".c").forEach(p => PATH[p.dataset.k] = p);
  world.querySelectorAll(".m").forEach(p => MARK[p.dataset.k] = p);
}
function rect(){ /* parte di schermo libera dai pannelli, dove inquadrare */
  const W = innerWidth, H = innerHeight, phone = W <= 760;
  let l = 0, t = 0, r = W, b = H;
  const vis = id => { const e = document.getElementById(id); return e && !e.hidden ? e.getBoundingClientRect() : null; };
  const home = vis("home"), qb = vis("qbar") || vis("exbar"), an = vis("ans") || vis("excard");
  if (home){ if (phone) b = home.top; else l = home.right; }
  if (qb) t = Math.max(t, qb.bottom); if (an) b = Math.min(b, an.top);
  if (phone && !home) t = Math.max(t, 0);

/* gesti: un dito trascina, due dita zoomano, rotellina zooma; un tocco senza movimento è una "scelta" */

/* ============ partita ============ */
let G = null;
function start(mode, ripasso = false){

  pool = shuffle(pool.slice());
  /* prima quelle mai viste o sbagliate, poi le altre */
  if (!ripasso) pool.sort((a, b) => score(a) - score(b) + (Math.random() - .5) * .8);
  const n = ripasso ? pool.length : (S.opt.n || pool.length);
  G = { mode, mix: mode === "misto", ripasso, zona: z, list: pool.slice(0, n), i: -1, ok: 0, ko: 0, wrong: [], cur: null, wait: false };
  document.body.className = "play"; paint(); next();
}
function score(k){ const x = S.c[k]; if (!x) return 0; if (x.r) return -1; return Math.min(3, x.ok) - x.ko * .5; }
function next(){
  G.i++; setLabels([]); paint();
  if (G.i >= G.list.length) return finish();
  G.cur = G.list[G.i]; G.wait = false;
  G.qmode = G.mix ? (Math.random() < .5 ? "nome" : "dove") : G.mode;
  document.body.className = "play " + (G.qmode === "dove" ? "dove" : "nome");
  G.mode = G.mix ? G.qmode : G.mode;

    hl(G.cur, "tg");
    if (S.opt.risp === "scrivo") askType(); else askChoices();
    requestAnimationFrame(() => goTo(focusView(G.cur)));
  } else {
    $("#qbar").innerHTML = `<div class="q"><small>${prog}</small><b>Dov'è <em>${esc(C[G.cur].n)}</em>?</b><div class="bar"><i style="width:${pct}%"></i></div></div>${exitBtn()}`;

/* risposta: 4 scelte, con i paesi vicini come trappole (sono quelli che si confondono) */
function askChoices(){
  const c = C[G.cur];
  /* nelle Isole le trappole sono altre nazioni-isola */
  const cand = G.zona === "isole" ? Q.filter(k => ISOLE.has(k)) : Q;
  const near = cand.filter(k => k !== G.cur).map(k => [k, Math.hypot(C[k].x - c.x, C[k].y - c.y)]).sort((a, b) => a[1] - b[1]).slice(0, 7).map(a => a[0]);
  const pick = shuffle(near).slice(0, 2);
  const far = shuffle(cand.filter(k => k !== G.cur && !pick.includes(k) && C[k].c === c.c)); pick.push(far[0] || shuffle(cand.filter(k => k !== G.cur && !pick.includes(k)))[0]);

  $("#ans").innerHTML = `<div class="opts">${opts.map(k => `<button class="opt" data-k="${k}" onclick="answerNome('${k}')">${esc(C[k].n)}</button>`).join("")}</div>
    <div class="row"><button class="btn grow" onclick="answerNome(null)">Non lo so</button></div>`;

function askType(){
  $("#ans").innerHTML = `<div class="type"><div class="sugg" id="sugg" hidden></div><input id="ty" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Scrivi il nome…" enterkeyhint="done"></div>
    <div class="row"><button class="btn" onclick="answerNome(null)">Non lo so</button><button class="btn blue grow" onclick="submitType()">Conferma</button></div>`;
  const inp = $("#ty"); let sel = -1;
  inp.addEventListener("input", () => { sel = -1; suggest(inp.value, sel); });
  inp.addEventListener("keydown", e => {
    const items = [...document.querySelectorAll("#sugg button")];
    if (e.key === "ArrowDown" || e.key === "ArrowUp"){ e.preventDefault(); if (!items.length) return; sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length; suggest(inp.value, sel); }
    if (e.key === "Enter"){ e.preventDefault(); e.stopPropagation(); if (sel >= 0 && items[sel]) inp.value = items[sel].textContent; submitType(); }
  });

}
function suggest(v, sel){
  const s = $("#sugg"), n = norm(v);
  if (n.length < 2){ s.hidden = true; return; }
  const hits = NAMEIDX.filter(x => x.a.some(a => a.startsWith(n) || (n.length >= 3 && a.includes(" " + n)))).slice(0, 5);
  if (!hits.length){ s.hidden = true; return; }
  s.hidden = false; s.innerHTML = hits.map((x, i) => `<button class="${i === sel ? "on" : ""}" onmousedown="event.preventDefault()" onclick="$('#ty').value=this.textContent;submitType()">${esc(C[x.k].n)}</button>`).join("");
}
function matchName(v){
  const n = norm(v); if (!n) return null;
  for (const x of NAMEIDX) if (x.a.includes(n)) return x.k;
  /* piccoli errori di battitura: accetto solo se c'è un solo paese abbastanza vicino */
  let best = null, bd = 9, second = 9;
  for (const x of NAMEIDX) for (const a of x.a){ const d = lev(a, n); if (d < bd){ if (best !== x.k) second = bd; bd = d; best = x.k; } else if (d < second && x.k !== best) second = d; }
  const tol = n.length >= 9 ? 2 : n.length >= 4 ? 1 : 0;
  return bd <= tol && second > bd ? best : null;

function submitType(){ const v = $("#ty").value; if (!v.trim()) return; const k = matchName(v); answerNome(k || "?" + v); }

function answerNome(k){
  if (G.wait) return; G.wait = true;
  const good = k === G.cur;
  document.querySelectorAll(".opt").forEach(b => { b.disabled = true; if (b.dataset.k === G.cur) b.classList.add("ok"); else if (b.dataset.k === k) b.classList.add("ko"); });
  const x = mark(G.cur, good); good ? G.ok++ : (G.ko++, G.wrong.push(G.cur));
  hl(G.cur, good ? "ok" : "ko");
  setLabels([{ k:G.cur, cls: good ? "ok" : "ko" }]);
  const said = k && k[0] === "?" ? k.slice(1) : k ? C[k].n : null;
  feedback(good, good ? "Giusto! " + C[G.cur].n : "Era " + C[G.cur].n,
    good ? (x.r ? "Ancora una giusta e esce dal ripasso" : x.ok === 1 && !G.ripasso ? "Nuova nazione imparata" : CONT_N[C[G.cur].c]) : (said ? `Hai risposto ${said}. ` : "") + "L'ho messa nel ripasso");
}
function answerDove(k, sx, sy){
  if (G.wait) return;
  /* tocco vicinissimo al centro di un paese minuscolo: vale come giusto */
  const c = C[G.cur];
  if (k !== G.cur && sx != null){ const [tx, ty] = screenOf(c.x, c.y); if (Math.hypot(tx - sx, ty - sy) < (matchMedia("(pointer:coarse)").matches ? 24 : 16)) k = G.cur; }
  G.wait = true;

  hl(G.cur, "ok");
  const labs = [{ k:G.cur, cls:"ok" }];
  let sub;
  if (!good && k && C[k]){ hl(k, "ko"); labs.push({ k, cls:"ko", sub:"hai toccato" }); sub = `Hai toccato ${C[k].n}, a ${fmtKm(km(C[k].ll, c.ll))}. L'ho messa nel ripasso`; }
  else if (!good) sub = k === null && sx == null ? "L'ho messa nel ripasso" : "Hai toccato il mare. L'ho messa nel ripasso";
  setLabels(labs);
  /* inquadro la risposta giusta (e quella sbagliata, se vicina) */
  let b = c.b.slice();
  if (!good && k && C[k] && km(C[k].ll, c.ll) < 4000){ const q = C[k].b; b = [Math.min(b[0], q[0]), Math.min(b[1], q[1]), Math.max(b[2], q[2]), Math.max(b[3], q[3])]; }
  feedback(good, good ? "Giusto! " + c.n : "Ecco dov'è " + c.n, good ? (x.r ? "Ancora una giusta e esce dal ripasso" : CONT_N[c.c]) : sub);
  requestAnimationFrame(() => goTo(fitBox(b, .6, 70)));
}
function feedback(good, title, sub){
  $("#ans").innerHTML = `<div class="fb ${good ? "ok" : "ko"}"><span class="ico">${good ? "✓" : "✗"}</span><span class="t"><b>${esc(title)}</b><span>${esc(sub || "")}</span></span>
    <button class="btn blue" id="nx" onclick="next()">${G.i + 1 >= G.list.length ? "Fine" : "Avanti"}</button></div>`;
  const nx = $("#nx"); if (!matchMedia("(pointer:coarse)").matches) nx.focus();
  if (good){ clearTimeout(G.auto); const i = G.i; G.auto = setTimeout(() => { if (G && G.i === i && G.wait) next(); }, 1400); }
}
document.addEventListener("keydown", e => { if (e.key === "Enter" && G && G.wait && document.activeElement?.id !== "ty"){ e.preventDefault(); next(); }
  if (e.key === "Escape"){ if (G) quit(); else if (EX) home(); }
  if (G && !G.wait && G.qmode === "nome" && S.opt.risp === "scelte" && /^[1-4]$/.test(e.key)){ const b = document.querySelectorAll(".opt")[+e.key - 1]; if (b) b.click(); } });
function finish(){
  const tot = G.ok + G.ko, wrong = [...new Set(G.wrong)];
  setLabels([]); paint(); document.body.className = "home"; showOnly("end");
  const pct = tot ? Math.round(G.ok / tot * 100) : 0;
  $("#end").innerHTML = `<h2>${pct >= 90 ? "Fantastico!" : pct >= 70 ? "Bravo!" : pct >= 40 ? "Buon allenamento" : "Si comincia così"}</h2>
    <div class="big">${G.ok}<span style="color:var(--faint);font-weight:500">/${tot}</span></div>
    <p class="muted">${pct}% giuste${G.ripasso ? " nel ripasso" : ""}</p>
    ${wrong.length ? `<p class="muted" style="margin-top:14px">Da ripassare (le trovi nel Ripasso):</p><div class="riplist">${wrong.map(k => `<button onclick="explore('${k}')">${esc(C[k].n)}</button>`).join("")}</div>` : `<p class="muted" style="margin-top:14px">Nessun errore. Niente da aggiungere al ripasso.</p>`}
    <div class="row">${wrong.length ? `<button class="btn blue grow" onclick="startList(${JSON.stringify(wrong).replace(/"/g, "'")})">Ripassa questi</button>` : ""}<button class="btn grow" onclick="start('${G.mix ? "misto" : G.mode}',${G.ripasso})">Gioca ancora</button><button class="btn grow" onclick="home()">Menu</button></div>`;
  goTo(fitBox(zoneBox(G.zona), .95));
}
function startList(list){ G = { mode:"misto", mix:true, ripasso:true, zona:"mondo", list:shuffle(list.slice()), i:-1, ok:0, ko:0, wrong:[], cur:null, wait:false }; document.body.className = "play"; paint(); next(); }

/* ============ esplora ============ */
let EX = null;
function explore(k){
  G = null; EX = { k:null }; document.body.className = "explore"; showOnly("exbar"); paint();
  $("#exbar").innerHTML = `<div class="q"><b>Esplora</b><small>Tocca una nazione per vedere come si chiama</small></div>${`<button class="x" onclick="home()" aria-label="Chiudi"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>`}`;
  setLabels([]);
  if (k) exPick(k, true); else requestAnimationFrame(() => goTo(fitBox(zoneBox("mondo"), .95)));
}
function exPick(k, zoom){
  paint(); if (!k || !C[k]){ EX.k = null; $("#excard").hidden = true; setLabels([]); return; }
  const c = C[k]; EX.k = k;
  if (!c.q){ setLabels([{ k, t:c.n, sub:"territorio, non è nel gioco" }]); $("#excard").hidden = true; return; }
  hl(k, "sel"); const x = st(k);
  setLabels([{ k, cls:"sel" }]);
  $("#excard").hidden = false;
  $("#excard").innerHTML = `<b>${esc(c.n)}</b><div class="muted">${esc(CONT_N[c.c] || "")}${x.ok || x.ko ? ` · ✓ ${x.ok}  ✗ ${x.ko}` : " · mai chiesta"}${x.r ? " · da ripassare" : ""}</div>
    <div class="row"><button class="btn grow" onclick="setRip('${k}',${x.r ? 0 : 1});exPick('${k}')">${x.r ? "Togli dal ripasso" : "Aggiungi al ripasso"}</button></div>`;
  if (zoom) requestAnimationFrame(() => goTo(focusView(k)));
}

/* ============ sincronizzazione (stessa repository privata della dashboard) ============ */
const SYNC_FILE = "nazioni/stato.json";
const syCfg = () => { let gh = "", repo = ""; try { gh = localStorage.getItem("pc_gh") || ""; repo = localStorage.getItem("pc_repo") || "CyberGanna/portale-dati"; } catch(e) {} return { gh, repo }; };
const b64e = str => { const u = new TextEncoder().encode(str); let b = ""; for (let i = 0; i < u.length; i += 0x8000) b += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(b); };
const b64d = b => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g, "")), c => c.charCodeAt(0)));
const SY = { busy:false, again:false, err:"", last:0, timer:null };
function syncSoon(ms = 2000){ if (!syCfg().gh) return; clearTimeout(SY.timer); SY.timer = setTimeout(syncNow, ms); }
async function syncNow(){
  if (!syCfg().gh){ renderSync(); return; } if (SY.busy){ SY.again = true; return; }
  SY.busy = true; SY.err = ""; renderSync();
  try { for (let i = 0; i < 3; i++){ try { await syncOnce(); break; } catch(e){ if (e.status === 409 || e.status === 422) continue; throw e; } } SY.last = Date.now(); }
  catch(e){ SY.err = String(e.message || e); console.warn("sync nazioni", e); }
  SY.busy = false; renderSync(); if (SY.again){ SY.again = false; syncSoon(300); }
}
async function syncOnce(){
  const c = syCfg(), url = `https://api.github.com/repos/${c.repo}/contents/${SYNC_FILE}`, H = { Authorization:"Bearer " + c.gh, Accept:"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28" };
  let rem = { v:1, c:{} }, sha;
  const r = await fetch(url + "?t=" + Date.now(), { cache:"no-store", headers:H });
  if (r.ok){ const j = await r.json(); sha = j.sha; try { rem = { ...rem, ...JSON.parse(b64d(j.content || "")) }; } catch(e) {} }
  else if (r.status === 401) throw new Error("la chiave GitHub non è valida");
  else if (r.status !== 404) throw new Error("GitHub " + r.status);
  let dirty = false, changed = false;
  for (const k of new Set([...Object.keys(S.c), ...Object.keys(rem.c || {})])){
    const a = S.c[k], b = rem.c[k];
    if (b && (!a || b.t > a.t)){ S.c[k] = b; changed = true; }
    else if (a && (!b || a.t > b.t)){ rem.c[k] = a; dirty = true; }
  }
  if (changed){ save(); if (!G && !EX) home(); }
  if (dirty){
    const p = await fetch(url, { method:"PUT", headers:{ ...H, "Content-Type":"application/json" }, body:JSON.stringify({ message:"Nazioni: progressi", content:b64e(JSON.stringify(rem)), ...(sha ? { sha } : {}) }) });
    if (!p.ok){ const e = new Error(p.status === 403 ? "la chiave GitHub non può scrivere" : "GitHub " + p.status); e.status = p.status; throw e; }
  }
}
function renderSync(){
  const el = $("#sync"); if (!el) return; const on = !!syCfg().gh;
  el.dataset.st = !on ? "off" : SY.err ? "err" : SY.busy ? "busy" : "ok";
  el.querySelector("span").textContent = !on ? "Progressi salvati su questo dispositivo (aprila dalla dashboard per averli uguali su PC e iPhone)"
    : SY.err ? "Non riesco a sincronizzare: " + SY.err : SY.busy ? "Sincronizzo…" : "Progressi uguali su PC, iPhone e iPad";
}
setInterval(() => { if (document.visibilityState === "visible" && !G) syncNow(); }, 90000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") syncSoon(300); });

/* ============ avvio ============ */
addEventListener("resize", () => { if (!M) return; if (!G && !EX) goTo(fitBox(zoneBox(S.opt.zona), .95), 0); else apply(); });
(async function init(){
  try {
    M = await (await fetch("mappa.json")).json();
  } catch(e){ document.body.innerHTML = `<p style="padding:30px;color:#fda4af">Non riesco a caricare la mappa. Controlla la connessione e riapri.</p>`; return; }
  for (const c of M.c) C[c.k] = c;
  Q = M.c.filter(c => c.q).map(c => c.k);
  NAMEIDX = Q.map(k => { const c = C[k]; return { k, a:[...new Set([c.n, c.en, c.en2, ...(ALIAS[k] || [])].map(norm))] }; });
  draw();
  kMin = Math.min(innerWidth / M.W, innerHeight / M.H) * .6; kMax = kMin * 400;
  Object.assign(V, fitBox([0, 0, M.W, M.H], .95)); apply();
  home(); syncSoon(400);
})();
</script>
